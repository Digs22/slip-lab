<style>
/* Layout: one phone-width column of frosted glass cards floating over a night-stadium light field, bottom tab bar like a sportsbook. Dark only by design. */
:root {
  color-scheme: dark;
  --night: #070b16;
  --night-2: #0d1426;
  --glass: rgba(148, 170, 255, 0.075);
  --glass-hi: rgba(170, 190, 255, 0.14);
  --rim: rgba(200, 215, 255, 0.16);
  --rim-hi: rgba(225, 235, 255, 0.34);
  --ink: #eef2ff;
  --ink-2: #a6b0cf;
  --ink-3: #6f7a9c;
  --floodlight: #8fb4ff;
  --violet: #a58bff;
  --win: #4ee0a6;
  --loss: #ff6f7d;
  --push: #f2c65c;
  --display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 22px;
  --r-sm: 14px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--night); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
}
.field { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; background:
  radial-gradient(60vmax 40vmax at 12% -6%, rgba(98, 132, 255, 0.34), transparent 60%),
  radial-gradient(50vmax 36vmax at 105% 18%, rgba(165, 120, 255, 0.24), transparent 60%),
  radial-gradient(70vmax 40vmax at 50% 112%, rgba(40, 210, 170, 0.12), transparent 60%),
  linear-gradient(180deg, var(--night-2), var(--night)); }
.field::after { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px); background-size: 100% 44px; mask-image: linear-gradient(180deg, transparent, #000 40%, transparent); }
.app { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px calc(96px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }

.glass { background: linear-gradient(160deg, var(--glass-hi), var(--glass) 46%); border: 1px solid var(--rim);
  border-radius: var(--r); backdrop-filter: blur(22px) saturate(160%); -webkit-backdrop-filter: blur(22px) saturate(160%);
  box-shadow: inset 0 1px 0 var(--rim-hi), 0 18px 40px -22px rgba(0,0,0,.7); }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand b { font-family: var(--display); font-size: 24px; font-weight: 800; letter-spacing: .02em; text-transform: uppercase; line-height: 1; }
.brand small { display: block; color: var(--ink-3); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; }
.pnl-pill { font-family: var(--display); font-weight: 700; font-size: 20px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--rim); background: var(--glass); }
.up { color: var(--win); } .down { color: var(--loss); } .flat { color: var(--ink-2); }

h1, h2, h3 { margin: 0; font-family: var(--display); text-transform: uppercase; letter-spacing: .03em; text-wrap: balance; }
h2 { font-size: 15px; font-weight: 700; color: var(--ink-2); letter-spacing: .12em; }
.eyebrow { font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }

.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px; margin: 0 -2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; font: 600 13.5px var(--body); color: var(--ink-2); padding: 8px 14px; border-radius: 999px; border: 1px solid var(--rim); background: var(--glass); cursor: pointer; }
.chip[aria-pressed="true"] { color: var(--night); background: var(--ink); border-color: var(--ink); }
.chip .n { opacity: .6; margin-left: 4px; }

.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; font-size: 13.5px; color: var(--ink-2); border-radius: var(--r-sm); }
.banner .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--push); margin-top: 6px; flex: none; box-shadow: 0 0 10px var(--push); }

.game { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.game-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.matchup { font-family: var(--display); font-size: 28px; font-weight: 800; line-height: 1; letter-spacing: .01em; text-transform: uppercase; }
.matchup .at { color: var(--ink-3); font-weight: 600; margin: 0 6px; }
.meta { color: var(--ink-3); font-size: 12.5px; margin-top: 4px; }
.status { flex: none; font: 700 11px var(--body); letter-spacing: .1em; text-transform: uppercase; padding: 5px 9px; border-radius: 999px; border: 1px solid currentColor; }
.status.pending { color: var(--floodlight); } .status.live { color: var(--loss); } .status.final { color: var(--ink-2); } .status.prov { color: var(--push); }

.plays { display: grid; gap: 8px; }
.play { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 12px 12px 14px; border-radius: var(--r-sm); background: rgba(10, 16, 34, .45); border: 1px solid rgba(200,215,255,.08); position: relative; overflow: hidden; }
.play::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 3px; background: var(--tier); }
.play[data-play="straight"] { --tier: var(--floodlight); } .play[data-play="safer"] { --tier: var(--win); }
.play[data-play="best"] { --tier: var(--violet); } .play[data-play="longshot"] { --tier: var(--push); }
.play-name { font: 700 11.5px var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--tier); display: flex; gap: 8px; align-items: center; }
.stars { color: var(--ink-3); letter-spacing: 1px; font-size: 11px; }
.legs { grid-column: 1; font-size: 14.5px; font-weight: 500; min-width: 0; }
.legs span { display: block; }
.legs .r-win::after { content: " ✓"; color: var(--win); } .legs .r-loss { color: var(--ink-3); text-decoration: line-through; }
.price { grid-column: 2; grid-row: 1 / span 2; text-align: right; display: flex; flex-direction: column; justify-content: center; }
.price .odds { font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1; }
.price .stake { font-size: 12px; color: var(--ink-2); margin-top: 4px; white-space: nowrap; }
.result-tag { font: 700 11px var(--body); letter-spacing: .1em; text-transform: uppercase; }
.game-foot { display: flex; justify-content: space-between; color: var(--ink-2); font-size: 13px; border-top: 1px solid rgba(200,215,255,.08); padding-top: 10px; }

.tiles { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(220px, 1fr); gap: 10px; overflow-x: auto; scrollbar-width: none; padding: 2px; margin: 0 -2px; }
.tiles::-webkit-scrollbar { display: none; }
.tile { padding: 14px; display: grid; gap: 10px; justify-items: center; text-align: center; cursor: pointer; color: inherit; font: inherit; }
.tile .logos { display: flex; align-items: center; gap: 12px; }
.tile .vs { font-family: var(--display); color: var(--ink-3); font-weight: 600; font-size: 18px; }
.tile .time { font-family: var(--display); font-weight: 700; font-size: 20px; letter-spacing: .02em; text-transform: uppercase; line-height: 1; }
.tile .where { color: var(--ink-2); font-size: 12.5px; line-height: 1.3; }
.logo { width: var(--s, 56px); height: var(--s, 56px); border-radius: 50%; display: grid; place-items: center; flex: none; background: radial-gradient(circle at 30% 25%, rgba(255,255,255,.18), rgba(255,255,255,.04)); border: 1px solid var(--rim); overflow: hidden; }
.logo img { width: 78%; height: 78%; object-fit: contain; }
.logo b { font-family: var(--display); font-weight: 800; font-size: calc(var(--s, 56px) * .34); letter-spacing: .02em; color: #fff; }
.logo.badge { background: linear-gradient(150deg, var(--c1), var(--c2)); border-color: rgba(255,255,255,.22); box-shadow: inset 0 1px 0 rgba(255,255,255,.25); }
.matchup-row { display: flex; align-items: center; gap: 10px; }
.placed-btn { grid-column: 1 / -1; justify-self: start; font: 600 12.5px var(--body); color: var(--ink-2); background: transparent; border: 1px solid var(--rim); border-radius: 999px; padding: 6px 12px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.placed-btn[aria-pressed="true"] { color: var(--night); background: var(--win); border-color: var(--win); }
.placed-all { font: 600 12.5px var(--body); color: var(--ink); background: rgba(170,190,255,.12); border: 1px solid var(--rim); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.placed-all[aria-pressed="true"] { color: var(--night); background: var(--win); border-color: var(--win); }
.seg { display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: 16px; gap: 4px; }
.seg button { font: 700 13.5px var(--body); color: var(--ink-2); background: none; border: 0; border-radius: 12px; padding: 10px; cursor: pointer; }
.seg button[aria-pressed="true"] { color: var(--night); background: var(--ink); }
.hero-grid { display: grid; grid-template-columns: 1fr 76px; gap: 14px; align-items: stretch; }
.hero-main { display: grid; gap: 14px; min-width: 0; }
.meter { display: grid; grid-template-rows: auto 1fr auto; justify-items: center; gap: 6px; padding: 10px 6px; border-radius: var(--r-sm); background: rgba(10,16,34,.45); border: 1px solid rgba(200,215,255,.08); }
.meter svg { width: 100%; height: 100%; min-height: 220px; }
.meter svg text { font: 600 10.5px var(--body); }
.meter .lab { font: 700 10.5px var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.kelly-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
.kelly-art svg { width: 100%; height: auto; display: block; }
.kelly-art svg text { font: 11px var(--body); fill: var(--ink-3); }
@media (max-width: 520px) { .kelly-grid { grid-template-columns: 1fr; } }
.empty { padding: 26px 18px; text-align: center; color: var(--ink-2); }
.empty b { display: block; font-family: var(--display); font-size: 20px; text-transform: uppercase; color: var(--ink); margin-bottom: 4px; }

.hero { padding: 18px; display: grid; gap: 14px; }
.big { font-family: var(--display); font-weight: 800; font-size: clamp(48px, 15vw, 68px); line-height: .9; letter-spacing: -.01em; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { padding: 10px; border-radius: var(--r-sm); background: rgba(10,16,34,.45); border: 1px solid rgba(200,215,255,.08); }
.stat b { display: block; font-family: var(--display); font-size: 22px; font-weight: 700; line-height: 1.1; }
.stat span { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .1em; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--ink-3); font: 11px var(--body); }

.card { padding: 16px; display: grid; gap: 12px; }
.table-wrap { overflow-x: auto; margin: 0 -4px; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; font: 600 11px var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); padding: 6px 4px; }
td { padding: 8px 4px; border-top: 1px solid rgba(200,215,255,.07); }
td.num, th.num { text-align: right; }

.bet-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 10px 0; border-top: 1px solid rgba(200,215,255,.07); }
.bet-row:first-child { border-top: 0; }
.bet-row .t { font-weight: 600; font-size: 14px; min-width: 0; }
.bet-row .s { color: var(--ink-3); font-size: 12.5px; grid-column: 1; }
.bet-row .v { grid-column: 2; grid-row: 1 / span 2; text-align: right; font-family: var(--display); font-weight: 700; font-size: 19px; align-self: center; }

.slider { display: grid; gap: 6px; }
.slider label { display: flex; justify-content: space-between; font-weight: 600; font-size: 14px; }
.slider label output { font-family: var(--display); font-size: 20px; font-weight: 700; color: var(--floodlight); }
.slider small { color: var(--ink-3); font-size: 12.5px; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; background: transparent; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 6px; background: linear-gradient(90deg, var(--floodlight) var(--fill, 50%), rgba(200,215,255,.14) var(--fill, 50%)); }

.split-bar { display: flex; height: 12px; border-radius: 12px; overflow: hidden; gap: 2px; }

.bars { display: grid; gap: 8px; }
.bar { display: grid; grid-template-columns: 110px 1fr 44px; gap: 10px; align-items: center; font-size: 13px; }
.bar .track { height: 8px; border-radius: 8px; background: rgba(200,215,255,.1); overflow: hidden; }

.rule { padding: 12px 0; border-top: 1px solid rgba(200,215,255,.07); }
.rule:first-of-type { border-top: 0; }
.rule p { margin: 0; font-weight: 600; }

.field-row { display: grid; gap: 6px; }
.field-row label { font-weight: 600; font-size: 14px; }
.field-row input[type=password], .field-row input[type=text] { font: 500 15px var(--body); color: var(--ink); background: rgba(10,16,34,.6); border: 1px solid var(--rim); border-radius: 12px; padding: 12px; width: 100%; }
.toggles { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { font: 700 14px var(--body); color: var(--night); background: var(--ink); border: 0; border-radius: 12px; padding: 12px 16px; cursor: pointer; }
.note { color: var(--ink-3); font-size: 12.5px; }
.note a { color: var(--floodlight); }

@media (max-width: 400px) { .stats { grid-template-columns: repeat(2, 1fr); } .matchup { font-size: 24px; } .bar { grid-template-columns: 90px 1fr 40px; } }
@media (prefers-reduced-motion: no-preference) { .view > * { animation: rise .35s ease both; } @keyframes rise { from { transform: translateY(6px); opacity: .6; } } }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .glass { background: rgba(22, 30, 54, .92); } }

      ${open.length ? `<h2>Top games</h2><div class="tiles">${open.slice().sort((a, b) => (a.start || a.date).localeCompare(b.start || b.date)).map(g => { const [a, h] = teamsOf(g); return `<button class="tile glass" data-jump="g-${esc(g.key.replace(/[^a-z0-9]/gi, ""))}" aria-label="${esc(g.game)}"><span class="logos">${logo(g.league, a)}<span class="vs">@</span>${logo(g.league, h)}</span><span class="time">${esc(g.start ? new Date(g.start).toLocaleString("en-US", { timeZone: "America/New_York", weekday: "short", hour: "numeric", minute: "2-digit" }) : g.date)}</span><span class="where" style="margin-top:-6px">${esc(g.start ? new Date(g.start).toLocaleDateString("en-US", { timeZone: "America/New_York", month: "short", day: "numeric" }) + " · ET" : "")}</span><span class="where">${esc(g.venue || "")}${g.city ? "<br>" + esc(g.city) : ""}</span></button>`; }).join("")}</div>` : ""}
      <h2>Open slips</h2>
      ${open.length ? open.map(gameCard).join("") : `<div class="empty glass"><b>No ${league === "ALL" ? "" : label + " "}picks yet</b>The next run is at 7:59 AM ET. Games still waiting on lineups re-check every 30 minutes.</div>`}
      ${done.length ? `<h2>Recently settled</h2>${done.map(gameCard).join("")}` : ""}
      <p class="note">Odds are the line at pick time. Your book's price may differ. Only bet what you can afford to lose. Help: 1-800-GAMBLER.</p>`;
  }

  function curveSVG(bets) {
    const s = bets.filter(b => ["win", "loss", "push"].includes(b.status)).sort((a, b) => a.date.localeCompare(b.date) || a.id.localeCompare(b.id));
    if (!s.length) return `<p class="note">The chart starts after the first graded bet.</p>`;
    let run = 0; const pts = [{ v: 0, label: "Start" }, ...s.map(b => ({ v: run += betNetUnits(b) * prefs.unit, label: b.date.slice(5) }))];
    const W = 520, H = 170, pl = 44, pr = 12, pt = 14, pb = 26;
    const lo = Math.min(0, ...pts.map(p => p.v)), hi = Math.max(0, ...pts.map(p => p.v));
    const span = (hi - lo) || 1, pad = span * 0.15, y0 = lo - pad, y1 = hi + pad;
    const X = i => pl + i * (W - pl - pr) / Math.max(pts.length - 1, 1), Y = v => pt + (y1 - v) / (y1 - y0) * (H - pt - pb);
    const line = pts.map((p, i) => `${i ? "L" : "M"}${X(i).toFixed(1)} ${Y(p.v).toFixed(1)}`).join("");
    const last = pts.at(-1), col = last.v >= 0 ? "var(--win)" : "var(--loss)";
    const ticks = [y0 + pad, 0, y1 - pad].filter((v, i, a) => a.indexOf(v) === i);
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Running profit and loss">
      <defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${last.v >= 0 ? "#4ee0a6" : "#ff6f7d"}" stop-opacity=".28"/><stop offset="1" stop-color="${last.v >= 0 ? "#4ee0a6" : "#ff6f7d"}" stop-opacity="0"/></linearGradient></defs>
      ${ticks.map(v => `<line x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="rgba(200,215,255,${v === 0 ? .28 : .08})" ${v === 0 ? 'stroke-dasharray="3 4"' : ""}/><text x="${pl - 6}" y="${Y(v) + 4}" text-anchor="end">${v === 0 ? "$0" : sign$(v).replace(".00", "")}</text>`).join("")}
      <path d="${line}L${X(pts.length - 1)} ${Y(y0)}L${X(0)} ${Y(y0)}Z" fill="url(#pg)"/>
      <path d="${line}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${pts.map((p, i) => `<circle cx="${X(i)}" cy="${Y(p.v)}" r="${i === pts.length - 1 ? 5 : 2.5}" fill="${i === pts.length - 1 ? col : "#a6b0cf"}"/>`).join("")}
      <text x="${X(0)}" y="${H - 6}">Start</text><text x="${X(pts.length - 1)}" y="${H - 6}" text-anchor="end">${esc(last.label)}</text>
    </svg>`;
  }

  function splitTable(title, key, names) {
    const bets = (data.bets || []).filter(b => scope !== "mine" || placed.has(b.id));
    const keys = names || [...new Set(bets.map(b => b[key]))];
    const rows = keys.map(k => [k, totals(bets.filter(b => b[key] === k))]).filter(([, t]) => t.w + t.l + t.p + t.pending);
    return `<div class="card glass"><h2>${title}</h2><div class="table-wrap"><table>
      <thead><tr><th></th><th class="num">W-L-P</th><th class="num">Open</th><th class="num">Net</th><th class="num">ROI</th></tr></thead>
      <tbody>${rows.map(([k, t]) => `<tr><td>${esc(PLAY_NAME[k] || (k === "mixed" ? "Mixed parlay" : k === "total" ? "Totals" : k === "prop" ? "Player props" : k))}</td><td class="num">${t.w}-${t.l}-${t.p}</td><td class="num">${t.pending}</td><td class="num ${cls(t.net)}">${sign$(t.net)}</td><td class="num ${cls(t.roi)}">${t.roi.toFixed(1)}%</td></tr>`).join("")}</tbody>
    </table></div></div>`;
  }

  function meterSVG(u) {
    const R = Math.max(5, Math.ceil(Math.abs(u) * 1.5 / 5) * 5), H = 260, top = 14, bot = 14;
    const Y = v => top + (R - v) / (2 * R) * (H - top - bot), y0 = Y(0), yu = Y(Math.max(-R, Math.min(R, u)));
    const col = u > 0.004 ? "var(--win)" : u < -0.004 ? "var(--loss)" : "var(--ink-2)";
    return `<svg viewBox="0 0 64 ${H}" role="img" aria-label="Units meter: ${u.toFixed(2)} units">
      <defs><linearGradient id="mg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4ee0a6" stop-opacity=".9"/><stop offset=".5" stop-color="#4ee0a6" stop-opacity=".15"/><stop offset=".5" stop-color="#ff6f7d" stop-opacity=".15"/><stop offset="1" stop-color="#ff6f7d" stop-opacity=".9"/></linearGradient></defs>
      <rect x="22" y="${top}" width="14" height="${H - top - bot}" rx="7" fill="url(#mg)"/>
      <line x1="16" x2="42" y1="${y0}" y2="${y0}" stroke="#eef2ff" stroke-opacity=".55" stroke-dasharray="3 3"/>
      <text x="62" y="${top + 8}" text-anchor="end" fill="#4ee0a6">+${R}</text>
      <text x="62" y="${y0 + 4}" text-anchor="end" fill="#a6b0cf">0</text>
      <text x="62" y="${H - bot}" text-anchor="end" fill="#ff6f7d">-${R}</text>
      <path d="M8 ${yu - 7} L20 ${yu} L8 ${yu + 7} Z" fill="${col}"/>
      <rect x="20" y="${yu - 3}" width="18" height="6" rx="3" fill="#eef2ff"/>
    </svg>`;
  }

  function viewRecord() {
    const all = data.bets || [];
    const bets = scope === "mine" ? all.filter(b => placed.has(b.id)) : all;
    const t = totals(bets);
    const list = bets.filter(b => betFilter === "all" || b.status === betFilter || (betFilter === "settled" && b.status !== "pending"))
      .sort((a, b) => b.date.localeCompare(a.date) || PLAY_ORDER.indexOf(a.play) - PLAY_ORDER.indexOf(b.play));
    const toGreen = t.units < 0 ? `${(-t.units + 0.01).toFixed(2)}u to get back to green` : t.units > 0 ? `${t.units.toFixed(2)}u of cushion before red` : "Right at even";
    return `
      <div class="seg glass" role="group" aria-label="Whose bets"><button data-scope="all" aria-pressed="${scope === "all"}">All picks</button><button data-scope="mine" aria-pressed="${scope === "mine"}">My bets${placed.size ? " · " + all.filter(b => placed.has(b.id)).length : ""}</button></div>
      ${scope === "mine" && !bets.length ? `<div class="empty glass"><b>No placed bets yet</b>Tap "I placed this" on any play in Today, or "I placed all" on a game, and your own record shows up here.</div>` : ""}
      <section class="hero glass"><div class="hero-grid"><div class="hero-main">
        <div><div class="eyebrow">${scope === "mine" ? "Your net on the bets you placed" : "All-time net, assuming every pick placed"}</div><div class="big ${cls(t.net)}">${sign$(t.net)}</div><div class="note">${toGreen}</div></div>
        <div class="stats">
          <div class="stat"><b>${t.w}-${t.l}-${t.p}</b><span>Record</span></div>
          <div class="stat"><b class="${cls(t.units)}">${t.units >= 0 ? "+" : ""}${t.units.toFixed(2)}u</b><span>Units</span></div>
          <div class="stat"><b class="${cls(t.roi)}">${t.roi.toFixed(1)}%</b><span>ROI</span></div>
          <div class="stat"><b>${t.pending}</b><span>Pending</span></div>
        </div>
        </div><div class="meter"><span class="lab">Units</span>${meterSVG(t.units)}<b class="${cls(t.units)}" style="font-family:var(--display);font-size:18px">${t.units >= 0 ? "+" : ""}${t.units.toFixed(1)}u</b></div></div>
        ${curveSVG(bets)}
        <p class="note">${fmt$(t.risked)} risked on settled bets at ${fmt$(prefs.unit)} a unit. Change the unit on the Bankroll tab and every dollar figure follows.</p>
      </section>
      ${splitTable("By play", "play", PLAY_ORDER)}
      ${splitTable("By league", "league")}
      ${splitTable("By bet type", "market")}
      <div class="card glass"><h2>Every bet</h2>
        <div class="chips">${[["all", "All"], ["pending", "Pending"], ["win", "Won"], ["loss", "Lost"]].map(([k, n]) => `<button class="chip" data-filter="${k}" aria-pressed="${k === betFilter}">${n}</button>`).join("")}</div>
        <div>${list.map(b => {
          const n = betNetUnits(b);
          return `<div class="bet-row"><div class="t">${PLAY_NAME[b.play]} · ${esc(b.legs.map(l => l.desc).join(" + "))}</div>
          <div class="s">${esc(b.date.slice(5))} · ${esc(b.game)} · ${fmtOdds(b.odds)} · ${b.units}u${b.cause ? " · " + esc(b.cause.split(":")[0]) : ""}</div>
          <div class="v ${n == null ? "flat" : cls(n)}">${n == null ? "Open" : b.status === "push" ? "Push" : sign$(n * prefs.unit)}</div></div>`;
        }).join("") || `<p class="note">No bets match.</p>`}</div>
      </div>`;
  }

  function slider(id, label, val, min, max, step, out, hint) {
    const fill = ((val - min) / (max - min) * 100).toFixed(1);
    return `<div class="slider"><label for="${id}">${label}<output id="${id}-out">${out}</output></label>
      <input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}" style="--fill:${fill}%">${hint ? `<small>${hint}</small>` : ""}</div>`;
  }

  function viewBankroll() {
    const tot = Object.values(prefs.split).reduce((a, b) => a + b, 0);
    const colors = { straight: "var(--floodlight)", safer: "var(--win)", best: "var(--violet)", longshot: "var(--push)" };
    return `
      <section class="card glass"><h2>Per game</h2>
        ${slider("unit", "Unit size", prefs.unit, 1, 25, 0.5, fmt$(prefs.unit), `10 units a game, so ${fmt$(budget())} per game.`)}
        ${slider("games", "Games per day", prefs.games, 1, 6, 1, prefs.games, `Up to ${fmt$(budget() * prefs.games)} a day. The pipeline scores every game and plays the best ${prefs.games}.`)}
      </section>
      <section class="card glass"><h2>Split across the four plays</h2>
        <div class="split-bar">${PLAY_ORDER.map(p => `<i style="flex:${prefs.split[p]};background:${colors[p]}"></i>`).join("")}</div>
        ${PLAY_ORDER.map(p => slider("split-" + p, PLAY_NAME[p], prefs.split[p], 0, 70, 5, `${Math.round(prefs.split[p] / tot * 100)}%`, `${unitsFor(p)}u · ${fmt$(stakeFor(p))}`)).join("")}
        <p class="note">Most of the money sits on the likeliest play and the least on the longshot, so one miss can't sink the day. No leg shows up in more than 2 of a game's 4 plays.</p>
        <button class="btn" id="reset-split">Reset to 40 / 30 / 20 / 10</button>
      </section>
      <section class="card glass"><h2>Confidence sizing</h2>
        <div class="kelly-grid">
          <div style="display:grid;gap:12px">${slider("kelly", "Kelly fraction", prefs.kelly, 0, 0.5, 0.05, prefs.kelly ? prefs.kelly.toFixed(2) : "Off", "Off keeps the flat 40/30/20/10 split.")}
            <p class="note" style="margin:0">Kelly sizes a bet by how big its edge is: stake = fraction × (b × p − q) / b, where p is our win chance, q = 1 − p and b is the payout per $1. Raising the fraction moves more of each game's ${fmt$(budget())} toward the plays with the biggest edge. Bets get bigger when we're right and swings get bigger when we're wrong. The game total never changes. Pros use 0.25 or less.</p></div>
          <div class="kelly-art">${kellySVG()}</div>
        </div>
      </section>`;
  }

  function kellySVG() {
    // Share of bankroll Kelly suggests for a -110 bet as our win chance rises, full Kelly vs the chosen fraction.
    const W = 260, H = 170, pl = 34, pr = 10, pt = 12, pb = 30, q = 100 / 110;
    const ps = Array.from({ length: 21 }, (_, i) => 0.5 + i * 0.01);
    const k = p => Math.max(0, (q * p - (1 - p)) / q);
    const X = p => pl + (p - 0.5) / 0.2 * (W - pl - pr), Y = v => pt + (1 - v / 0.4) * (H - pt - pb);
    const path = f => ps.map((p, i) => `${i ? "L" : "M"}${X(p).toFixed(1)} ${Y(f * k(p)).toFixed(1)}`).join("");
    const f = prefs.kelly, p0 = 0.58;
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Kelly stake by win chance">
      ${[0, 0.1, 0.2, 0.3, 0.4].map(v => `<line x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="rgba(200,215,255,.08)"/><text x="${pl - 5}" y="${Y(v) + 4}" text-anchor="end">${v * 100}%</text>`).join("")}
      <path d="${path(1)}" fill="none" stroke="#a6b0cf" stroke-width="1.5" stroke-dasharray="4 4"/>
      ${f ? `<path d="${path(f)}" fill="none" stroke="#8fb4ff" stroke-width="2.5"/><circle cx="${X(p0)}" cy="${Y(f * k(p0))}" r="4.5" fill="#8fb4ff"/><text x="${X(p0) + 8}" y="${Y(f * k(p0)) - 6}" fill="#eef2ff" style="fill:#eef2ff">${(f * k(p0) * 100).toFixed(1)}%</text>` : `<line x1="${pl}" x2="${W - pr}" y1="${Y(0.04)}" y2="${Y(0.04)}" stroke="#8fb4ff" stroke-width="2.5"/>`}
      <text x="${X(0.5)}" y="${H - 12}">50%</text><text x="${X(0.6)}" y="${H - 12}" text-anchor="middle">60%</text><text x="${X(0.7)}" y="${H - 12}" text-anchor="end">70%</text>
      <text x="${(pl + W - pr) / 2}" y="${H - 1}" text-anchor="middle">our win chance on a -110 bet</text>
      <text x="${X(0.69)}" y="${Y(k(0.69)) + 14}" text-anchor="end">full Kelly</text>
      <text x="${pl + 4}" y="${pt + 2}">${f ? "at " + f.toFixed(2) + ", stake share" : "Off: flat stakes"}</text>
    </svg>`;
  }

  function viewLessons() {
    const L = data.lessons || {};
    const causes = Object.entries(L.loss_causes || {});
    const maxC = Math.max(1, ...causes.map(([, v]) => v));
    const w = Object.entries(L.weights || {});
    return `
      <section class="card glass"><h2>Rules learned from graded games</h2>
        ${(L.rules || []).map(r => `<div class="rule"><p>${esc(r.rule)}</p><small>${esc(r.from)} · ${esc(r.why)}</small></div>`).join("") || `<p class="note">Rules appear after games are graded.</p>`}
      </section>
      <section class="card glass"><h2>Why legs lost</h2>
        <div class="bars">${causes.map(([k, v]) => `<div class="bar"><span>${esc(k)}</span><span class="track"><i style="width:${v / maxC * 100}%;background:${k === "bad read" ? "var(--loss)" : "var(--push)"}"></i></span><b>${v}</b></div>`).join("") || `<p class="note">No losing legs tagged yet.</p>`}</div>
        <p class="note">Bad read means our analysis was wrong, so the model shifts. Variance means we had the better price and lost anyway, so nothing changes. Price means the line moved against us before the bet.</p>
      </section>
      <section class="card glass"><h2>Stake changes</h2>
        ${(L.flags || []).map(f => `<div class="rule"><p>${esc(f.name)}: ${esc(f.action)}</p><small>${f.n} bets, ${f.roi}% ROI</small></div>`).join("") || `<p class="note">A bet type gets its stake cut once it has 8 or more graded bets and an ROI below -15%. Not enough bets yet.</p>`}
      </section>
      ${w.length ? `<section class="card glass"><h2>Factor weights</h2><div class="bars">${w.map(([k, v]) => `<div class="bar"><span>${esc(k.replace("_", " "))}</span><span class="track"><i style="width:${v / 2 * 100}%;background:var(--floodlight)"></i></span><b>${(+v).toFixed(2)}</b></div>`).join("")}</div></section>` : ""}`;
  }

  function viewSettings() {
    const key = store.get("oddsKey", "");
    return `
      <section class="card glass"><h2>Odds API key</h2>
        <div class="field-row"><label for="oddskey">Paste your free key from the-odds-api.com</label>
        <input type="password" id="oddskey" autocomplete="off" value="${esc(key)}" placeholder="Stays on this device only"></div>
        <button class="btn" id="savekey">Save key</button><span class="note" id="keymsg"></span>
        <p class="note">The daily picks run reads its own copy of the key from the cloud environment. This one lets the app check live prices from your phone.</p>
      </section>
      <section class="card glass"><h2>Schedule</h2>
        <p style="margin:0">Picks refresh at <b>7:59 AM Eastern</b> every day. Games waiting on lineups, starters or injury news re-check every 30 minutes and update when the news is out. Bets grade within about 30 minutes of the final.</p>
        <p class="note">Data last updated ${esc(data.generated ? new Date(data.generated).toLocaleString("en-US", { timeZone: "America/New_York", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) + " ET" : "never")}.</p>
      </section>
      <section class="card glass"><h2>Put it on your phone</h2>
        <p style="margin:0">Once the app is hosted at its own web address, open it in Safari and tap Share, then Add to Home Screen. On Android, open it in Chrome and tap Install app. It opens full-screen like any other app.</p>
      </section>`;
  }

  function render() {
    const t = totals(data.bets || []);
    $("#pill").textContent = sign$(t.net); $("#pill").className = "pnl-pill " + cls(t.net);
    $("#updated").textContent = { today: "Today's slips", record: "Record", bankroll: "Bankroll", lessons: "Lessons", settings: "Settings" }[tab];
    $("#view").innerHTML = ({ today: viewToday, record: viewRecord, bankroll: viewBankroll, lessons: viewLessons, settings: viewSettings }[tab] || viewToday)();
    document.querySelectorAll("nav.tabs button").forEach(b => b.dataset.tab === tab ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  }

  function savePrefs() { store.set("prefs", prefs); }

  document.addEventListener("click", e => {
    const el = e.target.closest("button"); if (!el) return;
    if (el.dataset.tab) { tab = el.dataset.tab; store.set("tab", tab); render(); window.scrollTo({ top: 0 }); }
    else if (el.dataset.league) { league = el.dataset.league; store.set("league", league); render(); }
    else if (el.dataset.placed) { setPlaced([el.dataset.placed], !placed.has(el.dataset.placed)); }
    else if (el.dataset.placedGame) { const g = games().find(x => x.key === el.dataset.placedGame); if (g) setPlaced(g.bets.map(b => b.id), !g.bets.every(b => placed.has(b.id))); }
    else if (el.dataset.scope) { scope = el.dataset.scope; store.set("scope", scope); render(); }
    else if (el.dataset.jump) { const target = document.getElementById(el.dataset.jump); if (target) target.scrollIntoView({ behavior: "smooth", block: "start" }); }
    else if (el.dataset.filter) { betFilter = el.dataset.filter; render(); }
    else if (el.dataset.toggle) { const k = el.dataset.toggle; prefs.leagues = prefs.leagues.includes(k) ? prefs.leagues.filter(x => x !== k) : [...prefs.leagues, k]; savePrefs(); render(); }
    else if (el.id === "reset-split") { prefs.split = { ...DEFAULTS.split }; savePrefs(); render(); }
    else if (el.id === "savekey") { store.set("oddsKey", $("#oddskey").value.trim()); $("#keymsg").textContent = " Saved on this device."; }
  });
  document.addEventListener("input", e => {
    const el = e.target; if (el.type !== "range") return;
    const v = +el.value;
    if (el.id === "unit") prefs.unit = v; else if (el.id === "games") prefs.games = v; else if (el.id === "kelly") prefs.kelly = v;
    else if (el.id.startsWith("split-")) prefs.split[el.id.slice(6)] = v;
    savePrefs();
    // Update the readouts while dragging; redraw the screen when the thumb is let go.
    el.style.setProperty("--fill", ((v - el.min) / (el.max - el.min) * 100).toFixed(1) + "%");
    const out = document.getElementById(el.id + "-out");
    if (out) out.textContent = el.id === "unit" ? fmt$(v) : el.id === "kelly" ? (v ? v.toFixed(2) : "Off") : el.id === "games" ? v : Math.round(v / Object.values(prefs.split).reduce((a, b) => a + b, 0) * 100) + "%";
  });
  document.addEventListener("change", e => {
    if (e.target.type !== "range") return;
    const id = e.target.id; render();
    const again = document.getElementById(id); if (again) again.focus({ preventScroll: true });
  });

  // Live scores straight from ESPN's public feed. Works once hosted; quietly skipped where the network blocks it.
  async function pollLive() {
    const open = games().filter(g => g.pending && g.start && ESPN[g.league]);
    const now = Date.now();
    const due = open.filter(g => now > Date.parse(g.start) - 15 * 60e3 && now < Date.parse(g.start) + 6 * 3600e3);
    for (const lg of [...new Set(due.map(g => g.league))]) {
      try {
        const d = due.find(g => g.league === lg).start.slice(0, 10).replace(/-/g, "");
        const r = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${ESPN[lg]}/scoreboard?dates=${d}`);
        const j = await r.json();
        for (const ev of j.events || []) {
          const c = ev.competitions[0], t = Object.fromEntries(c.competitors.map(x => [x.homeAway, x]));
          const g = due.find(g => g.event_id === ev.id || (g.game.includes(t.away.team.abbreviation) && g.game.includes(t.home.team.abbreviation)));
          if (g) live[g.event_id || g.key] = { state: ev.status.type.state, text: ev.status.type.shortDetail, score: `${t.away.team.abbreviation} ${t.away.score} - ${t.home.team.abbreviation} ${t.home.score}` };
        }
      } catch {}
    }
    if (due.length && tab === "today") render();
  }

  // "I placed this" marks are saved to the artifact's database so they follow you to any device, and Claude can read them.
  async function connectPlaced() {
    try {
      const db = await window.claude?.use?.("db");
      if (!db) return;
      placedDb = db.collection("placed");
      const local = [...placed];
      placedDb.onSnapshot(qs => {
        const remote = new Set(qs.docs.filter(d => d.exists).map(d => d.id));
        for (const id of local) if (!remote.has(id)) { placedDb.doc(id).set({ placed: true, at: new Date().toISOString() }).catch(() => {}); remote.add(id); }
        local.length = 0;
        placed = remote; store.set("placed", [...placed]); render();
      }, () => {});
    } catch {}
  }

  async function boot() {
    try { const r = await fetch("data.json", { cache: "no-store" }); if (r.ok) { const j = await r.json(); if (j && j.bets) data = j; } } catch {}
    render();
    connectPlaced();
    pollLive(); setInterval(pollLive, 60e3);
    if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
  }
  render();
  boot();
})();
</script>
