<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sigma Locks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#04080f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column of matte cards over a soft blue field, bubble buttons, bottom tab bar like a sportsbook.
   Colors: blue, white and gold. Three themes in Settings: light, dark, and dynamic (light from the 7:59 AM refresh, dark from the 4:59 PM one). */
:root, :root[data-theme="dark"] {
  color-scheme: dark;
  --night: #04080f;
  --night-2: #070d1a;
  --surface: #0b1424;
  --surface-hi: #0f1a2f;
  --inset: #070e1b;
  --rim: rgba(150, 180, 240, 0.11);
  --line: rgba(150, 180, 240, 0.08);
  --soft: rgba(120, 165, 255, 0.10);
  --track: rgba(160, 190, 255, 0.16);
  --bar: rgba(8, 14, 26, 0.94);
  --toast: #f4f7ff; --toast-ink: #04080f;
  --shadow: 0 12px 28px -18px rgba(0, 0, 0, 0.9);
  --logo-bg: #e9eff9;
  --ink: #f4f7ff;
  --ink-2: #b6c4e2;
  --ink-3: #8193b8;
  --accent: #4d8dff;
  --accent-soft: rgba(77, 141, 255, 0.14);
  --accent-line: rgba(77, 141, 255, 0.45);
  --on-accent: #ffffff;
  --on-color: #04080f;
  --gold: #f5bd3a;
  --gold-soft: rgba(245, 189, 58, 0.14);
  --gold-line: rgba(245, 189, 58, 0.45);
  --glow-1: rgba(77, 141, 255, 0.13);
  --glow-2: rgba(245, 189, 58, 0.05);
  --floodlight: var(--accent);
  --violet: #a58bff;
  --win: #43d69b;
  --loss: #ff6b78;
  --push: #f5bd3a;
  --display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 22px;
  --r-sm: 14px;
}
:root[data-theme="light"] {
  color-scheme: light;
  --night: #eaf1fb;
  --night-2: #f7faff;
  --surface: #ffffff;
  --surface-hi: #ffffff;
  --inset: #f2f6fd;
  --rim: rgba(12, 52, 120, 0.10);
  --line: rgba(12, 52, 120, 0.09);
  --soft: rgba(11, 78, 162, 0.07);
  --track: rgba(12, 52, 120, 0.12);
  --bar: rgba(255, 255, 255, 0.95);
  --toast: #0d2147; --toast-ink: #ffffff;
  --shadow: 0 10px 26px -16px rgba(13, 40, 90, 0.28);
  --logo-bg: #eef3fb;
  --ink: #0d1f3c;
  --ink-2: #44587c;
  --ink-3: #6d7f9f;
  --accent: #0b5ac2;
  --accent-soft: rgba(11, 90, 194, 0.08);
  --accent-line: rgba(11, 90, 194, 0.35);
  --on-accent: #ffffff;
  --on-color: #ffffff;
  --gold: #c99412;
  --gold-soft: rgba(214, 160, 28, 0.13);
  --gold-line: rgba(201, 148, 18, 0.5);
  --glow-1: rgba(11, 90, 194, 0.12);
  --glow-2: rgba(245, 189, 58, 0.14);
  --violet: #6b4fd8;
  --win: #11925c;
  --loss: #d23645;
  --push: #b9840a;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
html { touch-action: pan-x pan-y; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; background: var(--night); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
}
.field { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; background:
  radial-gradient(60vmax 40vmax at 12% -6%, var(--glow-1), transparent 60%),
  radial-gradient(50vmax 36vmax at 105% 22%, var(--glow-2), transparent 60%),
  linear-gradient(180deg, var(--night-2), var(--night)); }
.field::after { content: ""; position: absolute; inset: 0; background-image: linear-gradient(var(--line) 1px, transparent 1px); opacity: .35; background-size: 100% 44px; mask-image: linear-gradient(180deg, transparent, #000 40%, transparent); }
.app { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(12px + env(safe-area-inset-top, 0px)) calc(96px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }

/* Matte cards: flat fill, hairline rim, soft drop shadow. No gloss. */
.glass { background: var(--surface); border: 1px solid var(--rim); border-radius: var(--r); box-shadow: var(--shadow); }

/* Solid strip behind the phone's status bar so content doesn't scroll under the clock. */
body::before { content: ""; position: fixed; z-index: 6; left: 0; right: 0; top: 0; height: env(safe-area-inset-top, 0px); background: var(--night); }
.days { margin-top: 4px; scroll-margin-top: 90px; }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand b { font-family: var(--display); font-size: 24px; font-weight: 800; letter-spacing: .02em; text-transform: uppercase; line-height: 1; }
.brand small { display: block; color: var(--ink-3); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; }
.pnl-pill { font-family: var(--display); font-weight: 700; font-size: 20px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--gold-line); background: var(--gold-soft); }
.up { color: var(--win); } .down { color: var(--loss); } .flat { color: var(--ink-2); }

h1, h2, h3 { margin: 0; font-family: var(--display); text-transform: uppercase; letter-spacing: .03em; text-wrap: balance; }
h2 { font-size: 15px; font-weight: 700; color: var(--ink-2); letter-spacing: .12em; }
.eyebrow { font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }

.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; padding: 5px; border-radius: 18px; }
.day { position: relative; display: grid; justify-items: center; gap: 1px; padding: 8px 0 7px; border: 0; border-radius: 13px; background: none; color: var(--ink-2); cursor: pointer; font: inherit; min-width: 0; }
.day b { font: 700 13px var(--body); text-transform: uppercase; letter-spacing: .04em; }
.day small { font-size: 11px; color: var(--ink-3); white-space: nowrap; }
.day i { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); margin-top: 2px; }
.day[aria-selected="true"] { background: var(--accent); color: var(--on-accent); }
.day[aria-selected="true"] small { color: var(--on-accent); opacity: .8; } .day[aria-selected="true"] i { background: var(--gold); }
.day i { background: var(--gold); }
.conf-chips { margin-top: -6px; }
.conf-chips .chip { font-size: 12.5px; padding: 6px 12px; }
.conf-h { font: 700 13px var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--gold); margin: 6px 2px -4px; display: flex; align-items: center; gap: 8px; }
.conf-h span { font-weight: 600; color: var(--ink-3); }
.conf-h::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.leg-game { display: block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin-top: 4px; }
.see-more { justify-self: center; margin-top: 10px; font: 600 13px var(--body); color: var(--accent); background: var(--accent-soft); border: 1px solid var(--accent-line); border-radius: 999px; padding: 8px 16px; cursor: pointer; }
.see-more span { color: var(--ink-3); font-weight: 500; }
.seg.theme { grid-template-columns: 1fr 1fr 1fr; background: var(--inset); border: 1px solid var(--rim); }
.seg.mode { margin-top: -2px; grid-template-columns: 1fr 1fr 1.35fr; }
@media (max-width: 380px) { .day b { font-size: 11px; } .day small { font-size: 10px; } .seg.mode button { font-size: 12px; } }
.seg.mode button { padding: 10px 4px; font-size: 13px; }
.potd { border-color: var(--gold-line); box-shadow: var(--shadow), inset 0 3px 0 var(--gold); }
.pv { display: block; font-size: 12px; color: var(--ink-2); margin-top: 2px; }
.pv b { color: var(--ink); font-weight: 600; }
.pv-none { display: block; font-size: 11.5px; color: var(--ink-3); font-style: italic; margin-top: 2px; }
.pv-state { font: 700 13px var(--display); letter-spacing: .03em; color: var(--ink-2); text-align: right; white-space: nowrap; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px; margin: 0 -2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; font: 600 13.5px var(--body); color: var(--ink-2); padding: 8px 14px; border-radius: 999px; border: 1px solid var(--rim); background: var(--surface); box-shadow: var(--shadow); cursor: pointer; }
.chip[aria-pressed="true"] { color: var(--on-accent); background: var(--accent); border-color: var(--accent); }
.chip .n { opacity: .6; margin-left: 4px; }

.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; font-size: 13.5px; color: var(--ink-2); border-radius: var(--r-sm); }
.banner .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--push); margin-top: 6px; flex: none; box-shadow: 0 0 10px var(--push); }

.game { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.game-head { display: flex; flex-wrap: wrap-reverse; justify-content: space-between; align-items: flex-start; gap: 6px 10px; }
.matchup { font-family: var(--display); font-size: 28px; font-weight: 800; line-height: 1; letter-spacing: .01em; text-transform: uppercase; }
.matchup .at { color: var(--ink-3); font-weight: 600; margin: 0 6px; }
.meta { color: var(--ink-3); font-size: 12.5px; margin-top: 4px; }
.game-sum { margin: -4px 0 0; color: var(--ink-2); font-size: 13.5px; line-height: 1.45; }
.head-right { display: flex; align-items: center; gap: 8px; flex: none; }
.bell { flex: none; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 999px; border: 1px solid var(--rim); background: var(--inset); color: var(--ink-3); cursor: pointer; padding: 0; }
.bell svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.bell[aria-pressed="true"] { color: var(--gold); border-color: var(--gold-line); background: var(--gold-soft); }
.bell[aria-pressed="true"] svg { fill: currentColor; }
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); z-index: 60; padding: 12px 14px; border-radius: 16px; background: var(--toast); border: 0; color: var(--toast-ink); font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
.status { flex: none; font: 700 11px var(--body); letter-spacing: .1em; text-transform: uppercase; padding: 5px 9px; border-radius: 999px; border: 1px solid currentColor; }
.status.pending { color: var(--accent); } .status.live { color: var(--loss); } .status.final { color: var(--ink-2); } .status.prov { color: var(--push); }

.plays { display: grid; gap: 8px; }
.play { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 12px 12px 14px; border-radius: var(--r-sm); background: var(--inset); border: 1px solid var(--line); position: relative; overflow: hidden; }
.play::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 3px; background: var(--tier); }
.play[data-play="straight"] { --tier: var(--accent); } .play[data-play="safer"] { --tier: var(--win); }
.play[data-play="best"] { --tier: var(--violet); } .play[data-play="longshot"] { --tier: var(--gold); }
.play-name { font: 700 11.5px var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--tier); display: flex; gap: 8px; align-items: center; }
.u-tag { font: 600 11px var(--body); letter-spacing: .02em; text-transform: none; color: var(--ink-3); padding: 1px 6px; border-radius: 999px; background: var(--soft); }
.stars { color: var(--gold); letter-spacing: 1px; font-size: 11px; }
.legs { grid-column: 1; font-size: 14.5px; font-weight: 500; min-width: 0; }
.legs span { display: block; }
.live-chip { display: inline-block; margin-left: 6px; font: 700 10.5px var(--body); letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; vertical-align: 1px; }
.live-chip.on_track, .live-chip.won { color: var(--on-color); background: var(--win); }
.live-chip.behind { color: var(--on-color); background: var(--push); }
.live-chip.lost { color: #fff; background: var(--loss); }
.live-chip.waiting { color: var(--ink-2); background: var(--soft); }
.live-sub { display: block; font-size: 12px; color: var(--ink-3); }
.legs .r-win::after { content: " ✓"; color: var(--win); } .legs .r-loss { color: var(--ink-3); text-decoration: line-through; }
.price { grid-column: 2; grid-row: 1 / span 2; text-align: right; display: flex; flex-direction: column; justify-content: center; }
.price .odds { font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1; }
.price .stake { font-size: 12px; color: var(--ink-2); margin-top: 4px; white-space: nowrap; }
.result-tag { font: 700 11px var(--body); letter-spacing: .1em; text-transform: uppercase; }
.game-foot { display: flex; justify-content: space-between; color: var(--ink-2); font-size: 13px; border-top: 1px solid var(--line); padding-top: 10px; }

.tiles { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(220px, 1fr); gap: 10px; overflow-x: auto; scrollbar-width: none; padding: 2px; margin: 0 -2px; }
.tiles::-webkit-scrollbar { display: none; }
.tile { padding: 14px; display: grid; gap: 10px; justify-items: center; text-align: center; cursor: pointer; color: inherit; font: inherit; }
.tile .logos { display: flex; align-items: center; gap: 12px; }
.tile .vs { font-family: var(--display); color: var(--ink-3); font-weight: 600; font-size: 18px; }
.tile .time { font-family: var(--display); font-weight: 700; font-size: 20px; letter-spacing: .02em; text-transform: uppercase; line-height: 1; }
.tile .where { color: var(--ink-2); font-size: 12.5px; line-height: 1.3; }
.logo { width: var(--s, 56px); height: var(--s, 56px); border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--logo-bg); border: 1px solid var(--rim); overflow: hidden; }
.logo img { width: 78%; height: 78%; object-fit: contain; }
.logo > * { grid-area: 1 / 1; }
.logo.badge img { opacity: 0; }
.logo:not(.badge) b { display: none; }
.logo b { font-family: var(--display); font-weight: 800; font-size: calc(var(--s, 56px) * .34); letter-spacing: .02em; color: #fff; }
.logo.badge { background: linear-gradient(150deg, var(--c1), var(--c2)); border-color: rgba(255,255,255,.22); box-shadow: inset 0 1px 0 rgba(255,255,255,.25); }
.matchup-row { display: flex; align-items: center; gap: 10px; }
.placed-btn { grid-column: 1 / -1; justify-self: start; font: 600 12.5px var(--body); color: var(--ink-2); background: transparent; border: 1px solid var(--rim); border-radius: 999px; padding: 6px 12px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.placed-btn[aria-pressed="true"] { color: var(--on-color); background: var(--win); border-color: var(--win); }
.placed-all { font: 600 12.5px var(--body); color: var(--accent); background: var(--accent-soft); border: 1px solid var(--accent-line); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.placed-all[aria-pressed="true"] { color: var(--on-color); background: var(--win); border-color: var(--win); }
.seg { display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: 999px; gap: 4px; }
.seg button { font: 700 13.5px var(--body); color: var(--ink-2); background: none; border: 0; border-radius: 999px; padding: 10px; cursor: pointer; }
.seg button[aria-pressed="true"] { color: var(--on-accent); background: var(--accent); box-shadow: 0 4px 12px -6px var(--accent); }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1fr) 76px; gap: 14px; align-items: stretch; }
.hero-main { display: grid; gap: 14px; min-width: 0; }
.meter { display: grid; grid-template-rows: auto 1fr auto; justify-items: center; gap: 6px; padding: 10px 6px; border-radius: var(--r-sm); background: var(--inset); border: 1px solid var(--line); }
.meter svg { width: 100%; height: 100%; min-height: 220px; }
.meter svg text { font: 600 10.5px var(--body); }
.meter .lab { font: 700 10.5px var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.kelly-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
.kelly-art svg { width: 100%; height: auto; display: block; }
.kelly-art svg text { font: 11px var(--body); fill: var(--ink-3); }
@media (max-width: 520px) { .kelly-grid { grid-template-columns: 1fr; } }
.empty { padding: 26px 18px; text-align: center; color: var(--ink-2); }
.empty b { display: block; font-family: var(--display); font-size: 20px; text-transform: uppercase; color: var(--ink); margin-bottom: 4px; }

.hero { padding: 18px; display: grid; gap: 14px; }
.big { font-family: var(--display); font-weight: 800; font-size: clamp(48px, 15vw, 68px); line-height: .9; letter-spacing: -.01em; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.stat { min-width: 0; overflow: hidden; padding: 10px; border-radius: var(--r-sm); background: var(--inset); border: 1px solid var(--line); }
.stat b { display: block; font-family: var(--display); font-size: 22px; font-weight: 700; line-height: 1.1; }
.stat span { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .1em; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--ink-3); font: 11px var(--body); }

.card { padding: 16px; display: grid; gap: 12px; }
.table-wrap { overflow-x: auto; margin: 0 -4px; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; font: 600 11px var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); padding: 6px 4px; }
td { padding: 8px 4px; border-top: 1px solid var(--line); }
td.num, th.num { text-align: right; }

.bet-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.bet-row:first-child { border-top: 0; }
.bet-row .t { font-weight: 600; font-size: 14px; min-width: 0; }
.bet-row .s { color: var(--ink-3); font-size: 12.5px; grid-column: 1; }
.bet-row .v { grid-column: 2; grid-row: 1 / span 2; text-align: right; font-family: var(--display); font-weight: 700; font-size: 19px; align-self: center; }

.slider { display: grid; gap: 6px; }
.slider label { display: flex; justify-content: space-between; font-weight: 600; font-size: 14px; }
.slider label output { font-family: var(--display); font-size: 20px; font-weight: 700; color: var(--accent); }
.slider small { color: var(--ink-3); font-size: 12.5px; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; background: transparent; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 6px; background: linear-gradient(90deg, var(--accent) var(--fill, 50%), var(--track) var(--fill, 50%)); }
input[type=range]::-moz-range-track { height: 6px; border-radius: 6px; background: var(--track); }
input[type=range]::-moz-range-progress { height: 6px; border-radius: 6px; background: var(--accent); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; margin-top: -9px; background: var(--surface); border: 2px solid var(--accent) !important; border: 0; box-shadow: 0 0 0 4px var(--accent-soft), 0 4px 10px rgba(0,0,0,.25); }
input[type=range]::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: var(--ink); border: 0; box-shadow: 0 0 0 4px var(--accent-soft); }
.split-bar { display: flex; height: 12px; border-radius: 12px; overflow: hidden; gap: 2px; }
.split-bar i { display: block; }

.bars { display: grid; gap: 8px; }
.bar { display: grid; grid-template-columns: 110px 1fr 44px; gap: 10px; align-items: center; font-size: 13px; }
.bar .track { height: 8px; border-radius: 8px; background: var(--track); overflow: hidden; }
.bar .track i { display: block; height: 100%; border-radius: 8px; }
.rule { padding: 12px 0; border-top: 1px solid var(--line); }
.rule:first-of-type { border-top: 0; }
.rule p { margin: 0; font-weight: 600; }
.rule small { color: var(--ink-3); display: block; margin-top: 2px; }

.field-row { display: grid; gap: 6px; }
.field-row label { font-weight: 600; font-size: 14px; }
.field-row input[type=password], .field-row input[type=text] { font: 500 15px var(--body); color: var(--ink); background: var(--inset); border: 1px solid var(--rim); border-radius: 12px; padding: 12px; width: 100%; }
.toggles { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { font: 700 14px var(--body); color: var(--on-accent); background: var(--accent); border: 0; border-radius: 999px; padding: 12px 16px; cursor: pointer; }
.note { color: var(--ink-3); font-size: 12.5px; }

<script>
  // Theme before first paint: "light", "dark", or "dynamic" (light from the 7:59 AM ET refresh, dark from the 4:59 PM ET refresh).
  window.themeFor = function (pref) {
    if (pref === "light" || pref === "dark") return pref;
    const hm = new Date().toLocaleTimeString("en-GB", { timeZone: "America/New_York", hour: "2-digit", minute: "2-digit", hour12: false });
    return hm >= "07:59" && hm < "16:59" ? "light" : "dark";
  };
  window.applyTheme = function () {
    let pref = "dynamic";
    try { pref = JSON.parse(localStorage.getItem("sliplab:theme")) || "dynamic"; } catch {}
    const t = themeFor(pref);
    document.documentElement.dataset.theme = t;
    const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = t === "light" ? "#eaf1fb" : "#04080f";
    return t;
  };
  applyTheme();
</script>

  const C = name => getComputedStyle(document.documentElement).getPropertyValue("--" + name).trim();
  let data = {};
  try { data = JSON.parse($("#seed").textContent || "{}"); } catch {}

  let betFilter = "all";
  let betLimit = 10; // Every bet list shows 10 at a time

  const ledgerPlaced = () => (data.bets || []).filter(b => b.placed).map(b => b.id);

  let watching = new Set(store.get("watch", []));

  const BELL = `<svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>`;
  const bell = (key, label) => `<button class="bell" data-watch="${esc(key)}" data-watch-label="${esc(label)}" aria-pressed="${watching.has(key)}" aria-label="${watching.has(key) ? "Stop alerts for" : "Get alerts for"} ${esc(label)}">${BELL}</button>`;
  function toast(msg) {
    document.querySelector(".toast")?.remove();
    const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
    setTimeout(() => t.remove(), 4200);
  }
  async function setWatch(key, label, on) {
    const topic = store.get("ntfyTopic", "");
    on ? watching.add(key) : watching.delete(key);
    store.set("watch", [...watching]);
    render();
    if (watchDb) (on ? watchDb.doc(key.replace(/[^\w-]/g, "_")).set({ key, label, on: true, at: new Date().toISOString() }) : watchDb.doc(key.replace(/[^\w-]/g, "_")).delete()).catch(() => {});
    if (!topic) { toast(on ? "Saved. To get these alerts on your phone, add your alerts topic once in Settings." : "Alerts off."); return; }
    try {
      const r = await fetch(`https://ntfy.sh/${encodeURIComponent(topic)}-watch`, { method: "POST", body: JSON.stringify({ key, label, on }) });
      if (!r.ok) throw new Error(r.status);
      toast(on ? `Alerts on for ${label}: odds moves, pick changes, injury news, lock, live legs and the result.` : `Alerts off for ${label}.`);
    } catch {
      toast(watchDb ? (on ? "Saved. Alerts start after the next refresh." : "Alerts off after the next refresh.") : "Couldn't reach the alert service. Try again in a moment.");
    }
  }
  const TEAM = { "NFL:SEA": ["#0b2a4f", "#3e8f1c"], "NFL:DEN": ["#e8551b", "#0b2a4f"], "MLB:CLE": ["#0c2c56", "#d22631"], "MLB:TB": ["#0a2c5c", "#5f9fd6"] };
  function hueOf(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
  const ESPN_LOGO = { MLB: "mlb", NFL: "nfl", NBA: "nba", NHL: "nhl" };
  // Saved logo first, then the logo URL ESPN gave for this game, then ESPN's standard logo path.
  // The team-color badge shows until the image loads, and stays if it can't (the private preview blocks outside images).
  function logo(league, abbr, size = 56, url) {
    const key = league + ":" + abbr, saved = (data.logos || {})[key];
    const src = saved || url || (ESPN_LOGO[league] ? `https://a.espncdn.com/i/teamlogos/${ESPN_LOGO[league]}/500/${String(abbr).toLowerCase()}.png` : "");
    const [c1, c2] = TEAM[key] || [`hsl(${hueOf(abbr)} 55% 32%)`, `hsl(${(hueOf(abbr) + 40) % 360} 60% 22%)`];
    if (saved) return `<span class="logo" style="--s:${size}px"><img src="${saved}" alt="${esc(abbr)}"></span>`;
    return `<span class="logo badge" style="--s:${size}px;--c1:${c1};--c2:${c2}" role="img" aria-label="${esc(abbr)}"><b>${esc(abbr)}</b>${src ? `<img src="${esc(src)}" alt="" loading="lazy" onload="this.parentNode.classList.remove('badge')" onerror="this.remove()">` : ""}</span>`;
  }
  const teamsOf = g => g.game.split(",")[0].split("@").map(s => s.trim());
  function setPlaced(ids, on) {
    for (const id of ids) on ? placed.add(id) : placed.delete(id);
    store.set("placed", [...placed]);
    if (placedDb) for (const id of ids) (on ? placedDb.doc(id).set({ placed: true, at: new Date().toISOString() }) : placedDb.doc(id).delete()).catch(() => {});
    render();
  }
  const live = {};
  const openWhy = new Set(); // expanded panels survive the live re-render
  document.addEventListener("toggle", e => { const d = e.target; if (d.dataset && d.dataset.why) d.open ? openWhy.add(d.dataset.why) : openWhy.delete(d.dataset.why); }, true);

  const fmt$ = v => (v < 0 ? "-$" : "$") + Math.abs(v).toFixed(2);
  const sign$ = v => (v > 0 ? "+" : "") + fmt$(v);
  const fmtOdds = o => (o > 0 ? "+" : "") + Math.round(o);
  const dec = a => a > 0 ? 1 + a / 100 : 1 + 100 / Math.abs(a);
  const cls = v => v > 0.004 ? "up" : v < -0.004 ? "down" : "flat";
  const groupOf = l => l;
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // Units are the truth; dollars follow the unit slider. Units per play follow the split.
  const budget = () => prefs.unit * 10;
  const unitsFor = play => +(prefs.split[play] / Object.values(prefs.split).reduce((a, b) => a + b, 0) * 10).toFixed(1);
  const stakeFor = play => +(unitsFor(play) * prefs.unit).toFixed(2);
  const fullKelly = b => { if (b.prob == null) return null; const q = dec(b.odds) - 1; return Math.max(0, (q * b.prob - (1 - b.prob)) / q); };
  function gameUnits(bets) {
    const base = Object.fromEntries(bets.map(b => [b.id, unitsFor(b.play)]));
    if (!prefs.kelly || bets.some(b => b.prob == null)) return base;
    const k = Object.fromEntries(bets.map(b => [b.id, fullKelly(b)]));
    const ks = Object.values(k).reduce((a, x) => a + x, 0);
    if (!ks) return base;
    const w = prefs.kelly / 0.5; // 0.5 = all the way to Kelly proportions
    return Object.fromEntries(bets.map(b => [b.id, +((1 - w) * base[b.id] + w * 10 * k[b.id] / ks).toFixed(2)]));
  }
  const betNetUnits = b => b.net == null ? null : b.net / (b.stake / b.units);

  function totals(bets) {
    const s = bets.filter(b => ["win", "loss", "push"].includes(b.status));
    const units = s.reduce((a, b) => a + betNetUnits(b), 0);
    const riskedU = s.filter(b => b.status !== "push").reduce((a, b) => a + b.units, 0);
    return { w: s.filter(b => b.status === "win").length, l: s.filter(b => b.status === "loss").length, p: s.filter(b => b.status === "push").length,
      pending: bets.filter(b => b.status === "pending").length, units, net: units * prefs.unit, risked: riskedU * prefs.unit,
      roi: riskedU ? units / riskedU * 100 : 0 };
  }

  function games() {
    const by = new Map();
    for (const b of data.bets || []) {
      const k = b.date + "|" + (b.kind === "traditional" ? "TRAD" : b.kind === "potd" ? "POTD|" + b.id : b.game);
      if (!by.has(k)) by.set(k, { key: k, date: b.date, game: b.game, league: b.league, start: b.start, event_id: b.event_id, venue: b.venue, city: b.city, home_logo: b.home_logo, away_logo: b.away_logo, home_conf: b.home_conf, away_conf: b.away_conf, summary: b.summary, weather: b.weather, rank: b.rank, score: b.score, trad: b.kind === "traditional", potd: b.kind === "potd", bets: [] });
      by.get(k).bets.push(b);
    }
    return [...by.values()].map(g => {
      g.bets.sort((a, b) => PLAY_ORDER.indexOf(a.play) - PLAY_ORDER.indexOf(b.play));
      g.pending = g.bets.some(b => b.status === "pending");
      g.provisional = g.bets.some(b => b.provisional);
      return g;
    }).sort((a, b) => (b.pending - a.pending) || b.date.localeCompare(a.date));
  }

  const starCount = b => b.confidence ?? (b.prob >= .55 ? 3 : b.prob >= .35 ? 2 : 1);
  function stars(b) { const n = starCount(b); return "★".repeat(n) + "☆".repeat(3 - n); }

  const SIGNAL = { projection: "Stat projection", recent_form: "Recent form", season: "Season numbers", matchup: "Matchup", home_away: "Home/away split",
    rest_travel: "Rest and travel", weather: "Weather", injuries: "Injuries", coaching: "Coaching and scheme", postseason: "Postseason track record",
    news: "News", line_move: "Line movement" };
  const pct = x => Math.round(x * 100) + "%";
  const implied = o => 1 / dec(o);
  function autoWhy(l) {
    const sig = Object.entries(l.signals || {}).filter(([, v]) => typeof v === "number" && Math.abs(v - .5) >= .03)
      .sort((a, b) => Math.abs(b[1] - .5) - Math.abs(a[1] - .5)).slice(0, 3);
    if (!sig.length) return "";
    return sig.map(([k, v]) => `${SIGNAL[k] || k} ${v > .5 ? "backs it" : "works against it"} (${pct(v)})`).join(". ") + ".";
  }
  // One short line per leg: the first sentence of the note, plus the player's status if there is one.
  const firstLine = t => (String(t || "").match(/^.*?[.!?](?=\s|$)/) || [t || ""])[0];
  function whyRows(b) {
    return b.legs.map(l => {
      const note = firstLine(l.note || autoWhy(l));
      const st = firstLine(l.status);
      if (!note && !st) return "";
      const ok = /healthy|active|full|confirmed/i.test(st) && !/out|doubt|question|limited/i.test(st);
      return `<div class="why-leg">${b.legs.length > 1 ? `<b>${esc(l.desc)}</b>` : ""}${note ? `<span>${esc(note)}</span>` : ""}${st ? `<span class="why-status ${ok ? "ok" : ""}">${esc(st)}</span>` : ""}</div>`;
    }).join("");
  }

  function starKey() {
    const W = 300, H = 74, X = p => 12 + p * (W - 24);
    const zones = [[0, .35, "★☆☆", "var(--ink-3)"], [.35, .55, "★★☆", "var(--floodlight)"], [.55, 1, "★★★", "var(--win)"]];
    const svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Star rating scale by win chance" style="max-width:420px">
      ${zones.map(([a, b, s, c]) => `<rect x="${X(a)}" y="26" width="${X(b) - X(a) - 2}" height="14" rx="5" fill="${c}" opacity=".85"/>
        <text x="${(X(a) + X(b)) / 2}" y="18" text-anchor="middle" fill="${c}" font-size="13" letter-spacing="1">${s}</text>`).join("")}
      ${[0, .35, .55, 1].map(p => `<text x="${X(p)}" y="58" text-anchor="${p === 0 ? "start" : p === 1 ? "end" : "middle"}" fill="var(--ink-3)" font-size="11">${pct(p)}</text>`).join("")}
      <text x="${W / 2}" y="72" text-anchor="middle" fill="var(--ink-3)" font-size="10.5">Our chance the whole bet wins</text></svg>`;

  function when(g) {

  }

  function playCard(b, gu) {
    const units = b.status === "pending" ? (gu ? gu[b.id] : unitsFor(b.play)) : b.units;

    </div>`;
  }

  function gameCard(g) {
    const [away, home] = teamsOf(g);

    const allPlaced = g.bets.every(b => placed.has(b.id));

      ? `<span>Risking ${fmt$(risk)}</span><span>${g.bets.filter(b => b.status !== "pending").length ? `Settled so far <b class="${cls(t.net)}">${sign$(t.net)}</b>` : `${g.bets.length} plays`}</span>`
      : `<span>${t.w}-${t.l}${t.p ? "-" + t.p : ""}${g.bets[0].final ? " · " + esc(g.bets[0].final) : ""}</span><b class="${cls(t.net)}">${sign$(t.net)}</b>`;
    return `<article class="game glass" id="g-${esc(g.key.replace(/[^a-z0-9]/gi, ""))}">
      <div class="game-head"><div><div class="eyebrow">${esc(g.league)}${extra ? " · " + esc(extra) : ""}</div>
        <div class="matchup-row">${logo(g.league, away, 34, g.away_logo)}<div class="matchup">${esc(away)}<span class="at">@</span>${esc(home)}</div>${logo(g.league, home, 34, g.home_logo)}</div>
        <div class="meta">${when(g)}${g.venue ? " · " + esc(g.venue) : ""}${L && L.score ? " · " + esc(L.score) : ""}</div>
</div><div class="head-right">${status}${g.pending ? bell("game:" + (g.event_id || g.key), g.game.split(",")[0]) : ""}</div></div>
      ${g.summary || g.weather ? `<p class="game-sum">${esc(g.summary || "")}${g.summary && g.weather ? " · " : ""}${g.weather ? "Weather: " + esc(g.weather) : ""}</p>` : ""}
      <div class="plays">${g.bets.map(b => playCard(b, gu)).join("")}</div>
      <div><button class="placed-all" data-placed-game="${esc(g.key)}" aria-pressed="${allPlaced}">${allPlaced ? "✓ Placed all " + g.bets.length : "I placed all " + g.bets.length}</button></div>

  }

  function tile(g, i, more) {
    const [a, h] = teamsOf(g);
    return `<button class="tile glass${more ? " more" : ""}" data-jump="g-${esc(g.key.replace(/[^a-z0-9]/gi, ""))}" aria-label="${esc(g.game)}"><span class="rank">#${i + 1}</span><span class="logos">${logo(g.league, a, 56, g.away_logo)}<span class="vs">@</span>${logo(g.league, h, 56, g.home_logo)}</span><span class="time">${esc(g.start ? new Date(g.start).toLocaleString("en-US", { timeZone: "America/New_York", weekday: "short", hour: "numeric", minute: "2-digit" }) : g.date)}</span><span class="where" style="margin-top:-6px">${esc(g.start ? new Date(g.start).toLocaleDateString("en-US", { timeZone: "America/New_York", month: "short", day: "numeric" }) + " · ET" : "")}</span><span class="where">${esc(g.venue || "")}${g.city ? "<br>" + esc(g.city) : ""}</span></button>`;
  }
  // Best game first: the pipeline's rank, then model score, then start time.
  const byRank = (a, b) => (a.rank ?? 99) - (b.rank ?? 99) || (b.score ?? 0) - (a.score ?? 0) || (a.start || a.date).localeCompare(b.start || b.date);

  const ET = { timeZone: "America/New_York" };
  const etDay = t => new Date(t).toLocaleDateString("en-CA", ET);
  const todayET = () => etDay(Date.now());
  const addDays = (d, n) => { const x = new Date(d + "T12:00:00Z"); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
  let day = todayET();

  function oddsPreview(o, g) {
    if (!o || (!o.spread && o.total == null && o.home_ml == null)) return `<small class="pv-none">Odds not posted yet</small>`;
    const parts = [];
    if (o.spread) parts.push(`<b>${esc(o.spread)}</b>`);
    if (o.total != null) parts.push(`O/U <b>${esc(o.total)}</b>`);
    if (o.away_ml != null && o.home_ml != null) {
      const pa = implied(o.away_ml), ph = implied(o.home_ml), fav = ph >= pa ? g.home : g.away;
      parts.push(`${esc(g.away)} ${fmtOdds(o.away_ml)} / ${esc(g.home)} ${fmtOdds(o.home_ml)}`);
      parts.push(`${esc(fav)} ${pct(Math.max(pa, ph) / (pa + ph))} to win`);
    }
    return `<small class="pv">${parts.join(" · ")}</small>`;
  }

  function schedRow(s, d) {
    const t = s.start ? new Date(s.start).toLocaleTimeString("en-US", { ...ET, hour: "numeric", minute: "2-digit" }) : "";
    const state = s.status === "in" || s.status === "post"
      ? `<span class="pv-state">${esc(s.away_score ?? "")}-${esc(s.home_score ?? "")} · ${esc(s.detail || "")}</span>`
      : `<span class="pv-state">${esc(t)}</span>`;
    const tomorrow = addDays(todayET(), 1);
    const why = d > tomorrow ? "Picks post the day before" : s.status === "pre" ? "No edge, no pick" : "";
    return `<div class="up-row glass"><span class="logos" style="display:flex;gap:4px">${logo(s.league, s.away, 30, s.away_logo)}${logo(s.league, s.home, 30, s.home_logo)}</span>
      <div style="min-width:0"><span class="t">${esc(s.away)} @ ${esc(s.home)}</span><small>${esc(s.league)}${s.venue ? " · " + esc(s.venue) : ""}</small>${s.status === "pre" ? oddsPreview(s.odds, s) : ""}${why ? `<small class="pv-none">${why}</small>` : ""}</div>
      ${state}</div>`;
  }

  function dayStrip(counts) {
    const t = todayET();
    return `<div class="days glass" role="tablist" aria-label="Day">${Array.from({ length: 7 }, (_, i) => {
      const d = addDays(t, i), dt = new Date(d + "T12:00:00Z");
      const wd = dt.toLocaleDateString("en-US", { weekday: "short", timeZone: "UTC" });
      const md = dt.toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });
      return `<button class="day" role="tab" data-day="${d}" aria-selected="${d === day}"><b>${i ? wd : "Today"}</b><small>${md}</small>${counts[d] ? `<i aria-label="${counts[d]} games"></i>` : ""}</button>`;
    }).join("")}</div>`;
  }

  function potdCard(b) {
    const [a, h] = b.game.split("@").map(x => x.trim());
    const name = (LEAGUES.find(l => l[0] === b.league) || [, b.league])[1];
    const t = b.start ? new Date(b.start).toLocaleString("en-US", { timeZone: "America/New_York", weekday: "short", hour: "numeric", minute: "2-digit" }) + " ET" : "";
    return `<article class="game glass potd">
      <div class="game-head"><div><div class="eyebrow">${esc(name)} · Pick of the Day</div>
        <div class="matchup-row">${logo(b.league, a, 34, b.away_logo)}<div class="matchup">${esc(a)}<span class="at">@</span>${esc(h)}</div>${logo(b.league, h, 34, b.home_logo)}</div>
        <div class="meta">${esc(t)}${b.venue ? " · " + esc(b.venue) : ""}</div></div>
        <div class="head-right"><span class="status ${b.status === "pending" ? "pending" : "final"}">${b.status === "pending" ? "Pick" : esc(b.status)}</span>${b.status === "pending" ? bell("bet:" + b.id, name + " Pick of the Day") : ""}</div></div>
      <div class="plays">${playCard(b)}</div>
    </article>`;
  }

  function tradCard(g) {
    const gu = gameUnits(g.bets.filter(b => b.status === "pending"));
    const allPlaced = g.bets.every(b => placed.has(b.id));
    const matchups = [...new Set(g.bets.flatMap(b => b.legs.map(l => l.matchup)).filter(Boolean))];
    const leagues = [...new Set(g.bets.flatMap(b => b.legs.map(l => l.league)).filter(Boolean))];
    const risk = g.bets.filter(b => b.status === "pending").reduce((a, b) => a + gu[b.id] * prefs.unit, 0);
    return `<article class="game glass">
      <div class="game-head"><div><div class="eyebrow">Traditional · ${esc(leagues.join(", "))}</div>
        <div class="matchup">${matchups.length} games</div>
        <div class="meta">${esc(matchups.join(" · "))}</div></div><div class="head-right"><span class="status pending">Multi-game</span>${bell("trad:" + (g.bets[0] || {}).date, "Traditional slip " + ((g.bets[0] || {}).date || "").slice(5))}</div></div>
      <div class="plays">${g.bets.map(b => playCard(b, gu)).join("")}</div>
      <div><button class="placed-all" data-placed-game="${esc(g.key)}" aria-pressed="${allPlaced}">${allPlaced ? "✓ Placed all " + g.bets.length : "I placed all " + g.bets.length}</button></div>
      <div class="game-foot"><span>Risking ${fmt$(risk)}</span><span>Up to 2 legs per game</span></div>
    </article>`;
  }

  // CFB tab: games grouped by conference (from ESPN's team conference ids). A game between two
  // conferences is "Non-conference"; one missing the data falls under "Other".
  const CONF_ORDER = ["SEC", "Big Ten", "Big 12", "ACC", "American", "Mountain West", "Sun Belt", "MAC", "Conference USA", "Pac-12", "FBS Independents", "FCS / other", "Non-conference", "Other"];
  // Fallback team -> conference map (FBS, from ESPN) so grouping works before a run adds conference data.
  const CFB_TEAM_CONF = {"AFA":"Mountain West","AKR":"MAC","ALA":"SEC","APP":"Sun Belt","ARK":"SEC","ARMY":"American","ARST":"Sun Belt","ASU":"Big 12","AUB":"SEC","BALL":"MAC","BAY":"Big 12","BC":"ACC","BGSU":"MAC","BUFF":"MAC","BYU":"Big 12","CAL":"ACC","CCU":"Sun Belt","CIN":"Big 12","CLEM":"ACC","CLT":"American","CMU":"MAC","COLO":"Big 12","CSU":"Pac-12","DEL":"Conference USA","DUKE":"ACC","ECU":"American","EMU":"MAC","FAU":"American","FIU":"Conference USA","FLA":"SEC","FRES":"Pac-12","FSU":"ACC","GASO":"Sun Belt","GAST":"Sun Belt","GT":"ACC","HAW":"Mountain West","HOU":"Big 12","IU":"Big Ten","JMU":"Sun Belt","KENN":"Conference USA","KENT":"MAC","KSU":"Big 12","KU":"Big 12","LOU":"ACC","LSU":"SEC","LT":"Sun Belt","M-OH":"MAC","MASS":"MAC","MD":"Big Ten","MEM":"American","MIA":"ACC","MICH":"Big Ten","MISS":"SEC","MIZ":"SEC","MOST":"Conference USA","MRSH":"Sun Belt","MSST":"SEC","MSU":"Big Ten","MTSU":"Conference USA","NAVY":"American","ND":"FBS Independents","NDSU":"Mountain West","NEB":"Big Ten","NEV":"Mountain West","NIU":"Mountain West","NU":"Big Ten","ODU":"Sun Belt","OHIO":"MAC","OKST":"Big 12","ORE":"Big Ten","ORST":"Pac-12","OSU":"Big Ten","OU":"SEC","PITT":"ACC","PSU":"Big Ten","PUR":"Big Ten","RICE":"American","RUTG":"Big Ten","SAC":"MAC","SDSU":"Pac-12","SHSU":"Conference USA","SJSU":"Mountain West","SMU":"ACC","STAN":"ACC","SYR":"ACC","TA&M":"SEC","TCU":"Big 12","TEM":"American","TENN":"SEC","TEX":"SEC","TLSA":"American","TOL":"MAC","TROY":"Sun Belt","TTU":"Big 12","TULN":"American","TXST":"Pac-12","UAB":"American","UCLA":"Big Ten","UGA":"SEC","UK":"SEC","UL":"Sun Belt","ULM":"Sun Belt","UNC":"ACC","UNLV":"Mountain West","UNM":"Mountain West","USA":"Sun Belt","USF":"American","USM":"Sun Belt","UTAH":"Big 12","UTEP":"Mountain West","UTSA":"American","UVA":"ACC","VAN":"SEC","VT":"ACC","WAKE":"ACC","WASH":"Big Ten","WIS":"Big Ten","WKU":"Conference USA","WMU":"MAC","WSU":"Pac-12","WVU":"Big 12","WYO":"Mountain West"};
  let conf = store.get("conf", "ALL");
  function confOf(x) {
    const s = (data.schedule?.games || data.schedule || []).find?.(s => s.id === x.event_id || s.id === x.id) || {};
    const [aw, hm] = (x.away && x.home) ? [x.away, x.home] : (x.game || "").split(",")[0].split("@").map(t => t.trim());
    const h = x.home_conf || s.home_conf || CFB_TEAM_CONF[hm], a = x.away_conf || s.away_conf || CFB_TEAM_CONF[aw];
    return !h || !a ? "Other" : h === a ? h : "Non-conference";
  }
  // A game shows under a conference chip when it's that conference's game or either team plays in it.
  function inConf(x) {
    if (league !== "NCAAF" || conf === "ALL") return true;
    const c = confOf(x);
    if (c === conf) return true;
    const s = (data.schedule?.games || []).find(s => s.id === x.event_id || s.id === x.id) || {};
    const [aw, hm] = (x.away && x.home) ? [x.away, x.home] : (x.game || "").split(",")[0].split("@").map(t => t.trim());
    return [x.home_conf, x.away_conf, s.home_conf, s.away_conf, CFB_TEAM_CONF[hm], CFB_TEAM_CONF[aw]].includes(conf);
  }
  function confChips(items) {
    if (league !== "NCAAF") return "";
    const counts = {};
    for (const x of items) for (const c of new Set([confOf(x), ...["home", "away"].map(k => x[k + "_conf"] || CFB_TEAM_CONF[k === "home" ? (x.home || "") : (x.away || "")])].filter(Boolean)))
      if (c !== "Non-conference" && c !== "Other") counts[c] = (counts[c] || 0) + 1;
    const list = Object.keys(counts).sort((a, b) => (CONF_ORDER.indexOf(a) + 1 || 99) - (CONF_ORDER.indexOf(b) + 1 || 99));
    if (!list.length) return "";
    if (conf !== "ALL" && !counts[conf]) conf = "ALL";
    return `<div class="chips conf-chips" role="toolbar" aria-label="Conference"><button class="chip" data-conf="ALL" aria-pressed="${conf === "ALL"}">All conferences</button>${list.map(c => `<button class="chip" data-conf="${esc(c)}" aria-pressed="${conf === c}">${esc(c)}<span class="n">${counts[c]}</span></button>`).join("")}</div>`;
  }
  function byConf(items, render, wrap) {
    if (league !== "NCAAF") return byConf.plain(items, render, wrap);
    const groups = new Map();
    for (const x of items) { const c = confOf(x); if (!groups.has(c)) groups.set(c, []); groups.get(c).push(x); }
    if (groups.size === 1 && groups.has("Other")) return byConf.plain(items, render, wrap);  // no conference data yet
    const rank = c => (i => i < 0 ? 99 : i)(CONF_ORDER.indexOf(c));
    return [...groups.entries()].sort((a, b) => rank(a[0]) - rank(b[0]) || a[0].localeCompare(b[0]))
      .map(([c, xs]) => `<h3 class="conf-h">${esc(c)} <span>${xs.length}</span></h3>${wrap ? `<div class="${wrap}">${xs.map(render).join("")}</div>` : xs.map(render).join("")}`).join("");
  }

  byConf.plain = (items, render, wrap) => wrap ? `<div class="${wrap}">${items.map(render).join("")}</div>` : items.map(render).join("");

  function viewToday() {
    const t = todayET();
    if (day < t || day > addDays(t, 6)) day = t;
    const inLeague = l => league === "ALL" || groupOf(l) === league;
    const every = games().filter(g => g.pending); // a slip leaves this tab once every bet in it is settled
    const all = every.filter(g => !g.trad && !g.potd);
    const potds = (data.bets || []).filter(b => b.kind === "potd" && b.date === day && (league === "ALL" || b.league === league))
      .sort((a, b) => LEAGUES.findIndex(l => l[0] === a.league) - LEAGUES.findIndex(l => l[0] === b.league));
    const trads = every.filter(g => g.trad && g.date === day && (league === "ALL" || g.bets.some(b => b.legs.some(l => l.league === league))));
    const modeSeg = `<div class="seg glass mode" role="group" aria-label="Slip type"><button data-slip="sgp" aria-pressed="${slipMode === "sgp"}">SGP</button><button data-slip="traditional" aria-pressed="${slipMode === "traditional"}">Traditional</button><button data-slip="potd" aria-pressed="${slipMode === "potd"}">Pick of the Day</button></div>`;
    const sched = ((data.schedule && data.schedule.games) || []).filter(s => inLeague(s.league));
    const dayOf = g => g.start ? etDay(g.start) : g.date;
    const over = g => g.start && Date.now() > Date.parse(g.start) + 4 * 3600e3;
    const counts = {};
    for (const s of sched) counts[s.date] = (counts[s.date] || 0) + 1;
    for (const g of all.filter(g => inLeague(g.league) && !over(g))) if (!sched.some(s => s.id === g.event_id)) counts[dayOf(g)] = (counts[dayOf(g)] || 0) + 1;
    const leagueCount = k => sched.filter(s => s.date === day && (k === "ALL" || groupOf(s.league) === k)).length
      || all.filter(g => dayOf(g) === day && (k === "ALL" || groupOf(g.league) === k)).length;
    const openAll = all.filter(g => inLeague(g.league) && dayOf(g) === day && !over(g)).sort(byRank);
    const open = openAll.filter(inConf);
    const grading = day === t ? all.filter(g => inLeague(g.league) && over(g)) : [];
    const bet = open.slice(0, prefs.games), more = open.slice(prefs.games);
    const picked = new Set(openAll.map(g => g.event_id).filter(Boolean));
    const pickedNames = new Set(openAll.map(g => g.game.split(",")[0].trim()));
    const restAll = sched.filter(s => s.date === day && !picked.has(s.id) && !pickedNames.has(s.game));
    const rest = restAll.filter(inConf);
    const confRow = slipMode === "sgp" ? confChips([...openAll, ...restAll]) : "";
    const label = (LEAGUES.find(l => l[0] === league) || [, "All"])[1];
    const dayName = day === t ? "today" : day === addDays(t, 1) ? "tomorrow" : new Date(day + "T12:00:00Z").toLocaleDateString("en-US", { weekday: "long", timeZone: "UTC" });
    const far = day > addDays(t, 1);
    const slate = data.slate;
    const problems = slate && slate.problems && slate.problems.length && slate.date === t && !slate.games_scanned;
    if (slipMode === "potd") return `
      ${dayStrip(counts)}
      ${modeSeg}
      <div class="chips" role="toolbar" aria-label="League">${LEAGUES.map(([k, n]) => `<button class="chip" data-league="${k}" aria-pressed="${k === league}">${n}</button>`).join("")}</div>
      ${potds.length ? `<h2>Pick of the Day ${esc(dayName)}</h2>${potds.map(potdCard).join("")}<p class="note">The single strongest bet in each league ${esc(dayName)}, from any game: the pick with the highest chance to hit that still has an edge, after research and a cross-check of lines across books. It can match a pick in the SGP or Traditional slips. Each is a ${fmt$(4 * prefs.unit)} straight bet (4 units).</p>`
        : `<div class="empty glass"><b>No Pick of the Day ${esc(dayName)} yet</b>${far ? "Picks of the Day post the day before, with the other slips." : "They post with the picks by 7:59 AM ET the day before."}</div>`}
      ${starKey()}
      <p class="note">Odds are the line at pick time. Your book's price may differ. Only bet what you can afford to lose. Help: 1-800-GAMBLER.</p>`;
    if (slipMode === "traditional") return `
      ${dayStrip(counts)}
      ${modeSeg}
      <div class="chips" role="toolbar" aria-label="League">${LEAGUES.map(([k, n]) => `<button class="chip" data-league="${k}" aria-pressed="${k === league}">${n}</button>`).join("")}</div>
      ${trads.length ? `<h2>Multi-game slip ${esc(dayName)}</h2>${trads.map(tradCard).join("")}<p class="note">The day's strongest legs across every game, up to 2 from one game when they price better, with the same four plays and stakes as an SGP. Every leg gets the same research and line cross-check.</p>`
        : `<div class="empty glass"><b>No multi-game slip ${esc(dayName)} yet</b>${far ? "Traditional slips post the day before, with the SGPs." : "It posts with the picks by 7:59 AM ET the day before, once at least 2 games have legs with an edge."}</div>`}
      ${starKey()}
      <p class="note">Odds are the line at pick time. Your book's price may differ. Only bet what you can afford to lose. Help: 1-800-GAMBLER.</p>`;
    return `
      ${dayStrip(counts)}
      ${modeSeg}
      <div class="chips" role="toolbar" aria-label="League">${LEAGUES.map(([k, n]) => `<button class="chip" data-league="${k}" aria-pressed="${k === league}">${n}${leagueCount(k) ? `<span class="n">${leagueCount(k)}</span>` : ""}</button>`).join("")}</div>
      ${confRow}
      ${problems ? `<div class="banner glass"><span class="dot"></span><div>The last run couldn't reach every sports feed, so some games may be missing.</div></div>` : ""}
      ${open.length ? `<h2>Top games ${esc(dayName)}</h2><div class="tiles">${open.map((g, i) => tile(g, i, i >= prefs.games)).join("")}</div>
        <h2>${more.length ? `Bet these ${bet.length}` : "Picks"}</h2>${byConf(bet, gameCard)}
        ${more.length ? `<h2>More games with an edge</h2><p class="note" style="margin-top:-6px">Ranked below your top ${prefs.games}. Raise Games per day on the Bankroll tab to add them to your daily budget.</p>${byConf(more, gameCard)}` : ""}`
      : `<div class="empty glass"><b>${far ? `Picks for ${esc(dayName)} post the day before` : `No ${league === "ALL" ? "" : label + " "}picks ${esc(dayName)} yet`}</b>${far ? "Here's every game on the schedule with the current odds as a preview." : "Picks post by 7:59 AM ET the day before and update with the odds and news until one hour before each game, when they're final."}</div>`}
      ${rest.length ? `<h2>${open.length ? "Other games" : "All games"} ${esc(dayName)}</h2>${league === "NCAAF" ? byConf(rest, s => schedRow(s, day), "up-list") : `<div class="up-list">${rest.map(s => schedRow(s, day)).join("")}</div>`}` : !open.length ? `<p class="note">No ${league === "ALL" ? "" : label + " "}games on the schedule ${esc(dayName)}${data.schedule ? "" : " yet. The schedule fills in at the next update"}.</p>` : ""}
      ${grading.length ? `<h2>Waiting on results</h2>${grading.map(gameCard).join("")}` : ""}
      ${starKey()}
      <p class="note">Odds are the line at pick time, and previews are ESPN's consensus line. Your book's price may differ. Only bet what you can afford to lose. Help: 1-800-GAMBLER.</p>`;
  }

  function curveSVG(bets) {
    const s = bets.filter(b => ["win", "loss", "push"].includes(b.status)).sort((a, b) => a.date.localeCompare(b.date) || a.id.localeCompare(b.id));
    if (!s.length) return `<p class="note">The chart starts after the first graded bet.</p>`;
    let run = 0; const pts = [{ v: 0, label: "Start" }, ...s.map(b => ({ v: run += betNetUnits(b) * prefs.unit, label: b.date.slice(5) }))];
    const W = 520, H = 170, pl = 44, pr = 12, pt = 14, pb = 26;
    const lo = Math.min(0, ...pts.map(p => p.v)), hi = Math.max(0, ...pts.map(p => p.v));
    const span = (hi - lo) || 1, pad = span * 0.15, y0 = lo - pad, y1 = hi + pad;
    const X = i => pl + i * (W - pl - pr) / Math.max(pts.length - 1, 1), Y = v => pt + (y1 - v) / (y1 - y0) * (H - pt - pb);
    const line = pts.map((p, i) => `${i ? "L" : "M"}${X(i).toFixed(1)} ${Y(p.v).toFixed(1)}`).join("");
    const last = pts.at(-1), col = last.v >= 0 ? "var(--win)" : "var(--loss)";
    const ticks = [y0 + pad, 0, y1 - pad].filter((v, i, a) => a.indexOf(v) === i);
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Running profit and loss">
      <defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${last.v >= 0 ? C("win") : C("loss")}" stop-opacity=".28"/><stop offset="1" stop-color="${last.v >= 0 ? C("win") : C("loss")}" stop-opacity="0"/></linearGradient></defs>
      ${ticks.map(v => `<line x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="${C("ink-3")}" stroke-opacity="${v === 0 ? .5 : .18}" ${v === 0 ? 'stroke-dasharray="3 4"' : ""}/><text x="${pl - 6}" y="${Y(v) + 4}" text-anchor="end">${v === 0 ? "$0" : sign$(v).replace(".00", "")}</text>`).join("")}
      <path d="${line}L${X(pts.length - 1)} ${Y(y0)}L${X(0)} ${Y(y0)}Z" fill="url(#pg)"/>
      <path d="${line}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${pts.map((p, i) => `<circle cx="${X(i)}" cy="${Y(p.v)}" r="${i === pts.length - 1 ? 5 : 2.5}" fill="${i === pts.length - 1 ? col : C("ink-2")}"/>`).join("")}
      <text x="${X(0)}" y="${H - 6}">Start</text><text x="${X(pts.length - 1)}" y="${H - 6}" text-anchor="end">${esc(last.label)}</text>
    </svg>`;
  }

  const recBets = () => (data.bets || []).filter(b => (scope !== "mine" || placed.has(b.id)) && (recKind === "all" || kindOf(b) === recKind));
  function splitTable(title, key, names) {
    const bets = recBets().map(b => key === "kind" ? { ...b, kind: kindOf(b) } : b);
    const keys = names || [...new Set(bets.map(b => b[key]))];
    const rows = keys.map(k => [k, totals(bets.filter(b => b[key] === k))]).filter(([, t]) => t.w + t.l + t.p + t.pending);
    return `<div class="card glass"><h2>${title}</h2><div class="table-wrap"><table>
      <thead><tr><th></th><th class="num">W-L-P</th><th class="num">Open</th><th class="num">Net</th><th class="num">ROI</th></tr></thead>
      <tbody>${rows.map(([k, t]) => `<tr><td>${esc(PLAY_NAME[k] || { sgp: "SGP (same game)", traditional: "Traditional (multi-game)", potd: "Pick of the Day", MULTI: "Multi-game" }[k] || (k === "mixed" ? "Mixed parlay" : k === "total" ? "Totals" : k === "prop" ? "Player props" : k))}</td><td class="num">${t.w}-${t.l}-${t.p}</td><td class="num">${t.pending}</td><td class="num ${cls(t.net)}">${sign$(t.net)}</td><td class="num ${cls(t.roi)}">${t.roi.toFixed(1)}%</td></tr>`).join("")}</tbody>
    </table></div></div>`;
  }

  function meterSVG(u) {
    const R = Math.max(5, Math.ceil(Math.abs(u) * 1.5 / 5) * 5), H = 260, top = 14, bot = 14;
    const Y = v => top + (R - v) / (2 * R) * (H - top - bot), y0 = Y(0), yu = Y(Math.max(-R, Math.min(R, u)));
    const col = u > 0.004 ? "var(--win)" : u < -0.004 ? "var(--loss)" : "var(--ink-2)";
    return `<svg viewBox="0 0 64 ${H}" role="img" aria-label="Units meter: ${u.toFixed(2)} units">
      <defs><linearGradient id="mg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${C("win")}" stop-opacity=".9"/><stop offset=".5" stop-color="${C("win")}" stop-opacity=".15"/><stop offset=".5" stop-color="${C("loss")}" stop-opacity=".15"/><stop offset="1" stop-color="${C("loss")}" stop-opacity=".9"/></linearGradient></defs>
      <rect x="22" y="${top}" width="14" height="${H - top - bot}" rx="7" fill="url(#mg)"/>
      <line x1="16" x2="42" y1="${y0}" y2="${y0}" stroke="${C("ink")}" stroke-opacity=".55" stroke-dasharray="3 3"/>
      <text x="62" y="${top + 8}" text-anchor="end" fill="${C("win")}">+${R}</text>
      <text x="62" y="${y0 + 4}" text-anchor="end" fill="${C("ink-2")}">0</text>
      <text x="62" y="${H - bot}" text-anchor="end" fill="${C("loss")}">-${R}</text>
      <path d="M8 ${yu - 7} L20 ${yu} L8 ${yu + 7} Z" fill="${col}"/>
      <rect x="20" y="${yu - 3}" width="18" height="6" rx="3" fill="${C("ink")}"/>
    </svg>`;
  }

  function viewRecord() {
    const all = (data.bets || []).filter(b => recKind === "all" || kindOf(b) === recKind);
    const bets = scope === "mine" ? all.filter(b => placed.has(b.id)) : all;
    const t = totals(bets);
    const list = all.filter(b => placed.has(b.id)).filter(b => betFilter === "all" || b.status === betFilter || (betFilter === "settled" && b.status !== "pending"))
      .sort((a, b) => b.date.localeCompare(a.date) || PLAY_ORDER.indexOf(a.play) - PLAY_ORDER.indexOf(b.play));
    const toGreen = t.units < 0 ? `${(-t.units + 0.01).toFixed(2)}u to get back to green` : t.units > 0 ? `${t.units.toFixed(2)}u of cushion before red` : "Right at even";
    return `
      <div class="seg glass" role="group" aria-label="Whose bets"><button data-scope="all" aria-pressed="${scope === "all"}">All picks</button><button data-scope="mine" aria-pressed="${scope === "mine"}">My bets${placed.size ? " · " + all.filter(b => placed.has(b.id)).length : ""}</button></div>
      <div class="chips" role="toolbar" aria-label="Slip type">${[["all", "All slips"], ["sgp", "SGP"], ["traditional", "Traditional"], ["potd", "Pick of the Day"]].map(([k, n]) => `<button class="chip" data-rec-kind="${k}" aria-pressed="${recKind === k}">${n}</button>`).join("")}</div>

      <section class="hero glass"><div class="hero-grid"><div class="hero-main">

  }

          <div style="display:grid;gap:12px">${slider("kelly", "Kelly fraction", prefs.kelly, 0, 0.5, 0.05, prefs.kelly ? prefs.kelly.toFixed(2) : "Off", "Off keeps the flat 40/30/20/10 split.")}
            <p class="note" style="margin:0">Kelly sizes a bet by how big its edge is: stake = fraction × (b × p − q) / b, where p is our win chance, q = 1 − p and b is the payout per $1. Raising the fraction moves more of each game's ${fmt$(budget())} toward the plays with the biggest edge. Bets get bigger when we're right and swings get bigger when we're wrong. The game total never changes. Pros use 0.25 or less.</p></div>
          <div class="kelly-art">${kellySVG()}</div>

  function kellySVG() {
    // Share of bankroll Kelly suggests for a -110 bet as our win chance rises, full Kelly vs the chosen fraction.
    const W = 260, H = 170, pl = 34, pr = 10, pt = 12, pb = 30, q = 100 / 110;
    const ps = Array.from({ length: 21 }, (_, i) => 0.5 + i * 0.01);
    const k = p => Math.max(0, (q * p - (1 - p)) / q);
    const X = p => pl + (p - 0.5) / 0.2 * (W - pl - pr), Y = v => pt + (1 - v / 0.4) * (H - pt - pb);
    const path = f => ps.map((p, i) => `${i ? "L" : "M"}${X(p).toFixed(1)} ${Y(f * k(p)).toFixed(1)}`).join("");
    const f = prefs.kelly, p0 = 0.58;
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Kelly stake by win chance">
      ${[0, 0.1, 0.2, 0.3, 0.4].map(v => `<line x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="${C("ink-3")}" stroke-opacity=".18"/><text x="${pl - 5}" y="${Y(v) + 4}" text-anchor="end">${v * 100}%</text>`).join("")}
      <path d="${path(1)}" fill="none" stroke="${C("ink-2")}" stroke-width="1.5" stroke-dasharray="4 4"/>
      ${f ? `<path d="${path(f)}" fill="none" stroke="${C("accent")}" stroke-width="2.5"/><circle cx="${X(p0)}" cy="${Y(f * k(p0))}" r="4.5" fill="${C("accent")}"/><text x="${X(p0) + 8}" y="${Y(f * k(p0)) - 6}" fill="${C("ink")}" style="fill:${C("ink")}">${(f * k(p0) * 100).toFixed(1)}%</text>` : `<line x1="${pl}" x2="${W - pr}" y1="${Y(0.04)}" y2="${Y(0.04)}" stroke="${C("accent")}" stroke-width="2.5"/>`}
      <text x="${X(0.5)}" y="${H - 12}">50%</text><text x="${X(0.6)}" y="${H - 12}" text-anchor="middle">60%</text><text x="${X(0.7)}" y="${H - 12}" text-anchor="end">70%</text>
      <text x="${(pl + W - pr) / 2}" y="${H - 1}" text-anchor="middle">our win chance on a -110 bet</text>
      <text x="${X(0.69)}" y="${Y(k(0.69)) + 14}" text-anchor="end">full Kelly</text>
      <text x="${pl + 8}" y="${pt + 16}">${f ? "at " + f.toFixed(2) + ", stake share" : "Off: flat stakes"}</text>
    </svg>`;
  }

  function calibrationCard() {
    const s = data.summary || {}, c = s.calibration || { legs: 0, bins: [] }, v = s.clv || {};
    const W = 300, H = 170, pl = 34, pr = 10, pt = 10, pb = 28;
    const X = p => pl + p * (W - pl - pr), Y = p => pt + (1 - p) * (H - pt - pb);
    const chart = c.bins.length ? `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Calibration: what we said vs how often it hit">
        ${[0, .25, .5, .75, 1].map(v => `<line x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="${C("ink-3")}" stroke-opacity=".18"/><text x="${pl - 5}" y="${Y(v) + 4}" text-anchor="end">${v * 100}%</text>`).join("")}
        <line x1="${X(0)}" y1="${Y(0)}" x2="${X(1)}" y2="${Y(1)}" stroke="${C("ink-2")}" stroke-dasharray="4 4"/>
        ${c.bins.map(b => `<circle cx="${X(b.said)}" cy="${Y(b.hit)}" r="${Math.min(12, 4 + Math.sqrt(b.n) * 1.5)}" fill="${C("accent")}" fill-opacity=".75"/><text x="${X(b.said)}" y="${Y(b.hit) - 14}" text-anchor="middle">${b.n}</text>`).join("")}
        <text x="${(pl + W - pr) / 2}" y="${H - 4}" text-anchor="middle">win chance we gave the leg</text>
      </svg>` : "";
    return `<section class="card glass"><h2>Is the model honest?</h2>
      <div class="stats" style="grid-template-columns:repeat(3,1fr)">
        <div class="stat"><b>${c.legs}</b><span>Graded legs</span></div>
        <div class="stat"><b>${c.brier == null ? "–" : c.brier.toFixed(3)}</b><span>Brier score</span></div>
        <div class="stat"><b class="${v.avg_pct == null ? "flat" : cls(v.avg_pct)}">${v.avg_pct == null ? "–" : (v.avg_pct > 0 ? "+" : "") + v.avg_pct + "%"}</b><span>Beat the close</span></div>
      </div>
      ${chart || `<p class="note" style="margin:0">The calibration chart fills in as picks with model win chances get graded.</p>`}
      <p class="note" style="margin:0">Dots on the dashed line mean our win chances come true. Dots below it mean we're overconfident. Brier score: lower is better, 0.25 is coin-flip guessing. Beat the close is how much better our price was than the final line before the game. Positive over time is the best early sign of a real edge, since win-loss on under 100 bets is mostly luck.</p>
    </section>`;
  }

  function viewLessons() {
    const L = data.lessons || {};
    const causes = Object.entries(L.loss_causes || {});
    const maxC = Math.max(1, ...causes.map(([, v]) => v));
    const w = Object.entries(L.weights || {});
    const RT = L.retrain || {}, MC = RT.market_check || {};
    const ml = MC.model_logloss, mk = MC.market_logloss;
    const trainCard = `<section class="card glass"><h2>Model vs market</h2>
        <p style="margin:0">Every leg the model prices, picked or not, gets graded after the game, so it learns from thousands of outcomes instead of a few slips. It only changes its factor weights when the new ones predict better than both the old weights and the sportsbooks' own prices on games it hasn't seen.</p>
        <div class="stats"><div class="stat"><b>${(MC.n || 0).toLocaleString()}</b><span>Graded legs</span></div>
        <div class="stat"><b class="${ml == null ? "flat" : ml < mk ? "up" : "down"}">${ml == null ? "–" : ml < mk ? "Ahead" : "Behind"}</b><span>vs market</span></div></div>
        <p class="note">${ml == null ? "Training data starts with the next run. Comparisons appear once games finish." : `Prediction error (log loss, lower is better): model ${ml}, market ${mk}.`} ${RT.accepted ? "The last retrain improved the weights and was saved." : RT.reason ? "Last retrain: " + esc(RT.reason) + "." : ""}</p>
      </section>`;
    return trainCard + `
      <section class="card glass"><h2>Rules learned from graded games</h2>
        ${(L.rules || []).map(r => `<div class="rule"><p>${esc(r.rule)}</p><small>${esc(r.from)} · ${esc(r.why)}</small></div>`).join("") || `<p class="note">Rules appear after games are graded.</p>`}
      </section>
      ${calibrationCard()}
      <section class="card glass"><h2>Why legs lost</h2>
        <div class="bars">${causes.map(([k, v]) => `<div class="bar"><span>${esc(k)}</span><span class="track"><i style="width:${v / maxC * 100}%;background:${k === "bad read" ? "var(--loss)" : "var(--push)"}"></i></span><b>${v}</b></div>`).join("") || `<p class="note">No losing legs tagged yet.</p>`}</div>
        <p class="note">Bad read means our analysis was wrong, so the model shifts. Variance means we had the better price and lost anyway, so nothing changes. Price means the line moved against us before the bet.</p>
      </section>
      <section class="card glass"><h2>Stake changes</h2>
        ${(L.flags || []).map(f => `<div class="rule"><p>${esc(f.name)}: ${esc(f.action)}</p><small>${f.n} bets, ${f.roi}% ROI</small></div>`).join("") || `<p class="note">A bet type gets its stake cut once it has 8 or more graded bets and an ROI below -15%. Not enough bets yet.</p>`}
      </section>
      ${w.length ? `<section class="card glass"><h2>Factor weights</h2><div class="bars">${w.map(([k, v]) => `<div class="bar"><span>${esc(k.replace("_", " "))}</span><span class="track"><i style="width:${v / 2 * 100}%;background:var(--floodlight)"></i></span><b>${(+v).toFixed(2)}</b></div>`).join("")}</div></section>` : ""}`;
  }

  // Live scores straight from ESPN's public feed. Works once hosted; quietly skipped where the network blocks it.
  // Same rules as pipeline/live.py: share of regulation played, then pace each leg to the final.
  const REG = { NFL: [4, 15], NCAAF: [4, 15], NBA: [4, 12], NCAAB: [2, 20], NHL: [3, 20], MLB: [9, 0], SOCCER: [1, 90] };
  function elapsed(L) {
    if (L.state === "post") return 1;
    const [periods, minutes] = REG[L.league] || [4, 15], p = Math.max(1, L.period || 1);
    if (L.league === "MLB") return Math.min(1, (p - 1 + (/bot|end/i.test(L.text) ? 0.75 : 0.25)) / periods);
    if (L.league === "SOCCER") return Math.min(1, (parseInt(L.clock) || 45) / 90);
    const [mm, ss] = (L.clock || "0:00").split(":").map(Number);
    const left = isNaN(mm) ? minutes / 2 : mm + (ss || 0) / 60;
    return Math.min(1, ((p - 1) * minutes + (minutes - left)) / (periods * minutes));
  }
  function legStatus(l, L) {
    const f = Math.max(elapsed(L), 0.05), done = L.state === "post", h = L.hs, a = L.as;
    const pace = v => +(v / f).toFixed(1);
    const judge = (now, over) => {
      if (now > l.line) return { state: over ? "won" : "lost", now };
      if (done) return { state: over ? "lost" : "won", now };
      const p = pace(now); return { state: (over ? p > l.line : p < l.line) ? "on_track" : "behind", now, pace: p };
    };
    if (l.market === "total") return judge(h + a, l.side === "over");
    if (l.market === "ml" || l.market === "spread") {
      const home = [L.home, L.homeName].includes(l.team);
      const m = (home ? h - a : a - h) + (l.line || 0);
      return { state: done ? (m > 0 ? "won" : m < 0 ? "lost" : "push") : (m > 0 ? "on_track" : "behind"), now: home ? h - a : a - h };
    }
    if (l.market === "prop") {
      const v = ((L.stats || {})[l.player] || {})[l.stat];
      return v == null ? { state: "waiting" } : judge(v, l.side === "over");
    }
    return { state: "waiting" };
  }
  const BOX = { rec_yds: ["receiving", "YDS"], receptions: ["receiving", "REC"], rush_yds: ["rushing", "YDS"], pass_yds: ["passing", "YDS"], pass_td: ["passing", "TD"],
    points: [null, "PTS"], rebounds: [null, "REB"], assists: [null, "AST"], threes: [null, "3PT"], shots: [null, "S"], saves: [null, "SV"], goals: [null, "G"],
    hits: ["batting", "H"], runs: ["batting", "R"], rbi: ["batting", "RBI"], hr: ["batting", "HR"], strikeouts: ["pitching", "K"] };
  function boxStats(summary) {
    const out = {};
    for (const team of summary?.boxscore?.players || []) for (const grp of team.statistics || []) {
      const labels = grp.labels || [];
      for (const ath of grp.athletes || []) {
        const row = out[ath.athlete.displayName] ||= {};
        for (const [stat, [g, lab]] of Object.entries(BOX)) if ((!g || grp.name === g) && labels.includes(lab)) row[stat] = parseFloat(String(ath.stats[labels.indexOf(lab)]).split("-")[0]);
        if (["rushing", "receiving"].includes(grp.name) && labels.includes("TD")) row.anytime_td = (row.anytime_td || 0) + (parseFloat(ath.stats[labels.indexOf("TD")]) || 0);
        if (grp.name === "batting" && row.hits != null) row.h_r_rbi = (row.hits || 0) + (row.runs || 0) + (row.rbi || 0);
      }
    }
    return out;
  }

  async function pollLive() {
    const open = games().filter(g => g.pending && g.start && ESPN[g.league]);
    const now = Date.now();
    const due = open.filter(g => now > Date.parse(g.start) - 15 * 60e3 && now < Date.parse(g.start) + 6 * 3600e3);
    for (const lg of [...new Set(due.map(g => g.league))]) {
      try {
        const d = due.find(g => g.league === lg).start.slice(0, 10).replace(/-/g, "");
        const r = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${ESPN[lg]}/scoreboard?dates=${d}`);
        const j = await r.json();
        for (const ev of j.events || []) {
          const c = ev.competitions[0], t = Object.fromEntries(c.competitors.map(x => [x.homeAway, x]));
          const g = due.find(g => g.event_id === ev.id || (g.game.includes(t.away.team.abbreviation) && g.game.includes(t.home.team.abbreviation)));
          if (!g) continue;
          const L = { league: g.league, state: ev.status.type.state, text: ev.status.type.shortDetail, period: ev.status.period, clock: ev.status.displayClock,
            home: t.home.team.abbreviation, homeName: t.home.team.displayName, hs: +t.home.score || 0, as: +t.away.score || 0,
            score: `${t.away.team.abbreviation} ${t.away.score} - ${t.home.team.abbreviation} ${t.home.score}` };
          if (L.state !== "pre" && g.bets.some(b => b.legs.some(l => l.market === "prop"))) {
            try { L.stats = boxStats(await (await fetch(`https://site.api.espn.com/apis/site/v2/sports/${ESPN[lg]}/summary?event=${ev.id}`)).json()); } catch {}
          }
          live[g.event_id || g.key] = L;
        }
      } catch {}
    }
    if (due.length && tab === "today") render();
  }

  // "I placed this" marks are saved to the artifact's database so they follow you to any device, and Claude can read them.
  async function connectPlaced() {
    try {
      const db = await window.claude?.use?.("db");
      if (!db) return;
      placedDb = db.collection("placed");
      watchDb = db.collection("watch");
      const localW = [...watching];
      watchDb.onSnapshot(qs => {
        const remote = new Map(qs.docs.filter(d => d.exists).map(d => [d.id, d.data().key]));
        for (const k of localW) { const id = k.replace(/[^\w-]/g, "_"); if (!remote.has(id)) { watchDb.doc(id).set({ key: k, on: true, at: new Date().toISOString() }).catch(() => {}); remote.set(id, k); } }
        localW.length = 0;
        watching = new Set([...remote.values()].filter(Boolean)); store.set("watch", [...watching]); render();
      }, () => {});
      const local = [...placed];
      placedDb.onSnapshot(qs => {
        const remote = new Set(qs.docs.filter(d => d.exists).map(d => d.id));
        for (const id of local) if (!remote.has(id)) { placedDb.doc(id).set({ placed: true, at: new Date().toISOString() }).catch(() => {}); remote.add(id); }
        local.length = 0;
        placed = new Set([...remote, ...ledgerPlaced()]); store.set("placed", [...placed]); render();
      }, () => {});
    } catch {}
  }

  // Pull the newest picks whenever the app opens, comes back to the front, or every 2 minutes while open,
  // so the home-screen app and the website show a refresh at the same moment.
  // Dynamic theme flips at the morning and afternoon refreshes; re-check every minute and when the app comes back.
  setInterval(() => { const before = document.documentElement.dataset.theme; if (applyTheme() !== before) render(); }, 60e3);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { const before = document.documentElement.dataset.theme; if (applyTheme() !== before) render(); } });

  async function loadData() {
    try {
      const r = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
      if (!r.ok) return;
      const j = await r.json();
      if (j && j.bets && j.generated !== data.generated) { data = j; for (const id of ledgerPlaced()) placed.add(id); render(); }
    } catch {}
  }
  async function boot() {
    await loadData();
    render();
    setInterval(loadData, 120e3);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) loadData(); });
    connectPlaced();
    pollLive(); setInterval(pollLive, 60e3);
    if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
  }
  render();
  boot();
})();
</script>
