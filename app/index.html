    const [away, home] = teamsOf(g);
    const gu = gameUnits(g.bets.filter(b => b.status === "pending"));
    const allPlaced = g.bets.every(b => placed.has(b.id));
    const extra = g.game.includes(",") ? g.game.split(",").slice(1).join(",").trim() : "";
    const L = live[g.event_id || g.key];
    const started = g.start && Date.now() > Date.parse(g.start) + 3.5 * 3600e3;
    let status = g.pending && started ? `<span class="status prov">Awaiting result</span>` : g.pending ? (g.provisional ? `<span class="status prov">Waiting on lineups</span>` : (g.start && Date.now() < Date.parse(g.start) - 3600e3 ? `<span class="status pending">Locks ${esc(new Date(Date.parse(g.start) - 3600e3).toLocaleTimeString("en-US", { timeZone: "America/New_York", hour: "numeric", minute: "2-digit" }))}</span>` : `<span class="status pending">Picks locked</span>`)) : `<span class="status final">Final</span>`;
    if (L && L.state === "in") status = `<span class="status live">Live ${esc(L.text)}</span>`;
    const t = totals(g.bets);
    const risk = g.bets.filter(b => b.status === "pending").reduce((a, b) => { const k = lockOf(b); return a + (k ? k.units * k.unit : gu[b.id] * prefs.unit); }, 0);
    const foot = g.pending
      ? `<span>Risking ${fmt$(risk)}</span><span>${g.bets.filter(b => b.status !== "pending").length ? `Settled so far <b class="${cls(t.net)}">${sign$(t.net)}</b>` : `${g.bets.length} plays`}</span>`
      : `<span>${t.w}-${t.l}${t.p ? "-" + t.p : ""}${g.bets[0].final ? " · " + esc(g.bets[0].final) : ""}</span><b class="${cls(t.net)}">${sign$(t.net)}</b>`;
    return `<article class="game glass" id="g-${esc(g.key.replace(/[^a-z0-9]/gi, ""))}">
      <div class="game-head"><div><div class="eyebrow">${esc(g.league)}${extra ? " · " + esc(extra) : ""}</div>
        <div class="matchup-row">${logo(g.league, away, 34, g.away_logo)}<div class="matchup">${esc(away)}<span class="at">@</span>${esc(home)}</div>${logo(g.league, home, 34, g.home_logo)}</div>
        <div class="meta">${when(g)}${g.venue ? " · " + esc(g.venue) : ""}${L && L.score ? " · " + esc(L.score) : ""}</div>
</div><div class="head-right">${status}${g.pending ? bell("game:" + (g.event_id || g.key), g.game.split(",")[0]) : ""}</div></div>
      ${g.summary || g.weather ? `<p class="game-sum">${esc(g.summary || "")}${g.summary && g.weather ? " · " : ""}${g.weather ? "Weather: " + esc(g.weather) : ""}</p>` : ""}
      <div class="plays">${g.bets.map(b => playCard(b, gu)).join("")}</div>
      <div><button class="placed-all" data-placed-game="${esc(g.key)}" aria-pressed="${allPlaced}">${allPlaced ? "✓ Placed all " + g.bets.length : "I placed all " + g.bets.length}</button></div>
      <div class="game-foot">${foot}</div>
    </article>`;
  }

  function tile(g, i, more) {
    const [a, h] = teamsOf(g);
    return `<button class="tile glass${more ? " more" : ""}" data-jump="g-${esc(g.key.replace(/[^a-z0-9]/gi, ""))}" aria-label="${esc(g.game)}"><span class="rank">#${i + 1}</span><span class="logos">${logo(g.league, a, 56, g.away_logo)}<span class="vs">@</span>${logo(g.league, h, 56, g.home_logo)}</span><span class="time">${esc(g.start ? new Date(g.start).toLocaleString("en-US", { timeZone: "America/New_York", weekday: "short", hour: "numeric", minute: "2-digit" }) : g.date)}</span><span class="where" style="margin-top:-6px">${esc(g.start ? new Date(g.start).toLocaleDateString("en-US", { timeZone: "America/New_York", month: "short", day: "numeric" }) + " · ET" : "")}</span><span class="where">${esc(g.venue || "")}${g.city ? "<br>" + esc(g.city) : ""}</span></button>`;
  }
  // Best game first: the pipeline's rank, then model score, then start time.
  const byRank = (a, b) => (a.rank ?? 99) - (b.rank ?? 99) || (b.score ?? 0) - (a.score ?? 0) || (a.start || a.date).localeCompare(b.start || b.date);

  const ET = { timeZone: "America/New_York" };
  const etDay = t => new Date(t).toLocaleDateString("en-CA", ET);
  const todayET = () => etDay(Date.now());
  const addDays = (d, n) => { const x = new Date(d + "T12:00:00Z"); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
  let day = todayET();

  function oddsPreview(o, g) {
    if (!o || (!o.spread && o.total == null && o.home_ml == null)) return `<small class="pv-none">Odds not posted yet</small>`;
    const parts = [];
    if (o.spread) parts.push(`<b>${esc(o.spread)}</b>`);
    if (o.total != null) parts.push(`O/U <b>${esc(o.total)}</b>`);
    if (o.away_ml != null && o.home_ml != null) {
      const pa = implied(o.away_ml), ph = implied(o.home_ml), fav = ph >= pa ? g.home : g.away;
      parts.push(`${esc(g.away)} ${fmtOdds(o.away_ml)} / ${esc(g.home)} ${fmtOdds(o.home_ml)}`);
      parts.push(`${esc(fav)} ${pct(Math.max(pa, ph) / (pa + ph))} to win`);
    }
    return `<small class="pv">${parts.join(" · ")}</small>`;
  }

  function schedRow(s, d) {
    const t = s.start ? new Date(s.start).toLocaleTimeString("en-US", { ...ET, hour: "numeric", minute: "2-digit" }) : "";
    const state = s.status === "in" || s.status === "post"
      ? `<span class="pv-state">${esc(s.away_score ?? "")}-${esc(s.home_score ?? "")} · ${esc(s.detail || "")}</span>`
      : `<span class="pv-state">${esc(t)}</span>`;
    const tomorrow = addDays(todayET(), 1);
    const why = d > tomorrow ? "Picks post the day before" : s.status === "pre" ? "No edge, no pick" : "";
    return `<div class="up-row glass"><span class="logos" style="display:flex;gap:4px">${logo(s.league, s.away, 30, s.away_logo)}${logo(s.league, s.home, 30, s.home_logo)}</span>
      <div style="min-width:0"><span class="t">${esc(s.away)} @ ${esc(s.home)}</span><small>${esc(s.league)}${s.venue ? " · " + esc(s.venue) : ""}</small>${s.status === "pre" ? oddsPreview(s.odds, s) : ""}${why ? `<small class="pv-none">${why}</small>` : ""}</div>
      ${state}</div>`;
  }

  function dayStrip(counts) {
    const t = todayET();
    return `<div class="days glass" role="tablist" aria-label="Day">${Array.from({ length: 7 }, (_, i) => {
      const d = addDays(t, i), dt = new Date(d + "T12:00:00Z");
      const wd = dt.toLocaleDateString("en-US", { weekday: "short", timeZone: "UTC" });
      const md = dt.toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });
      return `<button class="day" role="tab" data-day="${d}" aria-selected="${d === day}"><b>${i ? wd : "Today"}</b><small>${md}</small>${counts[d] ? `<i aria-label="${counts[d]} games"></i>` : ""}</button>`;
    }).join("")}</div>`;
  }

  function potdCard(b) {
    const [a, h] = b.game.split("@").map(x => x.trim());
    const name = (LEAGUES.find(l => l[0] === b.league) || [, b.league])[1];
    const t = b.start ? new Date(b.start).toLocaleString("en-US", { timeZone: "America/New_York", weekday: "short", hour: "numeric", minute: "2-digit" }) + " ET" : "";
    return `<article class="game glass potd">
      <div class="game-head"><div><div class="eyebrow">${esc(name)} · Pick of the Day</div>
        <div class="matchup-row">${logo(b.league, a, 34, b.away_logo)}<div class="matchup">${esc(a)}<span class="at">@</span>${esc(h)}</div>${logo(b.league, h, 34, b.home_logo)}</div>
        <div class="meta">${esc(t)}${b.venue ? " · " + esc(b.venue) : ""}</div></div>
        <div class="head-right"><span class="status ${b.status === "pending" ? "pending" : "final"}">${b.status === "pending" ? "Pick" : esc(b.status)}</span>${b.status === "pending" ? bell("bet:" + b.id, name + " Pick of the Day") : ""}</div></div>
      <div class="plays">${playCard(b)}</div>
    </article>`;
  }

  function tradCard(g) {
    const gu = gameUnits(g.bets.filter(b => b.status === "pending"));
    const allPlaced = g.bets.every(b => placed.has(b.id));
    const matchups = [...new Set(g.bets.flatMap(b => b.legs.map(l => l.matchup)).filter(Boolean))];
    const leagues = [...new Set(g.bets.flatMap(b => b.legs.map(l => l.league)).filter(Boolean))];
    const risk = g.bets.filter(b => b.status === "pending").reduce((a, b) => { const k = lockOf(b); return a + (k ? k.units * k.unit : gu[b.id] * prefs.unit); }, 0);
    return `<article class="game glass">
      <div class="game-head"><div><div class="eyebrow">Traditional · ${esc(leagues.join(", "))}</div>
        <div class="matchup">${matchups.length} games</div>
        <div class="meta">${esc(matchups.join(" · "))}</div></div><div class="head-right"><span class="status pending">Multi-game</span>${bell("trad:" + (g.bets[0] || {}).date, "Traditional slip " + ((g.bets[0] || {}).date || "").slice(5))}</div></div>
      <div class="plays">${g.bets.map(b => playCard(b, gu)).join("")}</div>
      <div><button class="placed-all" data-placed-game="${esc(g.key)}" aria-pressed="${allPlaced}">${allPlaced ? "✓ Placed all " + g.bets.length : "I placed all " + g.bets.length}</button></div>
      <div class="game-foot"><span>Risking ${fmt$(risk)}</span><span>Up to 2 legs per game</span></div>
    </article>`;
  }

  // CFB tab: games grouped by conference (from ESPN's team conference ids). A game between two
  // conferences is "Non-conference"; one missing the data falls under "Other".
  const CONF_ORDER = ["Big Ten", "SEC", "Big 12", "ACC", "Big East", "American", "Mountain West", "Sun Belt", "MAC", "Conference USA", "Pac-12", "FBS Independents", "FCS / other", "Non-conference", "Other"];
  // Fallback team -> conference map (FBS, from ESPN) so grouping works before a run adds conference data.
  const CFB_TEAM_CONF = {"AFA":"Mountain West","AKR":"MAC","ALA":"SEC","APP":"Sun Belt","ARK":"SEC","ARMY":"American","ARST":"Sun Belt","ASU":"Big 12","AUB":"SEC","BALL":"MAC","BAY":"Big 12","BC":"ACC","BGSU":"MAC","BUFF":"MAC","BYU":"Big 12","CAL":"ACC","CCU":"Sun Belt","CIN":"Big 12","CLEM":"ACC","CLT":"American","CMU":"MAC","COLO":"Big 12","CSU":"Pac-12","DEL":"Conference USA","DUKE":"ACC","ECU":"American","EMU":"MAC","FAU":"American","FIU":"Conference USA","FLA":"SEC","FRES":"Pac-12","FSU":"ACC","GASO":"Sun Belt","GAST":"Sun Belt","GT":"ACC","HAW":"Mountain West","HOU":"Big 12","IU":"Big Ten","JMU":"Sun Belt","KENN":"Conference USA","KENT":"MAC","KSU":"Big 12","KU":"Big 12","LOU":"ACC","LSU":"SEC","LT":"Sun Belt","M-OH":"MAC","MASS":"MAC","MD":"Big Ten","MEM":"American","MIA":"ACC","MICH":"Big Ten","MISS":"SEC","MIZ":"SEC","MOST":"Conference USA","MRSH":"Sun Belt","MSST":"SEC","MSU":"Big Ten","MTSU":"Conference USA","NAVY":"American","ND":"FBS Independents","NDSU":"Mountain West","NEB":"Big Ten","NEV":"Mountain West","NIU":"Mountain West","NU":"Big Ten","ODU":"Sun Belt","OHIO":"MAC","OKST":"Big 12","ORE":"Big Ten","ORST":"Pac-12","OSU":"Big Ten","OU":"SEC","PITT":"ACC","PSU":"Big Ten","PUR":"Big Ten","RICE":"American","RUTG":"Big Ten","SAC":"MAC","SDSU":"Pac-12","SHSU":"Conference USA","SJSU":"Mountain West","SMU":"ACC","STAN":"ACC","SYR":"ACC","TA&M":"SEC","TCU":"Big 12","TEM":"American","TENN":"SEC","TEX":"SEC","TLSA":"American","TOL":"MAC","TROY":"Sun Belt","TTU":"Big 12","TULN":"American","TXST":"Pac-12","UAB":"American","UCLA":"Big Ten","UGA":"SEC","UK":"SEC","UL":"Sun Belt","ULM":"Sun Belt","UNC":"ACC","UNLV":"Mountain West","UNM":"Mountain West","USA":"Sun Belt","USF":"American","USM":"Sun Belt","UTAH":"Big 12","UTEP":"Mountain West","UTSA":"American","UVA":"ACC","VAN":"SEC","VT":"ACC","WAKE":"ACC","WASH":"Big Ten","WIS":"Big Ten","WKU":"Conference USA","WMU":"MAC","WSU":"Pac-12","WVU":"Big 12","WYO":"Mountain West"};
  let conf = store.get("conf", "ALL");
  const isCollege = () => league === "NCAAF" || league === "NCAAB";
  // Team -> conference from the Settings team list (both college leagues), by ESPN id or abbreviation.
  let confIdx = null, confIdxSrc = null;
  function confFor(abbr, id) {
    if (confIdxSrc !== data.teams) {
      confIdx = {}; confIdxSrc = data.teams;
      for (const lg of ["NCAAF", "NCAAB"]) for (const g of ((data.teams && data.teams.leagues && data.teams.leagues[lg]) || {}).groups || [])
        for (const t of g.teams) { (confIdx[lg] = confIdx[lg] || {})["id:" + t.id] = g.name; if (t.abbr) confIdx[lg][t.abbr] = g.name; }
    }
    const m = confIdx[league] || {};
    return (id && m["id:" + id]) || m[abbr] || (league === "NCAAF" ? CFB_TEAM_CONF[abbr] : null);
  }
  function confOf(x) {
    const s = (data.schedule?.games || data.schedule || []).find?.(s => s.id === x.event_id || s.id === x.id) || {};
    const [aw, hm] = (x.away && x.home) ? [x.away, x.home] : (x.game || "").split(",")[0].split("@").map(t => t.trim());
    const h = x.home_conf || s.home_conf || confFor(hm, x.home_id || s.home_id), a = x.away_conf || s.away_conf || confFor(aw, x.away_id || s.away_id);
    return !h || !a ? "Other" : h === a ? h : "Non-conference";
  }
  // A game shows under a conference chip when it's that conference's game or either team plays in it.
  function inConf(x) {
    if (!isCollege() || conf === "ALL") return true;
    const c = confOf(x);
    if (c === conf) return true;
    const s = (data.schedule?.games || []).find(s => s.id === x.event_id || s.id === x.id) || {};
    const [aw, hm] = (x.away && x.home) ? [x.away, x.home] : (x.game || "").split(",")[0].split("@").map(t => t.trim());
    return [x.home_conf, x.away_conf, s.home_conf, s.away_conf, confFor(hm, x.home_id || s.home_id), confFor(aw, x.away_id || s.away_id)].includes(conf);
  }
  function confChips(items) {
    if (!isCollege()) return "";
    const counts = {};
    for (const x of items) for (const c of new Set([confOf(x), ...["home", "away"].map(k => x[k + "_conf"] || confFor(x[k] || "", x[k + "_id"]))].filter(Boolean)))
      if (c !== "Non-conference" && c !== "Other") counts[c] = (counts[c] || 0) + 1;
    const list = Object.keys(counts).sort((a, b) => (CONF_ORDER.indexOf(a) + 1 || 99) - (CONF_ORDER.indexOf(b) + 1 || 99));
    if (!list.length) return "";
    if (conf !== "ALL" && !counts[conf]) conf = "ALL";
    return `<div class="chips conf-chips" role="toolbar" aria-label="Conference"><button class="chip" data-conf="ALL" aria-pressed="${conf === "ALL"}">All conferences</button>${list.map(c => `<button class="chip" data-conf="${esc(c)}" aria-pressed="${conf === c}">${esc(c)}<span class="n">${counts[c]}</span></button>`).join("")}</div>`;
  }
  function byConf(items, render, wrap) {
    if (!isCollege()) return byConf.plain(items, render, wrap);
    const groups = new Map();
    for (const x of items) { const c = confOf(x); if (!groups.has(c)) groups.set(c, []); groups.get(c).push(x); }
    if (groups.size === 1 && groups.has("Other")) return byConf.plain(items, render, wrap);  // no conference data yet
    const rank = c => (i => i < 0 ? 99 : i)(CONF_ORDER.indexOf(c));
    return [...groups.entries()].sort((a, b) => rank(a[0]) - rank(b[0]) || a[0].localeCompare(b[0]))
      .map(([c, xs]) => `<h3 class="conf-h">${esc(c)} <span>${xs.length}</span></h3>${wrap ? `<div class="${wrap}">${xs.map(render).join("")}</div>` : xs.map(render).join("")}`).join("");
  }

  byConf.plain = (items, render, wrap) => wrap ? `<div class="${wrap}">${items.map(render).join("")}</div>` : items.map(render).join("");

  function viewToday() {
    const t = todayET();
    if (day < t || day > addDays(t, 6)) day = t;
    const inLeague = l => league === "ALL" || groupOf(l) === league;
    const every = games().filter(g => g.pending); // a slip leaves this tab once every bet in it is settled
    const all = every.filter(g => !g.trad && !g.potd);
    const potds = (data.bets || []).filter(b => b.kind === "potd" && b.date === day && (league === "ALL" || b.league === league))
      .sort((a, b) => LEAGUES.findIndex(l => l[0] === a.league) - LEAGUES.findIndex(l => l[0] === b.league));
    const trads = every.filter(g => g.trad && g.date === day && (league === "ALL" || g.bets.some(b => b.legs.some(l => l.league === league))));
    const modeSeg = `<div class="seg glass mode" role="group" aria-label="Slip type"><button data-slip="sgp" aria-pressed="${slipMode === "sgp"}">SGP</button><button data-slip="traditional" aria-pressed="${slipMode === "traditional"}">Traditional</button><button data-slip="potd" aria-pressed="${slipMode === "potd"}">Pick of the Day</button></div>`;
    const sched = ((data.schedule && data.schedule.games) || []).filter(s => inLeague(s.league));
    const dayOf = g => g.start ? etDay(g.start) : g.date;
    const over = g => g.start && Date.now() > Date.parse(g.start) + 4 * 3600e3;
    const counts = {};
    for (const s of sched) counts[s.date] = (counts[s.date] || 0) + 1;
    for (const g of all.filter(g => inLeague(g.league) && !over(g))) if (!sched.some(s => s.id === g.event_id)) counts[dayOf(g)] = (counts[dayOf(g)] || 0) + 1;
    const leagueCount = k => sched.filter(s => s.date === day && (k === "ALL" || groupOf(s.league) === k)).length
      || all.filter(g => dayOf(g) === day && (k === "ALL" || groupOf(g.league) === k)).length;
    const openAll = all.filter(g => inLeague(g.league) && dayOf(g) === day && !over(g)).sort(byRank);
    const open = openAll.filter(inConf);
    const grading = day === t ? all.filter(g => inLeague(g.league) && over(g)) : [];
    const bet = open.slice(0, prefs.games), more = open.slice(prefs.games);
    const picked = new Set(openAll.map(g => g.event_id).filter(Boolean));
    const pickedNames = new Set(openAll.map(g => g.game.split(",")[0].trim()));
    const restAll = sched.filter(s => s.date === day && !picked.has(s.id) && !pickedNames.has(s.game));
    const rest = restAll.filter(inConf);
    const confRow = slipMode === "sgp" ? confChips([...openAll, ...restAll]) : "";
    const label = (LEAGUES.find(l => l[0] === league) || [, "All"])[1];
    const dayName = day === t ? "today" : day === addDays(t, 1) ? "tomorrow" : new Date(day + "T12:00:00Z").toLocaleDateString("en-US", { weekday: "long", timeZone: "UTC" });
    const far = day > addDays(t, 1);
    const slate = data.slate;
    const problems = slate && slate.problems && slate.problems.length && slate.date === t && !slate.games_scanned;
    if (slipMode === "potd") return `
      ${dayStrip(counts)}
      ${modeSeg}
      <div class="chips" role="toolbar" aria-label="League">${LEAGUES.map(([k, n]) => `<button class="chip" data-league="${k}" aria-pressed="${k === league}">${n}</button>`).join("")}</div>
      ${potds.length ? `<h2>Pick of the Day ${esc(dayName)}</h2>${potds.map(potdCard).join("")}<p class="note">The single strongest bet in each league ${esc(dayName)}, from any game: the pick with the highest chance to hit that still has an edge, after research and a cross-check of lines across books. It can match a pick in the SGP or Traditional slips. Each is a ${fmt$(4 * prefs.unit)} straight bet (4 units).</p>`
        : `<div class="empty glass"><b>No Pick of the Day ${esc(dayName)} yet</b>${far ? "Picks of the Day post the day before, with the other slips." : "They post with the picks by 7:59 AM ET the day before."}</div>`}
      ${starKey()}
      <p class="note">Odds are the line at pick time. Your book's price may differ. Only bet what you can afford to lose. Help: 1-800-GAMBLER.</p>`;
    if (slipMode === "traditional") return `
      ${dayStrip(counts)}
      ${modeSeg}
      <div class="chips" role="toolbar" aria-label="League">${LEAGUES.map(([k, n]) => `<button class="chip" data-league="${k}" aria-pressed="${k === league}">${n}</button>`).join("")}</div>
      ${trads.length ? `<h2>Multi-game slip ${esc(dayName)}</h2>${trads.map(tradCard).join("")}<p class="note">The day's strongest legs across every game, up to 2 from one game when they price better, with the same four plays and stakes as an SGP. Every leg gets the same research and line cross-check.</p>`
        : `<div class="empty glass"><b>No multi-game slip ${esc(dayName)} yet</b>${far ? "Traditional slips post the day before, with the SGPs." : "It posts with the picks by 7:59 AM ET the day before, once at least 2 games have legs with an edge."}</div>`}
      ${starKey()}
      <p class="note">Odds are the line at pick time. Your book's price may differ. Only bet what you can afford to lose. Help: 1-800-GAMBLER.</p>`;
    return `
      ${dayStrip(counts)}
      ${modeSeg}
      <div class="chips" role="toolbar" aria-label="League">${LEAGUES.map(([k, n]) => `<button class="chip" data-league="${k}" aria-pressed="${k === league}">${n}${leagueCount(k) ? `<span class="n">${leagueCount(k)}</span>` : ""}</button>`).join("")}</div>
      ${confRow}
      ${problems ? `<div class="banner glass"><span class="dot"></span><div>The last run couldn't reach every sports feed, so some games may be missing.</div></div>` : ""}
      ${open.length ? `<h2>Top games ${esc(dayName)}</h2><div class="tiles">${open.map((g, i) => tile(g, i, i >= prefs.games)).join("")}</div>
        <h2>${more.length ? `Bet these ${bet.length}` : "Picks"}</h2>${byConf(bet, gameCard)}
        ${more.length ? `<h2>More games with an edge</h2><p class="note" style="margin-top:-6px">Ranked below your top ${prefs.games}. Raise Games per day on the Bankroll tab to add them to your daily budget.</p>${byConf(more, gameCard)}` : ""}`
      : `<div class="empty glass"><b>${far ? `Picks for ${esc(dayName)} post the day before` : `No ${league === "ALL" ? "" : label + " "}picks ${esc(dayName)} yet`}</b>${far ? "Here's every game on the schedule with the current odds as a preview." : "Picks post by 7:59 AM ET the day before and update with the odds and news until one hour before each game, when they're final."}</div>`}
      ${rest.length ? `<h2>${open.length ? "Other games" : "All games"} ${esc(dayName)}</h2>${isCollege() ? byConf(rest, s => schedRow(s, day), "up-list") : `<div class="up-list">${rest.map(s => schedRow(s, day)).join("")}</div>`}` : !open.length ? `<p class="note">No ${league === "ALL" ? "" : label + " "}games on the schedule ${esc(dayName)}${data.schedule ? "" : " yet. The schedule fills in at the next update"}.</p>` : ""}
      ${grading.length ? `<h2>Waiting on results</h2>${grading.map(gameCard).join("")}` : ""}
      ${starKey()}
      <p class="note">Odds are the line at pick time, and previews are ESPN's consensus line. Your book's price may differ. Only bet what you can afford to lose. Help: 1-800-GAMBLER.</p>`;
  }

  function curveSVG(bets) {
    const s = bets.filter(b => ["win", "loss", "push"].includes(b.status)).sort((a, b) => a.date.localeCompare(b.date) || a.id.localeCompare(b.id));
    if (!s.length) return `<p class="note">The chart starts after the first graded bet.</p>`;
    let run = 0; const pts = [{ v: 0, label: "Start" }, ...s.map(b => ({ v: run += betMoney(b).net, label: b.date.slice(5) }))];
    const W = 520, H = 170, pl = 44, pr = 12, pt = 14, pb = 26;
    const lo = Math.min(0, ...pts.map(p => p.v)), hi = Math.max(0, ...pts.map(p => p.v));
    const span = (hi - lo) || 1, pad = span * 0.15, y0 = lo - pad, y1 = hi + pad;
    const X = i => pl + i * (W - pl - pr) / Math.max(pts.length - 1, 1), Y = v => pt + (y1 - v) / (y1 - y0) * (H - pt - pb);
    const line = pts.map((p, i) => `${i ? "L" : "M"}${X(i).toFixed(1)} ${Y(p.v).toFixed(1)}`).join("");
    const last = pts.at(-1), col = last.v >= 0 ? "var(--win)" : "var(--loss)";
    const ticks = [y0 + pad, 0, y1 - pad].filter((v, i, a) => a.indexOf(v) === i);
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Running profit and loss">
      <defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${last.v >= 0 ? C("win") : C("loss")}" stop-opacity=".28"/><stop offset="1" stop-color="${last.v >= 0 ? C("win") : C("loss")}" stop-opacity="0"/></linearGradient></defs>
      ${ticks.map(v => `<line x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="${C("ink-3")}" stroke-opacity="${v === 0 ? .5 : .18}" ${v === 0 ? 'stroke-dasharray="3 4"' : ""}/><text x="${pl - 6}" y="${Y(v) + 4}" text-anchor="end">${v === 0 ? "$0" : sign$(v).replace(".00", "")}</text>`).join("")}
      <path d="${line}L${X(pts.length - 1)} ${Y(y0)}L${X(0)} ${Y(y0)}Z" fill="url(#pg)"/>
      <path d="${line}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${pts.map((p, i) => `<circle cx="${X(i)}" cy="${Y(p.v)}" r="${i === pts.length - 1 ? 5 : 2.5}" fill="${i === pts.length - 1 ? col : C("ink-2")}"/>`).join("")}
      <text x="${X(0)}" y="${H - 6}">Start</text><text x="${X(pts.length - 1)}" y="${H - 6}" text-anchor="end">${esc(last.label)}</text>
    </svg>`;
  }

  // Guests (no owner topic) only ever see their own placed bets in Stats; the All picks view is the owner's.
  const scopeNow = () => owner ? scope : "mine";
  const recBets = () => (data.bets || []).filter(b => (scopeNow() !== "mine" || placed.has(b.id)) && (recKind === "all" || kindOf(b) === recKind));
  function splitTable(title, key, names) {
    const bets = recBets().map(b => key === "kind" ? { ...b, kind: kindOf(b) } : b);
    const keys = names || [...new Set(bets.map(b => b[key]))];
    const rows = keys.map(k => [k, totals(bets.filter(b => b[key] === k))]).filter(([, t]) => t.w + t.l + t.p + t.pending);
    return `<div class="card glass"><h2>${title}</h2><div class="table-wrap"><table>
      <thead><tr><th></th><th class="num">W-L-P</th><th class="num">Open</th><th class="num">Net</th><th class="num">ROI</th></tr></thead>
      <tbody>${rows.map(([k, t]) => `<tr><td>${esc(PLAY_NAME[k] || { sgp: "SGP (same game)", traditional: "Traditional (multi-game)", potd: "Pick of the Day", MULTI: "Multi-game" }[k] || (k === "mixed" ? "Mixed parlay" : k === "total" ? "Totals" : k === "prop" ? "Player props" : k))}</td><td class="num">${t.w}-${t.l}-${t.p}</td><td class="num">${t.pending}</td><td class="num ${cls(t.net)}">${sign$(t.net)}</td><td class="num ${cls(t.roi)}">${t.roi.toFixed(1)}%</td></tr>`).join("")}</tbody>
    </table></div></div>`;
  }

  function meterSVG(u) {
    const R = Math.max(5, Math.ceil(Math.abs(u) * 1.5 / 5) * 5), H = 260, top = 14, bot = 14;
    const Y = v => top + (R - v) / (2 * R) * (H - top - bot), y0 = Y(0), yu = Y(Math.max(-R, Math.min(R, u)));
    const col = u > 0.004 ? "var(--win)" : u < -0.004 ? "var(--loss)" : "var(--ink-2)";
    return `<svg viewBox="0 0 64 ${H}" role="img" aria-label="Units meter: ${u.toFixed(2)} units">
      <defs><linearGradient id="mg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${C("win")}" stop-opacity=".9"/><stop offset=".5" stop-color="${C("win")}" stop-opacity=".15"/><stop offset=".5" stop-color="${C("loss")}" stop-opacity=".15"/><stop offset="1" stop-color="${C("loss")}" stop-opacity=".9"/></linearGradient></defs>
      <rect x="22" y="${top}" width="14" height="${H - top - bot}" rx="7" fill="url(#mg)"/>
      <line x1="16" x2="42" y1="${y0}" y2="${y0}" stroke="${C("ink")}" stroke-opacity=".55" stroke-dasharray="3 3"/>
      <text x="62" y="${top + 8}" text-anchor="end" fill="${C("win")}">+${R}</text>
      <text x="62" y="${y0 + 4}" text-anchor="end" fill="${C("ink-2")}">0</text>
      <text x="62" y="${H - bot}" text-anchor="end" fill="${C("loss")}">-${R}</text>
      <path d="M8 ${yu - 7} L20 ${yu} L8 ${yu + 7} Z" fill="${col}"/>
      <rect x="20" y="${yu - 3}" width="18" height="6" rx="3" fill="${C("ink")}"/>
    </svg>`;
  }

  function viewRecord() {
    const all = (data.bets || []).filter(b => recKind === "all" || kindOf(b) === recKind);
    const scope = scopeNow();
    const bets = scope === "mine" ? all.filter(b => placed.has(b.id)) : all;
    const t = totals(bets);
    // The dollar headline, curve and risked line only count bets you placed, at the units and $/unit
    // locked in when you tapped, so the Bankroll slider never moves them. Record, units and ROI above
    // still follow the All picks / My bets switch.
    const mineBets = all.filter(b => lockOf(b)), mt = totals(mineBets);
    const list = all.filter(b => placed.has(b.id)).filter(b => betFilter === "all" || b.status === betFilter || (betFilter === "settled" && b.status !== "pending"))
      .sort((a, b) => b.date.localeCompare(a.date) || PLAY_ORDER.indexOf(a.play) - PLAY_ORDER.indexOf(b.play));
    const toGreen = t.units < 0 ? `${(-t.units + 0.01).toFixed(2)}u to get back to green` : t.units > 0 ? `${t.units.toFixed(2)}u of cushion before red` : "Right at even";
    return `
      ${owner ? "" : `<p class="note" style="margin:0 0 4px">Your stats: only the bets you mark "I placed this" on this phone.</p>`}
      <div class="seg glass" role="group" aria-label="Whose bets"${owner ? "" : ' style="display:none"'}><button data-scope="all" aria-pressed="${scope === "all"}">All picks</button><button data-scope="mine" aria-pressed="${scope === "mine"}">My bets${placed.size ? " · " + all.filter(b => placed.has(b.id)).length : ""}</button></div>
      <div class="chips" role="toolbar" aria-label="Slip type">${[["all", "All slips"], ["sgp", "SGP"], ["traditional", "Traditional"], ["potd", "Pick of the Day"]].map(([k, n]) => `<button class="chip" data-rec-kind="${k}" aria-pressed="${recKind === k}">${n}</button>`).join("")}</div>
      ${scope === "mine" && !bets.length ? `<div class="empty glass"><b>No placed bets yet</b>Tap "I placed this" on any play in Today, or "I placed all" on a game, and your own record shows up here.</div>` : ""}
      <section class="hero glass"><div class="hero-grid"><div class="hero-main">
        <div><div class="eyebrow">All-time net on the bets you placed</div><div class="big ${cls(mt.net)}">${sign$(mt.net)}</div><div class="note">${toGreen}</div></div>
        <div class="stats">
          <div class="stat"><b>${t.w}-${t.l}-${t.p}</b><span>Record</span></div>
          <div class="stat"><b class="${cls(t.units)}">${t.units >= 0 ? "+" : ""}${t.units.toFixed(2)}u</b><span>Units</span></div>
          <div class="stat"><b class="${cls(t.roi)}">${t.roi.toFixed(1)}%</b><span>ROI</span></div>
          <div class="stat"><b>${t.pending}</b><span>Pending</span></div>
        </div>
        </div><div class="meter"><span class="lab">Units</span>${meterSVG(t.units)}<b class="${cls(t.units)}" style="font-family:var(--display);font-size:18px">${t.units >= 0 ? "+" : ""}${t.units.toFixed(1)}u</b></div></div>
        ${curveSVG(mineBets)}
        <p class="note">${fmt$(mt.risked)} risked on your settled bets, each at the units and unit size locked in when you tapped "I placed this". Moving the Bankroll slider never changes these dollars.</p>
      </section>
      ${recKind === "all" ? splitTable("By slip type", "kind", ["sgp", "traditional", "potd"]) : ""}
      ${splitTable("By play", "play", PLAY_ORDER)}
      ${splitTable("By league", "league")}
      ${splitTable("By bet type", "market")}
      <div class="card glass"><h2>Bet History</h2><p class="note">Only the bets you marked "I placed this", at the stake you locked in.</p>
        <div class="chips">${[["all", "All"], ["pending", "Pending"], ["win", "Won"], ["loss", "Lost"]].map(([k, n]) => `<button class="chip" data-filter="${k}" aria-pressed="${k === betFilter}">${n}</button>`).join("")}</div>
        <div>${list.slice(0, betLimit).map(b => {
          const m = betMoney(b), u = +(+m.units).toFixed(2);
          return `<div class="bet-row"><div class="t">${b.kind === "potd" ? "Pick of the Day" : b.kind === "traditional" ? "Traditional " + PLAY_NAME[b.play].toLowerCase() : PLAY_NAME[b.play]} · ${esc(b.legs.map(l => l.desc).join(" + "))}</div>
          <div class="s">${esc(b.date.slice(5))} · ${esc(b.game)} · ${fmtOdds(b.odds)}${b.cause ? " · " + esc(b.cause.split(":")[0]) : ""}</div>
          <div class="s"><b>${u}u placed</b> · ${fmt$(m.stake)} at ${fmt$(m.unit)} a unit${b.status === "pending" ? ` · to win ${fmt$(m.stake * (dec(b.odds) - 1))}` : ""}</div>
          <div class="v ${m.net == null ? "flat" : cls(m.net)}">${m.net == null ? "Open" : b.status === "push" ? "Push $0.00" : `${b.status === "win" ? "Won" : "Lost"} ${sign$(m.net)}`}</div></div>`;
        }).join("") || `<p class="note">${placed.size ? "No placed bets match." : "No placed bets yet. Tap \"I placed this\" on a play and it shows up here."}</p>`}</div>
        ${list.length > betLimit ? `<button class="see-more" data-more="1">See more <span>${Math.min(10, list.length - betLimit)} of ${list.length - betLimit} left</span> ⌄</button>`
          : list.length > 10 ? `<button class="see-more" data-less="1">Show less ⌃</button>` : ""}
      </div>`;
  }

  function slider(id, label, val, min, max, step, out, hint) {
    const fill = ((val - min) / (max - min) * 100).toFixed(1);
    return `<div class="slider"><label for="${id}">${label}<output id="${id}-out">${out}</output></label>
      <input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}" style="--fill:${fill}%">${hint ? `<small>${hint}</small>` : ""}</div>`;
  }

  function viewBankroll() {
    const tot = Object.values(prefs.split).reduce((a, b) => a + b, 0);
    const colors = { straight: "var(--floodlight)", safer: "var(--win)", best: "var(--violet)", longshot: "var(--gold)" };
    return `
      <section class="card glass"><h2>Per game</h2>
        ${slider("unit", "Unit size", prefs.unit, 1, 25, 0.5, fmt$(prefs.unit), `10 units a game, so ${fmt$(budget())} per game.`)}
        ${slider("games", "Games per day", prefs.games, 1, 8, 1, prefs.games, `Up to ${fmt$(budget() * prefs.games)} a day. The pipeline posts up to 8 ranked games and you bet the best ${prefs.games}.`)}
      </section>
      <section class="card glass"><h2>Split across the four plays</h2>
        <div class="split-bar">${PLAY_ORDER.map(p => `<i style="flex:${prefs.split[p]};background:${colors[p]}"></i>`).join("")}</div>
        ${PLAY_ORDER.map(p => slider("split-" + p, PLAY_NAME[p], prefs.split[p], 0, 70, 5, `${Math.round(prefs.split[p] / tot * 100)}%`, `${unitsFor(p)}u · ${fmt$(stakeFor(p))}`)).join("")}
        <p class="note">Most of the money sits on the likeliest play and the least on the longshot, so one miss can't sink the day. No leg shows up in more than 2 of a game's 4 plays.</p>
        <button class="btn" id="reset-split">Reset to 60 / 25 / 10 / 5</button>
      </section>
      <section class="card glass"><h2>Confidence sizing</h2>
        <div class="kelly-grid">
          <div style="display:grid;gap:12px">${slider("kelly", "Kelly fraction", prefs.kelly, 0, 0.5, 0.05, prefs.kelly ? prefs.kelly.toFixed(2) : "Off", "Off keeps the flat 60/25/10/5 split.")}
            <p class="note" style="margin:0">Kelly sizes a bet by how big its edge is: stake = fraction × (b × p − q) / b, where p is our win chance, q = 1 − p and b is the payout per $1. Raising the fraction moves more of each game's ${fmt$(budget())} toward the plays with the biggest edge. Bets get bigger when we're right and swings get bigger when we're wrong. The game total never changes. Pros use 0.25 or less.</p></div>
          <div class="kelly-art">${kellySVG()}</div>
        </div>
      </section>`;
  }

  function kellySVG() {
    // Share of bankroll Kelly suggests for a -110 bet as our win chance rises, full Kelly vs the chosen fraction.
    const W = 260, H = 170, pl = 34, pr = 10, pt = 12, pb = 30, q = 100 / 110;
    const ps = Array.from({ length: 21 }, (_, i) => 0.5 + i * 0.01);
    const k = p => Math.max(0, (q * p - (1 - p)) / q);
    const X = p => pl + (p - 0.5) / 0.2 * (W - pl - pr), Y = v => pt + (1 - v / 0.4) * (H - pt - pb);
    const path = f => ps.map((p, i) => `${i ? "L" : "M"}${X(p).toFixed(1)} ${Y(f * k(p)).toFixed(1)}`).join("");
    const f = prefs.kelly, p0 = 0.58;
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Kelly stake by win chance">
      ${[0, 0.1, 0.2, 0.3, 0.4].map(v => `<line x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="${C("ink-3")}" stroke-opacity=".18"/><text x="${pl - 5}" y="${Y(v) + 4}" text-anchor="end">${v * 100}%</text>`).join("")}
      <path d="${path(1)}" fill="none" stroke="${C("ink-2")}" stroke-width="1.5" stroke-dasharray="4 4"/>
      ${f ? `<path d="${path(f)}" fill="none" stroke="${C("accent")}" stroke-width="2.5"/><circle cx="${X(p0)}" cy="${Y(f * k(p0))}" r="4.5" fill="${C("accent")}"/><text x="${X(p0) + 8}" y="${Y(f * k(p0)) - 6}" fill="${C("ink")}" style="fill:${C("ink")}">${(f * k(p0) * 100).toFixed(1)}%</text>` : `<line x1="${pl}" x2="${W - pr}" y1="${Y(0.04)}" y2="${Y(0.04)}" stroke="${C("accent")}" stroke-width="2.5"/>`}
      <text x="${X(0.5)}" y="${H - 12}">50%</text><text x="${X(0.6)}" y="${H - 12}" text-anchor="middle">60%</text><text x="${X(0.7)}" y="${H - 12}" text-anchor="end">70%</text>
      <text x="${(pl + W - pr) / 2}" y="${H - 1}" text-anchor="middle">our win chance on a -110 bet</text>
      <text x="${X(0.69)}" y="${Y(k(0.69)) + 14}" text-anchor="end">full Kelly</text>
      <text x="${pl + 8}" y="${pt + 16}">${f ? "at " + f.toFixed(2) + ", stake share" : "Off: flat stakes"}</text>
    </svg>`;
  }

  function calibrationCard() {
    const s = data.summary || {}, c = s.calibration || { legs: 0, bins: [] }, v = s.clv || {};
    const W = 300, H = 170, pl = 34, pr = 10, pt = 10, pb = 28;
    const X = p => pl + p * (W - pl - pr), Y = p => pt + (1 - p) * (H - pt - pb);
    const chart = c.bins.length ? `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Calibration: what we said vs how often it hit">
        ${[0, .25, .5, .75, 1].map(v => `<line x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="${C("ink-3")}" stroke-opacity=".18"/><text x="${pl - 5}" y="${Y(v) + 4}" text-anchor="end">${v * 100}%</text>`).join("")}
        <line x1="${X(0)}" y1="${Y(0)}" x2="${X(1)}" y2="${Y(1)}" stroke="${C("ink-2")}" stroke-dasharray="4 4"/>
        ${c.bins.map(b => `<circle cx="${X(b.said)}" cy="${Y(b.hit)}" r="${Math.min(12, 4 + Math.sqrt(b.n) * 1.5)}" fill="${C("accent")}" fill-opacity=".75"/><text x="${X(b.said)}" y="${Y(b.hit) - 14}" text-anchor="middle">${b.n}</text>`).join("")}
        <text x="${(pl + W - pr) / 2}" y="${H - 4}" text-anchor="middle">win chance we gave the leg</text>
      </svg>` : "";
    return `<section class="card glass"><h2>Is the model honest?</h2>
      <div class="stats" style="grid-template-columns:repeat(3,1fr)">
        <div class="stat"><b>${c.legs}</b><span>Graded legs</span></div>
        <div class="stat"><b>${c.brier == null ? "–" : c.brier.toFixed(3)}</b><span>Brier score</span></div>
        <div class="stat"><b class="${v.avg_pct == null ? "flat" : cls(v.avg_pct)}">${v.avg_pct == null ? "–" : (v.avg_pct > 0 ? "+" : "") + v.avg_pct + "%"}</b><span>Beat the close</span></div>
      </div>
      ${chart || `<p class="note" style="margin:0">The calibration chart fills in as picks with model win chances get graded.</p>`}
      <p class="note" style="margin:0">Dots on the dashed line mean our win chances come true. Dots below it mean we're overconfident. Brier score: lower is better, 0.25 is coin-flip guessing. Beat the close is how much better our price was than the final line before the game. Positive over time is the best early sign of a real edge, since win-loss on under 100 bets is mostly luck.</p>
    </section>`;
  }

  function viewLessons() {
    const L = data.lessons || {};
    const causes = Object.entries(L.loss_causes || {});
    const maxC = Math.max(1, ...causes.map(([, v]) => v));
    const w = Object.entries(L.weights || {});
    const RT = L.retrain || {}, MC = RT.market_check || {};
    const ml = MC.model_logloss, mk = MC.market_logloss;
    const trainCard = `<section class="card glass"><h2>Model vs market</h2>
        <p style="margin:0">Every leg the model prices, picked or not, gets graded after the game, so it learns from thousands of outcomes instead of a few slips. It only changes its factor weights when the new ones predict better than both the old weights and the sportsbooks' own prices on games it hasn't seen.</p>
        <div class="stats"><div class="stat"><b>${(MC.n || 0).toLocaleString()}</b><span>Graded legs</span></div>
        <div class="stat"><b class="${ml == null ? "flat" : ml < mk ? "up" : "down"}">${ml == null ? "–" : ml < mk ? "Ahead" : "Behind"}</b><span>vs market</span></div></div>
        <p class="note">${ml == null ? "Training data starts with the next run. Comparisons appear once games finish." : `Prediction error (log loss, lower is better): model ${ml}, market ${mk}.`} ${RT.accepted ? "The last retrain improved the weights and was saved." : RT.reason ? "Last retrain: " + esc(RT.reason) + "." : ""}</p>
      </section>`;
    return trainCard + `
      <section class="card glass"><h2>Rules learned from graded games</h2>
        ${(L.rules || []).map(r => `<div class="rule"><p>${esc(r.rule)}</p><small>${esc(r.from)} · ${esc(r.why)}</small></div>`).join("") || `<p class="note">Rules appear after games are graded.</p>`}
      </section>
      ${calibrationCard()}
      <section class="card glass"><h2>Why legs lost</h2>
        <div class="bars">${causes.map(([k, v]) => `<div class="bar"><span>${esc(k)}</span><span class="track"><i style="width:${v / maxC * 100}%;background:${k === "bad read" ? "var(--loss)" : "var(--push)"}"></i></span><b>${v}</b></div>`).join("") || `<p class="note">No losing legs tagged yet.</p>`}</div>
        <p class="note">Bad read means our analysis was wrong, so the model shifts. Variance means we had the better price and lost anyway, so nothing changes. Price means the line moved against us before the bet.</p>
      </section>
      <section class="card glass"><h2>Stake changes</h2>
        ${(L.flags || []).map(f => `<div class="rule"><p>${esc(f.name)}: ${esc(f.action)}</p><small>${f.n} bets, ${f.roi}% ROI</small></div>`).join("") || `<p class="note">A bet type gets its stake cut once it has 8 or more graded bets and an ROI below -15%. Not enough bets yet.</p>`}
      </section>
      ${w.length ? `<section class="card glass"><h2>Factor weights</h2><div class="bars">${w.map(([k, v]) => `<div class="bar"><span>${esc(k.replace("_", " "))}</span><span class="track"><i style="width:${v / 2 * 100}%;background:var(--floodlight)"></i></span><b>${(+v).toFixed(2)}</b></div>`).join("")}</div></section>` : ""}`;
  }

  function viewSettings() {
    return `
      <section class="card glass"><h2>Appearance</h2>
        <div class="seg theme" role="group" aria-label="Theme">${[["light", "Light"], ["dark", "Dark"], ["dynamic", "Dynamic"]].map(([k, n]) => `<button data-theme-set="${k}" aria-pressed="${store.get("theme", "dynamic") === k}">${n}</button>`).join("")}</div>
        <p class="note">Dynamic switches to light with the 7:59 AM refresh and to dark with the 4:59 PM refresh (Eastern). It's ${document.documentElement.dataset.theme} right now.</p>
      </section>
      ${viewFilters()}
      <section class="card glass"><h2>Phone alerts</h2>
        <p style="margin:0">You only get alerts for games and slips you tap the <b>bell</b> on: line and odds moves, pick changes, injury news, when the picks lock an hour before the game, legs falling behind, lost or hit, and the result. No alert for every new pick.</p>
        <ol style="margin:0;padding-left:20px;display:grid;gap:4px"><li>Install the free <b>ntfy</b> app and subscribe to your private topic (it's in the ntfy app's list once you've added it).</li><li>Paste the same topic name below once, on each phone or browser you use.</li><li>Tap the bell on any game or slip.</li></ol>
        <div class="field-row"><label for="ntfytopic">Your alerts topic</label>
        <input type="password" id="ntfytopic" autocomplete="off" value="${esc(store.get("ntfyTopic", ""))}" placeholder="Stays on this device only"></div>
        <button class="btn" id="savetopic">Save topic</button>
        <p class="note">Watching ${watching.size} game${watching.size === 1 ? "" : "s"} or slip${watching.size === 1 ? "" : "s"}. Your topic works like a password, so it stays on this device.</p>
        <p class="note"><b>Sync:</b> with the same topic saved on your phone and your browser, everything you change in one (unit size, splits, theme, pick toggles, placed bets, bells) shows up on the other within about 30 seconds of opening it.</p>
      </section>
      <section class="card glass"><h2>Schedule</h2>
        <p style="margin:0">New picks post at <b>7:59 AM Eastern</b>. The app and website then update 5 more times a day: <b>11 AM, 2, 5, 8 and 11 PM</b> with results, injury news and late-added games. Picks keep updating with the odds and news until one hour before each game starts, then they're final. Live scores on the website update every minute during games.</p>
        <p class="note">Data last updated ${esc(data.generated ? new Date(data.generated).toLocaleString("en-US", { timeZone: "America/New_York", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) + " ET" : "never")}.</p>
      </section>
      <section class="card glass"><h2>Put it on your phone</h2>
        <p style="margin:0">Once the app is hosted at its own web address, open it in Safari and tap Share, then Add to Home Screen. On Android, open it in Chrome and tap Install app. It opens full-screen like any other app.</p>
      </section>`;
  }

  function render() {
    // Top-right pill: only bets you marked placed, at the units and dollars locked in when you tapped,
    // so it moves only when one of your bets is graded, never with the unit slider.
    const t = totals((data.bets || []).filter(b => lockOf(b)));
    $("#pill").textContent = sign$(t.net); $("#pill").className = "pnl-pill " + cls(t.net);
    const upd = data.generated ? "Updated " + new Date(data.generated).toLocaleString("en-US", { timeZone: "America/New_York", hour: "numeric", minute: "2-digit" }) : "Games";
    $("#updated").textContent = { today: upd, record: "Stats", bankroll: "Bankroll", lessons: "Lessons", settings: "Settings" }[tab];
    $("#view").dataset.tab = tab;
    $("#view").innerHTML = ({ today: viewToday, record: viewRecord, bankroll: viewBankroll, lessons: viewLessons, settings: viewSettings }[tab] || viewToday)();
    document.querySelectorAll("nav.tabs button").forEach(b => b.dataset.tab === tab ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  }

  function savePrefs() { store.set("prefs", prefs); markSettings(); }

  document.addEventListener("click", e => {
    const el = e.target.closest("button"); if (!el) return;
    if (el.classList.contains("sw")) e.preventDefault();
    const on = el.getAttribute("aria-checked") !== "true";
    if (el.dataset.filtLeague) { const lg = el.dataset.filtLeague, nm = LEAGUES.find(l => l[0] === lg)[1];
      if (on) { filters.off_leagues = filters.off_leagues.filter(x => x !== lg); delete filters.off_teams[lg]; } else filters.off_leagues = [...new Set([...filters.off_leagues, lg])];
      saveFilters(on ? `${nm} picks on.` : `${nm} picks off.`); return; }
    if (el.dataset.filtAll) { const lg = el.dataset.filtAll; filters.off_teams[lg] = on ? [] : teamGroups(lg).groups.flatMap(g => g.teams).map(t => t.id); if (on) filters.off_leagues = filters.off_leagues.filter(x => x !== lg); saveFilters(); return; }
    if (el.dataset.filtGroup) { const [lg, ...rest] = el.dataset.filtGroup.split("|"), g = teamGroups(lg).groups.find(x => x.name === rest.join("|")); if (g) { setTeams(lg, g.teams.filter(t => !t.out).map(t => t.id), on); saveFilters(); } return; }
    if (el.dataset.filtTeam) { const [lg, id] = el.dataset.filtTeam.split("|"); if (on && !leagueOn(lg)) { filters.off_teams[lg] = teamGroups(lg).groups.flatMap(g => g.teams).map(t => t.id); } setTeams(lg, [id], on); saveFilters(); return; }
    if (el.dataset.tab) { tab = el.dataset.tab; store.set("tab", tab); render(); window.scrollTo({ top: 0 }); }
    else if (el.dataset.league) { league = el.dataset.league; store.set("league", league); render(); }
    else if (el.dataset.conf) { conf = el.dataset.conf; store.set("conf", conf); render(); }
    else if (el.dataset.themeSet) { store.set("theme", el.dataset.themeSet); markSettings(); applyTheme(); render(); }
    else if (el.dataset.watch) { setWatch(el.dataset.watch, el.dataset.watchLabel || "this game", !watching.has(el.dataset.watch)); }
    else if (el.id === "savetopic") { const v = ($("#ntfytopic").value || "").trim(); store.set("ntfyTopic", v); refreshOwner().then(render); toast(v ? "Alerts topic saved. Your settings now sync with every device that uses it." : "Alerts topic cleared."); if (v) { for (const k of watching) fetch(`https://ntfy.sh/${encodeURIComponent(v)}-watch`, { method: "POST", body: JSON.stringify({ key: k, on: true }) }).catch(() => {}); syncSince = "12h"; pullSync(); } }
    else if (el.dataset.placed) { setPlaced([el.dataset.placed], !placed.has(el.dataset.placed)); }
    else if (el.dataset.placedGame) { const g = games().find(x => x.key === el.dataset.placedGame); if (g) setPlaced(g.bets.map(b => b.id), !g.bets.every(b => placed.has(b.id))); }
    else if (el.dataset.scope) { scope = el.dataset.scope; store.set("scope", scope); render(); }
    else if (el.dataset.slip) { slipMode = el.dataset.slip; store.set("slip", slipMode); render(); }
    else if (el.dataset.recKind) { recKind = el.dataset.recKind; render(); }
    else if (el.dataset.day) { day = el.dataset.day; render(); scrollTo({ top: 0 }); }
    else if (el.dataset.whyBtn) { const id = el.dataset.whyBtn; openWhy.has(id) ? openWhy.delete(id) : openWhy.add(id); render(); }
    else if (el.dataset.stars) { const d = document.getElementById("stars-help"); if (d) { d.open = true; openWhy.add("stars-help"); d.scrollIntoView({ behavior: "smooth", block: "start" }); } }
    else if (el.dataset.jump) { const target = document.getElementById(el.dataset.jump); if (target) target.scrollIntoView({ behavior: "smooth", block: "start" }); }
    else if (el.dataset.filter) { betFilter = el.dataset.filter; betLimit = 10; render(); }
    else if (el.dataset.more) { betLimit += 10; render(); }
    else if (el.dataset.less) { betLimit = 10; render(); }
    else if (el.dataset.toggle) { const k = el.dataset.toggle; prefs.leagues = prefs.leagues.includes(k) ? prefs.leagues.filter(x => x !== k) : [...prefs.leagues, k]; savePrefs(); render(); }
    else if (el.id === "reset-split") { prefs.split = { ...DEFAULTS.split }; savePrefs(); render(); }
  });
  document.addEventListener("input", e => {
    const el = e.target;
    if (el.dataset && el.dataset.filtSearch) {
      const q = el.value.trim().toLowerCase(), box = el.closest("details");
      box.querySelectorAll(".filt-row[data-name]").forEach(r => r.hidden = !!q && !r.dataset.name.includes(q));
      box.querySelectorAll("details.filt").forEach(d => { const any = [...d.querySelectorAll(".filt-row[data-name]")].some(r => !r.hidden); d.hidden = !any; if (q && any) d.open = true; });
      return;
    }
    if (el.type !== "range") return;
    const v = +el.value;
    if (el.id === "unit") prefs.unit = v; else if (el.id === "games") prefs.games = v; else if (el.id === "kelly") prefs.kelly = v;
    else if (el.id.startsWith("split-")) prefs.split[el.id.slice(6)] = v;
    savePrefs();
    // Update the readouts while dragging; redraw the screen when the thumb is let go.
    el.style.setProperty("--fill", ((v - el.min) / (el.max - el.min) * 100).toFixed(1) + "%");
    const out = document.getElementById(el.id + "-out");
    if (out) out.textContent = el.id === "unit" ? fmt$(v) : el.id === "kelly" ? (v ? v.toFixed(2) : "Off") : el.id === "games" ? v : Math.round(v / Object.values(prefs.split).reduce((a, b) => a + b, 0) * 100) + "%";
  });
  document.addEventListener("change", e => {
    if (e.target.type !== "range") return;
    const id = e.target.id; render();
    const again = document.getElementById(id); if (again) again.focus({ preventScroll: true });
  });

  // Live scores straight from ESPN's public feed. Works once hosted; quietly skipped where the network blocks it.
  // Same rules as pipeline/live.py: share of regulation played, then pace each leg to the final.
  const REG = { NFL: [4, 15], NCAAF: [4, 15], NBA: [4, 12], NCAAB: [2, 20], NHL: [3, 20], MLB: [9, 0], SOCCER: [1, 90] };
  function elapsed(L) {
    if (L.state === "post") return 1;
    const [periods, minutes] = REG[L.league] || [4, 15], p = Math.max(1, L.period || 1);
    if (L.league === "MLB") return Math.min(1, (p - 1 + (/bot|end/i.test(L.text) ? 0.75 : 0.25)) / periods);
    if (L.league === "SOCCER") return Math.min(1, (parseInt(L.clock) || 45) / 90);
    const [mm, ss] = (L.clock || "0:00").split(":").map(Number);
    const left = isNaN(mm) ? minutes / 2 : mm + (ss || 0) / 60;
    return Math.min(1, ((p - 1) * minutes + (minutes - left)) / (periods * minutes));
  }
  function legStatus(l, L) {
    const f = Math.max(elapsed(L), 0.05), done = L.state === "post", h = L.hs, a = L.as;
    const pace = v => +(v / f).toFixed(1);
    const judge = (now, over) => {
      if (now > l.line) return { state: over ? "won" : "lost", now };
      if (done) return { state: over ? "lost" : "won", now };
      const p = pace(now); return { state: (over ? p > l.line : p < l.line) ? "on_track" : "behind", now, pace: p };
    };
    if (l.market === "total") return judge(h + a, l.side === "over");
    if (l.market === "ml" || l.market === "spread") {
      const home = [L.home, L.homeName].includes(l.team);
      const m = (home ? h - a : a - h) + (l.line || 0);
      return { state: done ? (m > 0 ? "won" : m < 0 ? "lost" : "push") : (m > 0 ? "on_track" : "behind"), now: home ? h - a : a - h };
    }
    if (l.market === "prop") {
      const v = ((L.stats || {})[l.player] || {})[l.stat];
      return v == null ? { state: "waiting" } : judge(v, l.side === "over");
    }
    return { state: "waiting" };
  }
  const BOX = { rec_yds: ["receiving", "YDS"], receptions: ["receiving", "REC"], rush_yds: ["rushing", "YDS"], pass_yds: ["passing", "YDS"], pass_td: ["passing", "TD"],
    points: [null, "PTS"], rebounds: [null, "REB"], assists: [null, "AST"], threes: [null, "3PT"], shots: [null, "S"], saves: [null, "SV"], goals: [null, "G"],
    hits: ["batting", "H"], runs: ["batting", "R"], rbi: ["batting", "RBI"], hr: ["batting", "HR"], strikeouts: ["pitching", "K"] };
  function boxStats(summary) {
    const out = {};
    for (const team of summary?.boxscore?.players || []) for (const grp of team.statistics || []) {
      const labels = grp.labels || [];
      for (const ath of grp.athletes || []) {
        const row = out[ath.athlete.displayName] ||= {};
        for (const [stat, [g, lab]] of Object.entries(BOX)) if ((!g || grp.name === g) && labels.includes(lab)) row[stat] = parseFloat(String(ath.stats[labels.indexOf(lab)]).split("-")[0]);
        if (["rushing", "receiving"].includes(grp.name) && labels.includes("TD")) row.anytime_td = (row.anytime_td || 0) + (parseFloat(ath.stats[labels.indexOf("TD")]) || 0);
        if (grp.name === "batting" && row.hits != null) row.h_r_rbi = (row.hits || 0) + (row.runs || 0) + (row.rbi || 0);
      }
    }
    return out;
  }

  async function pollLive() {
    const open = games().filter(g => g.pending && g.start && ESPN[g.league]);
    const now = Date.now();
    const due = open.filter(g => now > Date.parse(g.start) - 15 * 60e3 && now < Date.parse(g.start) + 6 * 3600e3);
    // ESPN's scoreboard dates are Eastern calendar days, so an 8 PM ET start (00:00Z) belongs to the day before its UTC date.
    const etDay = iso => new Intl.DateTimeFormat("en-CA", { timeZone: "America/New_York" }).format(new Date(iso)).replace(/-/g, "");
    for (const [lg, d] of [...new Set(due.map(g => g.league + "|" + etDay(g.start)))].map(k => k.split("|"))) {
      try {
        const r = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${ESPN[lg]}/scoreboard?dates=${d}`);
        const j = await r.json();
        for (const ev of j.events || []) {
          const c = ev.competitions[0], t = Object.fromEntries(c.competitors.map(x => [x.homeAway, x]));
          const g = due.find(g => g.league === lg && (g.event_id ? g.event_id === ev.id : g.game.includes(t.away.team.abbreviation) && g.game.includes(t.home.team.abbreviation)));
          if (!g) continue;
          const L = { league: g.league, state: ev.status.type.state, text: ev.status.type.shortDetail, period: ev.status.period, clock: ev.status.displayClock,
            home: t.home.team.abbreviation, homeName: t.home.team.displayName, hs: +t.home.score || 0, as: +t.away.score || 0,
            score: `${t.away.team.abbreviation} ${t.away.score} - ${t.home.team.abbreviation} ${t.home.score}` };
          if (L.state !== "pre" && g.bets.some(b => b.legs.some(l => l.market === "prop"))) {
            try { L.stats = boxStats(await (await fetch(`https://site.api.espn.com/apis/site/v2/sports/${ESPN[lg]}/summary?event=${ev.id}`)).json()); } catch {}
          }
          live[g.event_id || g.key] = L;
        }
      } catch {}
    }
    if (due.length && tab === "today") render();
  }

  // "I placed this" marks are saved to the artifact's database so they follow you to any device, and Claude can read them.
  async function connectPlaced() {
    try {
      const db = await window.claude?.use?.("db");
      if (!db) return;
      placedDb = db.collection("placed");
      watchDb = db.collection("watch");
      prefsDb = db.collection("prefs");
      prefsDb.doc("settings").onSnapshot(d => {
        const r = d && d.exists ? d.data() : null;
        if (adoptSettings(r)) render();
        else if (settingsAt && (!r || (r.updated || "") < settingsAt)) prefsDb.doc("settings").set(settingsSnapshot()).catch(() => {});
      }, () => {});
      prefsDb.doc("filters").onSnapshot(d => {
        const r = d && d.exists ? d.data() : null;
        if (r && (r.updated || "") > (filters.updated || "")) { filters = { ...blankFilters(), ...r }; store.set("filters", filters); render(); }
        else if (filters.updated && (!r || (r.updated || "") < filters.updated)) prefsDb.doc("filters").set(filters).catch(() => {});
      }, () => {});
      const localW = [...watching];
      watchDb.onSnapshot(qs => {
        const remote = new Map(qs.docs.filter(d => d.exists).map(d => [d.id, d.data().key]));
        for (const k of localW) { const id = k.replace(/[^\w-]/g, "_"); if (!remote.has(id)) { watchDb.doc(id).set({ key: k, on: true, at: new Date().toISOString() }).catch(() => {}); remote.set(id, k); } }
        localW.length = 0;
        watching = new Set([...remote.values()].filter(Boolean)); store.set("watch", [...watching]); render();
      }, () => {});
      const local = [...placed];
      placedDb.onSnapshot(qs => {
        const docs = qs.docs.filter(d => d.exists), remote = new Set(docs.map(d => d.id));
        for (const d of docs) { const v = d.data() || {}; if (v.units != null && v.unit) placedInfo[d.id] = { units: v.units, unit: v.unit, at: v.at }; else if (placedInfo[d.id]) placedDb.doc(d.id).set({ placed: true, ...placedInfo[d.id] }).catch(() => {}); }
        for (const id of local) if (!remote.has(id)) { placedDb.doc(id).set({ placed: true, ...(placedInfo[id] || { at: new Date().toISOString() }) }).catch(() => {}); remote.add(id); }
        local.length = 0; store.set("placedInfo", placedInfo);
        placed = new Set([...remote, ...ledgerPlaced()]); store.set("placed", [...placed]); render();
      }, () => {});
    } catch {}
  }

  // Pull the newest picks whenever the app opens, comes back to the front, or every 2 minutes while open,
  // so the home-screen app and the website show a refresh at the same moment.
  // Dynamic theme flips at the morning and afternoon refreshes; re-check every minute and when the app comes back.
  setInterval(() => { const before = document.documentElement.dataset.theme; if (applyTheme() !== before) render(); }, 60e3);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { const before = document.documentElement.dataset.theme; if (applyTheme() !== before) render(); } });

  async function loadData() {
    try {
      const r = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
      if (!r.ok) return;
      const j = await r.json();
      if (j && j.bets && j.generated !== data.generated) { data = j; for (const id of ledgerPlaced()) placed.add(id);
        adoptFromData();
        render(); }
    } catch {}
  }
  async function boot() {
    await refreshOwner();
    await loadData();
    render();
    setInterval(loadData, 120e3);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) loadData(); });
    connectPlaced();
    adoptFromData();
    // First sync on this device: share placed bets tapped before sync existed.
    if (topicNow() && !store.get("syncSeeded", false)) {
      const now = new Date().toISOString(), led = new Set(ledgerPlaced());
      for (const id of placed) if (!placedAt[id] && !led.has(id)) { placedAt[id] = now; postSync("prefs", { key: "placed", id, on: true, at: now, ...(placedInfo[id] || {}) }); }
      store.set("placedAt", placedAt); store.set("syncSeeded", true);
    }
    pullSync(); setInterval(pullSync, 30e3);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) pullSync(); });
    pollLive(); setInterval(pollLive, 60e3);
    if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
  }
  render();
  boot();
})();
</script>
