<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sigma Locks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#04080f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column of matte cards over a soft blue field, bubble buttons, bottom tab bar like a sportsbook.
   Colors: blue, white and gold. Three themes in Settings: light, dark, and dynamic (light from the 7:59 AM refresh, dark from the 4:59 PM one). */
:root, :root[data-theme="dark"] {
  color-scheme: dark;
  --night: #04080f;
  --night-2: #070d1a;
  --surface: #0b1424;
  --surface-hi: #0f1a2f;
  --inset: #070e1b;
  --rim: rgba(150, 180, 240, 0.11);
  --line: rgba(150, 180, 240, 0.08);
  --soft: rgba(120, 165, 255, 0.10);
  --track: rgba(160, 190, 255, 0.16);
  --bar: rgba(8, 14, 26, 0.94);
  --toast: #f4f7ff; --toast-ink: #04080f;
  --shadow: 0 12px 28px -18px rgba(0, 0, 0, 0.9);
  --logo-bg: #e9eff9;
  --ink: #f4f7ff;
  --ink-2: #b6c4e2;
  --ink-3: #8193b8;
  --accent: #4d8dff;
  --accent-soft: rgba(77, 141, 255, 0.14);
  --accent-line: rgba(77, 141, 255, 0.45);
  --on-accent: #ffffff;
  --on-color: #04080f;
  --gold: #f5bd3a;
  --gold-soft: rgba(245, 189, 58, 0.14);
  --gold-line: rgba(245, 189, 58, 0.45);
  --glow-1: rgba(77, 141, 255, 0.13);
  --glow-2: rgba(245, 189, 58, 0.05);
  --floodlight: var(--accent);
  --violet: #a58bff;
  --win: #43d69b;
  --loss: #ff6b78;
  --push: #f5bd3a;
  --display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 22px;
  --r-sm: 14px;
}
:root[data-theme="light"] {
  color-scheme: light;
  --night: #eaf1fb;
  --night-2: #f7faff;
  --surface: #ffffff;
  --surface-hi: #ffffff;
  --inset: #f2f6fd;
  --rim: rgba(12, 52, 120, 0.10);
  --line: rgba(12, 52, 120, 0.09);
  --soft: rgba(11, 78, 162, 0.07);
  --track: rgba(12, 52, 120, 0.12);
  --bar: rgba(255, 255, 255, 0.95);
  --toast: #0d2147; --toast-ink: #ffffff;
  --shadow: 0 10px 26px -16px rgba(13, 40, 90, 0.28);
  --logo-bg: #eef3fb;
  --ink: #0d1f3c;
  --ink-2: #44587c;
  --ink-3: #6d7f9f;
  --accent: #0b5ac2;
  --accent-soft: rgba(11, 90, 194, 0.08);
  --accent-line: rgba(11, 90, 194, 0.35);
  --on-accent: #ffffff;
  --on-color: #ffffff;
  --gold: #c99412;
  --gold-soft: rgba(214, 160, 28, 0.13);
  --gold-line: rgba(201, 148, 18, 0.5);
  --glow-1: rgba(11, 90, 194, 0.12);
  --glow-2: rgba(245, 189, 58, 0.14);
  --violet: #6b4fd8;
  --win: #11925c;
  --loss: #d23645;
  --push: #b9840a;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
html { touch-action: pan-x pan-y; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; background: var(--night); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
}
.field { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; background:
  radial-gradient(60vmax 40vmax at 12% -6%, var(--glow-1), transparent 60%),
  radial-gradient(50vmax 36vmax at 105% 22%, var(--glow-2), transparent 60%),
  linear-gradient(180deg, var(--night-2), var(--night)); }
.field::after { content: ""; position: absolute; inset: 0; background-image: linear-gradient(var(--line) 1px, transparent 1px); opacity: .35; background-size: 100% 44px; mask-image: linear-gradient(180deg, transparent, #000 40%, transparent); }
.app { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(12px + env(safe-area-inset-top, 0px)) calc(96px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }

/* Matte cards: flat fill, hairline rim, soft drop shadow. No gloss. */
.glass { background: var(--surface); border: 1px solid var(--rim); border-radius: var(--r); box-shadow: var(--shadow); }

/* Solid strip behind the phone's status bar so content doesn't scroll under the clock. */
body::before { content: ""; position: fixed; z-index: 6; left: 0; right: 0; top: 0; height: env(safe-area-inset-top, 0px); background: var(--night); }
.days { margin-top: 4px; scroll-margin-top: 90px; }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand b { font-family: var(--display); font-size: 24px; font-weight: 800; letter-spacing: .02em; text-transform: uppercase; line-height: 1; }
.brand small { display: block; color: var(--ink-3); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; }
.pnl-pill { font-family: var(--display); font-weight: 700; font-size: 20px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--gold-line); background: var(--gold-soft); }
.up { color: var(--win); } .down { color: var(--loss); } .flat { color: var(--ink-2); }

h1, h2, h3 { margin: 0; font-family: var(--display); text-transform: uppercase; letter-spacing: .03em; text-wrap: balance; }
h2 { font-size: 15px; font-weight: 700; color: var(--ink-2); letter-spacing: .12em; }
.eyebrow { font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }

.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; padding: 5px; border-radius: 18px; }
.day { position: relative; display: grid; justify-items: center; gap: 1px; padding: 8px 0 7px; border: 0; border-radius: 13px; background: none; color: var(--ink-2); cursor: pointer; font: inherit; min-width: 0; }
.day b { font: 700 13px var(--body); text-transform: uppercase; letter-spacing: .04em; }
.day small { font-size: 11px; color: var(--ink-3); white-space: nowrap; }
.day i { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); margin-top: 2px; }
.day[aria-selected="true"] { background: var(--accent); color: var(--on-accent); }
.day[aria-selected="true"] small { color: var(--on-accent); opacity: .8; } .day[aria-selected="true"] i { background: var(--gold); }
.day i { background: var(--gold); }
.conf-chips { margin-top: -6px; }
.conf-chips .chip { font-size: 12.5px; padding: 6px 12px; }
.conf-h { font: 700 13px var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--gold); margin: 6px 2px -4px; display: flex; align-items: center; gap: 8px; }
.conf-h span { font-weight: 600; color: var(--ink-3); }
.conf-h::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.leg-game { display: block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin-top: 4px; }
.see-more { justify-self: center; margin-top: 10px; font: 600 13px var(--body); color: var(--accent); background: var(--accent-soft); border: 1px solid var(--accent-line); border-radius: 999px; padding: 8px 16px; cursor: pointer; }
.see-more span { color: var(--ink-3); font-weight: 500; }
.seg.theme { grid-template-columns: 1fr 1fr 1fr; background: var(--inset); border: 1px solid var(--rim); }
.seg.mode { margin-top: -2px; grid-template-columns: 1fr 1fr 1.35fr; }
@media (max-width: 380px) { .day b { font-size: 11px; } .day small { font-size: 10px; } .seg.mode button { font-size: 12px; } }
.seg.mode button { padding: 10px 4px; font-size: 13px; }
.potd { border-color: var(--gold-line); box-shadow: var(--shadow), inset 0 3px 0 var(--gold); }
.pv { display: block; font-size: 12px; color: var(--ink-2); margin-top: 2px; }
.pv b { color: var(--ink); font-weight: 600; }
.pv-none { display: block; font-size: 11.5px; color: var(--ink-3); font-style: italic; margin-top: 2px; }
.pv-state { font: 700 13px var(--display); letter-spacing: .03em; color: var(--ink-2); text-align: right; white-space: nowrap; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px; margin: 0 -2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; font: 600 13.5px var(--body); color: var(--ink-2); padding: 8px 14px; border-radius: 999px; border: 1px solid var(--rim); background: var(--surface); box-shadow: var(--shadow); cursor: pointer; }
.chip[aria-pressed="true"] { color: var(--on-accent); background: var(--accent); border-color: var(--accent); }
.chip .n { opacity: .6; margin-left: 4px; }

.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; font-size: 13.5px; color: var(--ink-2); border-radius: var(--r-sm); }
.banner .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--push); margin-top: 6px; flex: none; box-shadow: 0 0 10px var(--push); }

.game { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.game-head { display: flex; flex-wrap: wrap-reverse; justify-content: space-between; align-items: flex-start; gap: 6px 10px; }
.matchup { font-family: var(--display); font-size: 28px; font-weight: 800; line-height: 1; letter-spacing: .01em; text-transform: uppercase; }
.matchup .at { color: var(--ink-3); font-weight: 600; margin: 0 6px; }
.meta { color: var(--ink-3); font-size: 12.5px; margin-top: 4px; }
.game-sum { margin: -4px 0 0; color: var(--ink-2); font-size: 13.5px; line-height: 1.45; }
.head-right { display: flex; align-items: center; gap: 8px; flex: none; }
.bell { flex: none; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 999px; border: 1px solid var(--rim); background: var(--inset); color: var(--ink-3); cursor: pointer; padding: 0; }
.bell svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.bell[aria-pressed="true"] { color: var(--gold); border-color: var(--gold-line); background: var(--gold-soft); }
.bell[aria-pressed="true"] svg { fill: currentColor; }
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); z-index: 60; padding: 12px 14px; border-radius: 16px; background: var(--toast); border: 0; color: var(--toast-ink); font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
.status { flex: none; font: 700 11px var(--body); letter-spacing: .1em; text-transform: uppercase; padding: 5px 9px; border-radius: 999px; border: 1px solid currentColor; }
.status.pending { color: var(--accent); } .status.live { color: var(--loss); } .status.final { color: var(--ink-2); } .status.prov { color: var(--push); }

.plays { display: grid; gap: 8px; }
.play { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 12px 12px 14px; border-radius: var(--r-sm); background: var(--inset); border: 1px solid var(--line); position: relative; overflow: hidden; }
.play::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 3px; background: var(--tier); }
.play[data-play="straight"] { --tier: var(--accent); } .play[data-play="safer"] { --tier: var(--win); }
.play[data-play="best"] { --tier: var(--violet); } .play[data-play="longshot"] { --tier: var(--gold); }
.play-name { font: 700 11.5px var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--tier); display: flex; gap: 8px; align-items: center; }
.u-tag { font: 600 11px var(--body); letter-spacing: .02em; text-transform: none; color: var(--ink-3); padding: 1px 6px; border-radius: 999px; background: var(--soft); }
.stars { color: var(--gold); letter-spacing: 1px; font-size: 11px; }
.legs { grid-column: 1; font-size: 14.5px; font-weight: 500; min-width: 0; }
.legs span { display: block; }
.live-chip { display: inline-block; margin-left: 6px; font: 700 10.5px var(--body); letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; vertical-align: 1px; }
.live-chip.on_track, .live-chip.won { color: var(--on-color); background: var(--win); }
.live-chip.behind { color: var(--on-color); background: var(--push); }
.live-chip.lost { color: #fff; background: var(--loss); }
.live-chip.waiting { color: var(--ink-2); background: var(--soft); }
.live-sub { display: block; font-size: 12px; color: var(--ink-3); }
.legs .r-win::after { content: " ✓"; color: var(--win); } .legs .r-loss { color: var(--ink-3); text-decoration: line-through; }
.price { grid-column: 2; grid-row: 1 / span 2; text-align: right; display: flex; flex-direction: column; justify-content: center; }
.price .odds { font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1; }
.price .stake { font-size: 12px; color: var(--ink-2); margin-top: 4px; white-space: nowrap; }
.result-tag { font: 700 11px var(--body); letter-spacing: .1em; text-transform: uppercase; }
.game-foot { display: flex; justify-content: space-between; color: var(--ink-2); font-size: 13px; border-top: 1px solid var(--line); padding-top: 10px; }

.tiles { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(220px, 1fr); gap: 10px; overflow-x: auto; scrollbar-width: none; padding: 2px; margin: 0 -2px; }
.tiles::-webkit-scrollbar { display: none; }
.tile { padding: 14px; display: grid; gap: 10px; justify-items: center; text-align: center; cursor: pointer; color: inherit; font: inherit; }
.tile .logos { display: flex; align-items: center; gap: 12px; }
.tile .vs { font-family: var(--display); color: var(--ink-3); font-weight: 600; font-size: 18px; }
.tile .time { font-family: var(--display); font-weight: 700; font-size: 20px; letter-spacing: .02em; text-transform: uppercase; line-height: 1; }
.tile .where { color: var(--ink-2); font-size: 12.5px; line-height: 1.3; }
.logo { width: var(--s, 56px); height: var(--s, 56px); border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--logo-bg); border: 1px solid var(--rim); overflow: hidden; }
.logo img { width: 78%; height: 78%; object-fit: contain; }
.logo > * { grid-area: 1 / 1; }
.logo.badge img { opacity: 0; }
.logo:not(.badge) b { display: none; }
.logo b { font-family: var(--display); font-weight: 800; font-size: calc(var(--s, 56px) * .34); letter-spacing: .02em; color: #fff; }
.logo.badge { background: linear-gradient(150deg, var(--c1), var(--c2)); border-color: rgba(255,255,255,.22); box-shadow: inset 0 1px 0 rgba(255,255,255,.25); }
.matchup-row { display: flex; align-items: center; gap: 10px; }
.placed-btn { grid-column: 1 / -1; justify-self: start; font: 600 12.5px var(--body); color: var(--ink-2); background: transparent; border: 1px solid var(--rim); border-radius: 999px; padding: 6px 12px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.placed-btn[aria-pressed="true"] { color: var(--on-color); background: var(--win); border-color: var(--win); }
.placed-all { font: 600 12.5px var(--body); color: var(--accent); background: var(--accent-soft); border: 1px solid var(--accent-line); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.placed-all[aria-pressed="true"] { color: var(--on-color); background: var(--win); border-color: var(--win); }
.seg { display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: 999px; gap: 4px; }
.seg button { font: 700 13.5px var(--body); color: var(--ink-2); background: none; border: 0; border-radius: 999px; padding: 10px; cursor: pointer; }
.seg button[aria-pressed="true"] { color: var(--on-accent); background: var(--accent); box-shadow: 0 4px 12px -6px var(--accent); }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1fr) 76px; gap: 14px; align-items: stretch; }
.hero-main { display: grid; gap: 14px; min-width: 0; }
.meter { display: grid; grid-template-rows: auto 1fr auto; justify-items: center; gap: 6px; padding: 10px 6px; border-radius: var(--r-sm); background: var(--inset); border: 1px solid var(--line); }
.meter svg { width: 100%; height: 100%; min-height: 220px; }
.meter svg text { font: 600 10.5px var(--body); }
.meter .lab { font: 700 10.5px var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.kelly-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
.kelly-art svg { width: 100%; height: auto; display: block; }
.kelly-art svg text { font: 11px var(--body); fill: var(--ink-3); }
@media (max-width: 520px) { .kelly-grid { grid-template-columns: 1fr; } }
.empty { padding: 26px 18px; text-align: center; color: var(--ink-2); }
.empty b { display: block; font-family: var(--display); font-size: 20px; text-transform: uppercase; color: var(--ink); margin-bottom: 4px; }

.hero { padding: 18px; display: grid; gap: 14px; }
.big { font-family: var(--display); font-weight: 800; font-size: clamp(48px, 15vw, 68px); line-height: .9; letter-spacing: -.01em; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.stat { min-width: 0; overflow: hidden; padding: 10px; border-radius: var(--r-sm); background: var(--inset); border: 1px solid var(--line); }
.stat b { display: block; font-family: var(--display); font-size: 22px; font-weight: 700; line-height: 1.1; }
.stat span { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .1em; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--ink-3); font: 11px var(--body); }

.card { padding: 16px; display: grid; gap: 12px; }
.table-wrap { overflow-x: auto; margin: 0 -4px; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; font: 600 11px var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); padding: 6px 4px; }
td { padding: 8px 4px; border-top: 1px solid var(--line); }
td.num, th.num { text-align: right; }

.bet-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.bet-row:first-child { border-top: 0; }
.bet-row .t { font-weight: 600; font-size: 14px; min-width: 0; }
.bet-row .s { color: var(--ink-3); font-size: 12.5px; grid-column: 1; }
.bet-row .v { grid-column: 2; grid-row: 1 / span 2; text-align: right; font-family: var(--display); font-weight: 700; font-size: 19px; align-self: center; }

.slider { display: grid; gap: 6px; }
.slider label { display: flex; justify-content: space-between; font-weight: 600; font-size: 14px; }
.slider label output { font-family: var(--display); font-size: 20px; font-weight: 700; color: var(--accent); }
.slider small { color: var(--ink-3); font-size: 12.5px; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; background: transparent; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 6px; background: linear-gradient(90deg, var(--accent) var(--fill, 50%), var(--track) var(--fill, 50%)); }
input[type=range]::-moz-range-track { height: 6px; border-radius: 6px; background: var(--track); }
input[type=range]::-moz-range-progress { height: 6px; border-radius: 6px; background: var(--accent); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; margin-top: -9px; background: var(--surface); border: 2px solid var(--accent) !important; border: 0; box-shadow: 0 0 0 4px var(--accent-soft), 0 4px 10px rgba(0,0,0,.25); }
input[type=range]::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: var(--ink); border: 0; box-shadow: 0 0 0 4px var(--accent-soft); }
.split-bar { display: flex; height: 12px; border-radius: 12px; overflow: hidden; gap: 2px; }
.split-bar i { display: block; }

.bars { display: grid; gap: 8px; }
.bar { display: grid; grid-template-columns: 110px 1fr 44px; gap: 10px; align-items: center; font-size: 13px; }
.bar .track { height: 8px; border-radius: 8px; background: var(--track); overflow: hidden; }
.bar .track i { display: block; height: 100%; border-radius: 8px; }
.rule { padding: 12px 0; border-top: 1px solid var(--line); }
.rule:first-of-type { border-top: 0; }
.rule p { margin: 0; font-weight: 600; }
.rule small { color: var(--ink-3); display: block; margin-top: 2px; }

.field-row { display: grid; gap: 6px; }
.field-row label { font-weight: 600; font-size: 14px; }
.field-row input[type=password], .field-row input[type=text] { font: 500 15px var(--body); color: var(--ink); background: var(--inset); border: 1px solid var(--rim); border-radius: 12px; padding: 12px; width: 100%; }
.toggles { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { flex: none; position: relative; width: 50px; height: 30px; border-radius: 999px; border: 0; cursor: pointer; background: #d23645; box-shadow: inset 0 1px 3px rgba(0,0,0,.25); transition: background .15s; }

  // Theme before first paint: "light", "dark", or "dynamic" (light from the 7:59 AM ET refresh, dark from the 4:59 PM ET refresh).
  window.themeFor = function (pref) {
    if (pref === "light" || pref === "dark") return pref;
    const hm = new Date().toLocaleTimeString("en-GB", { timeZone: "America/New_York", hour: "2-digit", minute: "2-digit", hour12: false });
    return hm >= "07:59" && hm < "16:59" ? "light" : "dark";
  };
  window.applyTheme = function () {
    let pref = "dynamic";
    try { pref = JSON.parse(localStorage.getItem("sliplab:theme")) || "dynamic"; } catch {}
    const t = themeFor(pref);
    document.documentElement.dataset.theme = t;
    const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = t === "light" ? "#eaf1fb" : "#04080f";
    return t;
  };
  applyTheme();
</script>

<script>
(() => {
  const $ = (s, el = document) => el.querySelector(s);
  const LEAGUES = [["ALL", "All"], ["NCAAF", "CFB"], ["NFL", "NFL"], ["MLB", "MLB"], ["NCAAB", "CBB"], ["NHL", "NHL"], ["NBA", "NBA"], ["SOCCER", "Soccer"]];
  const PLAY_ORDER = ["straight", "safer", "best", "longshot"];
  const PLAY_NAME = { straight: "Straight", safer: "Safer parlay", best: "Best parlay", longshot: "Longshot" };
  const ESPN = { MLB: "baseball/mlb", NFL: "football/nfl", NBA: "basketball/nba", NHL: "hockey/nhl", NCAAF: "football/college-football", NCAAB: "basketball/mens-college-basketball", SOCCER: "soccer/eng.1" };
  const DEFAULTS = { unit: 3, split: { straight: 60, safer: 25, best: 10, longshot: 5 }, games: 3, kelly: 0, leagues: ["MLB", "NFL", "NBA", "NHL", "SOCCER", "COLLEGE"] };

  const store = {
    get(k, d) { try { const v = localStorage.getItem("sliplab:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem("sliplab:" + k, JSON.stringify(v)); } catch {} },
  };
  const C = name => getComputedStyle(document.documentElement).getPropertyValue("--" + name).trim();
  let data = {};
  try { data = JSON.parse($("#seed").textContent || "{}"); } catch {}
  let prefs = Object.assign({}, DEFAULTS, store.get("prefs", {}));
  prefs.split = Object.assign({}, DEFAULTS.split, prefs.split);
  let tab = (location.hash || "").slice(1) || store.get("tab", "today");
  let league = store.get("league", "ALL");
  if (!LEAGUES.some(l => l[0] === league)) league = "ALL";
  let slipMode = store.get("slip", "sgp"); // Games tab: same-game parlays or multi-game (traditional) slips
  let recKind = "all"; // Record tab: all slips, SGP only or Traditional only
  const kindOf = b => b.kind || "sgp";
  let betFilter = "all";
  let betLimit = 10; // Every bet list shows 10 at a time
  let scope = store.get("scope", "all"); // "all" picks or "mine" (bets you marked placed)
  // Owner check: only a device with the owner's alerts topic saved (or the owner's private preview) loads the
  // owner's placed bets and settings from data.json. Anyone else with the link gets the picks with their own
  // settings and a Bet History of their own. The hash is of "sigma-locks:" + topic, so the topic stays private.
  const OWNER_HASH = "7ee2a0060f4f8a7646b54ead8f43531359c05037b1f27c1167311879a1e44a6e";
  let owner = false;
  async function checkOwner() {
    if (window.claude?.use) return true;
    const t = store.get("ntfyTopic", "");
    if (!t || !crypto?.subtle) return false;
    try {
      const h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("sigma-locks:" + t));
      return [...new Uint8Array(h)].map(x => x.toString(16).padStart(2, "0")).join("") === OWNER_HASH;
    } catch { return false; }
  }
  // A guest device's first visit after this change: set aside anything it picked up from the owner's data
  // (kept under "guestBackup", restored if the owner's topic is saved here later) so Bet History starts fresh.
  function guestFreshStart() {
    if (store.get("guestFresh", false)) return;
    store.set("guestBackup", { placed: [...placed], placedInfo, placedAt });
    placed = new Set(); placedInfo = {}; placedAt = {};
    store.set("placed", []); store.set("placedInfo", {}); store.set("placedAt", {});
    store.set("guestFresh", true);
  }
  async function refreshOwner() {
    owner = await checkOwner();
    if (owner) {
      const bk = store.get("guestBackup", null);
      if (bk) { (bk.placed || []).forEach(id => placed.add(id)); placedInfo = { ...(bk.placedInfo || {}), ...placedInfo }; placedAt = { ...(bk.placedAt || {}), ...placedAt }; store.set("guestBackup", null); }
      for (const id of ledgerPlaced()) placed.add(id);
      store.set("guestFresh", false);
      adoptFromData();
      store.set("placed", [...placed]); store.set("placedInfo", placedInfo); store.set("placedAt", placedAt);
    } else guestFreshStart();
  }
  // Bets the ledger records as placed (logged by Claude when you say so) count on the owner's devices, on top of taps.
  const ledgerPlaced = () => owner ? (data.bets || []).filter(b => b.placed).map(b => b.id) : [];
  let placed = new Set([...store.get("placed", []), ...ledgerPlaced()]);
  // What you actually bet: the units and dollars per unit locked in when you tapped "I placed this".
  // Changing the Bankroll sliders later never changes a placed bet's dollars.
  let placedInfo = store.get("placedInfo", {});
  let placedDb = null;
  // Bell: alerts only for games and slips you watch. Each tap posts {key, on} to your private "<topic>-watch"
  // ntfy topic, which the alert checker reads every 10 minutes. Keys: game:<espn id>, trad:<date>, bet:<id>.
  let watching = new Set(store.get("watch", []));
  let watchDb = null;
  const BELL = `<svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>`;
  const bell = (key, label) => `<button class="bell" data-watch="${esc(key)}" data-watch-label="${esc(label)}" aria-pressed="${watching.has(key)}" aria-label="${watching.has(key) ? "Stop alerts for" : "Get alerts for"} ${esc(label)}">${BELL}</button>`;
  function toast(msg) {
    document.querySelector(".toast")?.remove();
    const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
    setTimeout(() => t.remove(), 4200);
  }
  async function setWatch(key, label, on) {
    const topic = store.get("ntfyTopic", "");
    on ? watching.add(key) : watching.delete(key);
    store.set("watch", [...watching]);
    render();
    if (watchDb) (on ? watchDb.doc(key.replace(/[^\w-]/g, "_")).set({ key, label, on: true, at: new Date().toISOString() }) : watchDb.doc(key.replace(/[^\w-]/g, "_")).delete()).catch(() => {});
    if (!topic) { toast(on ? "Saved. To get these alerts on your phone, add your alerts topic once in Settings." : "Alerts off."); return; }
    try {
      const r = await fetch(`https://ntfy.sh/${encodeURIComponent(topic)}-watch`, { method: "POST", body: JSON.stringify({ key, label, on }) });
      if (!r.ok) throw new Error(r.status);
      toast(on ? `Alerts on for ${label}: odds moves, pick changes, injury news, lock, live legs and the result.` : `Alerts off for ${label}.`);
    } catch {
      toast(watchDb ? (on ? "Saved. Alerts start after the next refresh." : "Alerts off after the next refresh.") : "Couldn't reach the alert service. Try again in a moment.");
    }
  }
  // Pick toggles (Settings): leagues and teams that get picks. Off lists only, so new teams are on by default.
  // Saved on the device, in the artifact database (collection "prefs", doc "filters") and on "<topic>-prefs"
  // for the website; each refresh reads the newest copy. Eliminated postseason teams can't be toggled.
  const blankFilters = () => ({ updated: "", off_leagues: [], off_teams: {} });
  let filters = (() => { const a = store.get("filters", null), b = data.filters; return (a && (!b || (a.updated || "") >= (b.updated || ""))) ? a : (b || blankFilters()); })();
  filters.off_leagues = filters.off_leagues || []; filters.off_teams = filters.off_teams || {};
  let prefsDb = null, filtTimer = null;
  function teamGroups(lg) {
    const t = data.teams && data.teams.leagues && data.teams.leagues[lg];
    if (t && t.groups && t.groups.length) return { post: !!t.postseason, groups: t.groups };
    // Before the first team-list refresh: teams in this week's games, grouped by conference in college.
    const seen = {};
    for (const g of (data.schedule && data.schedule.games) || []) {
      if (g.league !== lg) continue;
      for (const s of ["home", "away"]) {
        const id = g[s + "_id"]; if (!id) continue;
        const grp = lg === "NCAAF" ? (g[s + "_conf"] || CFB_TEAM_CONF[g[s]] || "Other") : "This week's teams";
        (seen[grp] = seen[grp] || {})[id] = { id, abbr: g[s], name: g[s + "_name"] || g[s] };
      }
    }
    return { post: false, partial: true, groups: Object.keys(seen).sort().map(name => ({ name, teams: Object.values(seen[name]).sort((a, b) => (a.name || "").localeCompare(b.name || "")) })) };
  }
  const offSet = lg => new Set(filters.off_teams[lg] || []);
  const leagueOn = lg => !filters.off_leagues.includes(lg);
  function switchState(teams, off) {
    const live = teams.filter(t => !t.out);
    if (!live.length) return "false";
    const n = live.filter(t => !off.has(t.id)).length;
    return n === live.length ? "true" : n === 0 ? "false" : "mixed";
  }
  function saveFilters(msg) {
    filters.updated = new Date().toISOString();
    for (const k of Object.keys(filters.off_teams)) if (!filters.off_teams[k].length) delete filters.off_teams[k];
    store.set("filters", filters);
    render();
    clearTimeout(filtTimer);
    filtTimer = setTimeout(async () => {
      if (prefsDb) prefsDb.doc("filters").set(filters).catch(() => {});
      const topic = topicNow();
      if (topic) await postSync("prefs", { key: "filters", ...filters });
      if (!topic && !prefsDb) toast("Saved on this device. Add your alerts topic below so the picks run gets your toggles.");
      else if (msg) toast(msg);
    }, 700);
  }
  function setTeams(lg, ids, on) {
    const off = offSet(lg);
    for (const id of ids) on ? off.delete(id) : off.add(id);
    filters.off_teams[lg] = [...off];
    if (on && !leagueOn(lg)) filters.off_leagues = filters.off_leagues.filter(x => x !== lg);
  }
  function viewFilters() {
    const sw = (attrs, state, label, sm, disabled) => `<button class="sw${sm ? " sm" : ""}" role="switch" aria-checked="${state}" aria-label="${esc(label)}" ${attrs}${disabled ? " disabled" : ""}></button>`;
    const rows = LEAGUES.filter(([k]) => k !== "ALL").map(([lg, nm]) => {
      const tg = teamGroups(lg), { post, partial } = tg, off = offSet(lg), on = leagueOn(lg);
      const groups = (lg === "NCAAF" || lg === "NCAAB") ? [...tg.groups].sort((a, b) => ((CONF_ORDER.indexOf(a.name) + 1) || 99) - ((CONF_ORDER.indexOf(b.name) + 1) || 99) || a.name.localeCompare(b.name)) : tg.groups;
      const all = groups.flatMap(g => g.teams), live = all.filter(t => !t.out), nOn = live.filter(t => !off.has(t.id)).length;
      const lstate = !on ? "false" : off.size && nOn < live.length ? (nOn ? "mixed" : "false") : "true";
