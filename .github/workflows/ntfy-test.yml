name: Alert test
on:
  push:
    paths: [".github/workflows/ntfy-test.yml"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send a test alert
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo "NTFY_TOPIC secret is missing"; exit 1; fi
          curl -fsS -H "Title: Slip Lab test" -H "Tags: white_check_mark" \
            -d "Phone alerts are working. You'll get pings for new picks, live legs and graded bets." \
            "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
